          if(w&&w.place&&!val('pName').trim()) $('#pName').value=guess||w.place;
          $('#pPos').textContent='📍 From the photo\'s GPS'+(txt?'':' (pinned)')+'. Type over it or tap Find to change.';
        }catch(e){ if(form.isConnected) $('#pPos').textContent='📍 From the photo\'s GPS (pinned).'; }
      }
      $('#pLoc').addEventListener('input',()=>{ locDirty=true; $('#pPos').textContent=val('pLoc').trim()?'Tap Find to pick the exact place, or just save and it gets placed from what you typed.':''; });
      $('#pClr').onclick=()=>{ pos=null; locDirty=false; $('#pLoc').value=''; $('#pFound').innerHTML=''; $('#pPos').textContent='No location. Saving will place it from the name and city.'; };
      placeFinder(trip, $('#pFind'), $('#pFound'), ()=>val('pLoc')||val('pName'), nearTxt, r=>{
        if(!val('pName').trim()) $('#pName').value=r.name;
        pos={lat:r.lat, lon:r.lon}; locDirty=false; $('#pLoc').value=[r.name,r.address].filter(Boolean).join(', ');
        setCity(townOf(r.address)||r.city);
        $('#pPos').textContent='📍 Pinned on the map'; });
      // a meal: time of day picks breakfast/lunch/dinner until the type is chosen by hand
      let catTouched=!!p;
      const sportF=()=>{ const f=$('#pSportF'), v=$('#pViaF'); if(f) f.hidden=!SPORTS.has(val('pCat')); if(v) v.hidden=!SPORTS.has(val('pCat')); }; $('#pCat').addEventListener('change', sportF);
      $('#pCat').onchange=()=>{ catTouched=true; $('#pTitle').textContent=(p?'Edit ':'Add ')+(isMeal(val('pCat'))?'a meal':'an activity').replace(/^a(n)? /, p?'':'$&'); };
      $('#pTime').addEventListener('change',()=>{ if(!catTouched&&isMeal(val('pCat'))&&val('pTime')) $('#pCat').value=mealFor(val('pTime'),val('pName')); });
      $('#pName').addEventListener('change',()=>{ if(!catTouched&&isMeal(val('pCat'))) $('#pCat').value=mealFor(val('pTime'),val('pName')); });
      if(p) $('#xDel').onclick=()=>confirmDelete(form,'"'+p.name+'"', ()=>del('places', p.id));
      $('#pCost').addEventListener('input',()=>{ $('#pPaidF').hidden=!(parseFloat(val('pCost').replace(',','.'))>0); });
      // the reverse of "Make it a meal": keep it as a plain expense (photos, place and time move with it)
      $('#pToExp').onclick=async()=>{ const b=$('#pToExp'); b.disabled=true;
        try{ const c=parseFloat(val('pCost').replace(',','.')), date=val('pDate')||todayStr(), city=val('pCity').trim();
          const same=city?tStops.filter(s=>sameCity(s.city,city)):[]; let st=same.find(s=>s.arrive<=date&&date<=(s.depart||s.arrive))||same[0];
          if(!st&&city) st=await ensureStop(trip, city, date, date); if(!st) st=stopOnDate(trip.id,date)||cur;
          const data={tripId:trip.id, label:val('pName').trim()||CAT_LABEL[val('pCat')]||'Expense', amount:isFinite(c)?c:0, currency:val('pCur'), category:isMeal(val('pCat'))?'Food & drink':val('pCat')==='shopping'?'Shopping':val('pCat')==='hotel'?'Lodging':'Activities',
            date, time:val('pTime'), city:st.city, stopId:st.id, paidBy:val('pPaid').trim()||lastPayer(trip.id), notes:val('pNotes').trim(), photoIds, address:val('pLoc').trim(), createdAt:now(), updatedAt:now()};
          if(pos){ data.lat=pos.lat; data.lon=pos.lon; }
          await put('expenses', null, data); if(p) await del('places', p.id);
          closeSheet(); toast('Moved to expenses'); }
        catch(e){ b.disabled=false; const er=$('#fErr'); er.hidden=false; er.textContent=String((e&&e.message)||e); } };
      form.onsubmit=async e=>{ e.preventDefault();
        const name=val('pName').trim(); if(!name){ const er=$('#fErr'); er.hidden=false; er.textContent='Say what it was (a name is enough).'; return; }
        const date=val('pDate'); let city=val('pCity').trim(), st;
        const same=city?tStops.filter(s=>sameCity(s.city,city)):[];
        let wantCity='';
        if(same.length) st=same.find(s=>date&&s.arrive<=date&&date<=(s.depart||s.arrive))||same[0];
        else if(status==='want'&&!date){ wantCity=city; st={id:'', city}; } // a to-do: no day yet, so no stop yet (made when it's ticked)
        else if(city){ // a city the trip hasn't had yet (from the photo or typed): add it
          try{ $('#pSave').disabled=true; st=await ensureStop(trip, city, date, date, false, pos&&pos.lat!=null?{lat:pos.lat, lon:pos.lon, loose:true}:null); }
          catch(err){ st=(date&&stopOnDate(trip.id,date,val('pTime')))||cur; } } // couldn't place the town: file it under where you were then
        else { // no town given: the trip town nearest the pin, else where you were at that time (not just where you woke up)
          const nb=pos&&pos.lat!=null?tStops.filter(s=>!s.home&&s.lat!=null).map(s=>[haversine(s,pos),s]).sort((a,b)=>a[0]-b[0])[0]:null;
          st=(nb&&nb[0]<15?nb[1]:null)||(date&&stopOnDate(trip.id,date,val('pTime')))||cur; }
        city=st.city;
        const c=parseFloat(val('pCost').replace(',','.'));
        // a position Claude guessed for another name is stale; a photo's GPS stays
        const keep=pos&&(pos.name==null||pos.name===name);
        const loc=val('pLoc').trim();
        const sport=SPORTS.has(val('pCat')), kmIn=parseFloat(val('pKm').replace(',','.')), dm=val('pDur').trim().match(/^(\d+)(?:[:h.](\d{1,2}))?$/);
        const viaIn=val('pVia').split(/\s*(?:,|→|->|>|;)\s*/).map(x=>x.trim()).filter(Boolean);
        const sportData=sport?{via:viaIn.length>1?viaIn:null, distanceKm:isFinite(kmIn)&&kmIn>0?Math.round(kmIn*100)/100:null, movingS:dm?(dm[2]!=null?(+dm[1])*3600+(+dm[2])*60:(+dm[1])*60):null}:{};
        const data=Object.assign({}, pre&&pre.extra||{}, sportData, (opts.todo||p&&p.todo)?{todo:true}:{}, {city:wantCity}, {tripId:trip.id, stopId:st.id, name, address:loc, category:val('pCat'), date, time:val('pTime'), private:$('#pPriv').checked, status, rating, cost:isFinite(c)?c:0, paidBy:isFinite(c)&&c>0?val('pPaid').trim():'', currency:val('pCur'), notes:val('pNotes').trim(), photoIds, updatedAt:now()});
        if(keep){ data.lat=pos.lat; data.lon=pos.lon; }
        { const b=bizRead('pBiz', trip, date); if(b!==undefined) data.biz=b; }

        if(p){ if(!keep&&p.lat!=null){ data.lat=null; data.lon=null; } if(p.date!==date) data.dayPos=null; await patch('places', p.id, data); }

        else if(!keep&&id) locatePlaces([Object.assign({id}, data)]).catch(()=>{});
      };
    });
  }

  function payers(tid){ const set=new Set(['Me']); ((tripOf(tid)||{}).people||[]).forEach(x=>{ if(x.name) set.add(x.name); }); S.expenses.concat(S.places, S.legs, S.stays).filter(e=>e.tripId===tid&&e.paidBy).forEach(e=>set.add(e.paidBy)); return [...set]; }
  function lastPayer(tid){ const l=S.expenses.concat(S.places, S.legs, S.stays).filter(e=>e.tripId===tid&&e.paidBy).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))[0]; return l?l.paidBy:'Me'; }

  const EXP_CATS=['Transport','Lodging','Food & drink','Activities','Shopping','Laundry','Fees & insurance','Other'];
  function expenseSheet(trip, x, files, pre){
    const cats=EXP_CATS;
    const canRead=!!(sample&&sampleImages);
    let photoIds=pre?pre.photoIds.slice():x?(x.photoIds||[]).slice():[], picked=pre?pre.picked.slice():[], uploading=false, reading=false;
    const cities=[...new Set(tripStops(trip.id).filter(s=>!s.home).map(s=>s.city))];
    openSheet('<h2>'+(x?'Edit expense':'Add an expense')+'</h2>'
      + (assets||canRead?'<div class="field"><label>Receipt / photo</label><div class="photos" id="ePhotos"></div><div class="row"><label class="btn small" for="ePhotoIn">'+ICON.camera+' Add photo</label><label class="btn small" for="eScanIn">📄 Scan receipt</label><input id="eScanIn" type="file" accept="image/*" capture="environment" hidden><input id="ePhotoIn" type="file" accept="image/*" multiple hidden>'
        + (canRead?'<button type="button" class="btn small" id="eRead" hidden>'+ICON.spark+' Fill in from photo</button>':'')+'</div>'
        + '<div class="hint" id="eUp">'+(canRead&&!x?'Add a photo of the receipt and Claude fills in the amount, date and place.':'')+'</div></div>':'')

      + '<div class="row"><button class="btn primary" type="submit" id="eSave">Save</button><button class="btn" type="button" id="xCancel">Cancel</button>'+(x?'<button class="btn danger" type="button" id="xDel" style="margin-left:auto">Delete</button>':'')+'</div>',
    form=>{ $('#xCancel').onclick=closeSheet;
      if(x) $('#xDel').onclick=()=>confirmDelete(form,'this expense', ()=>del('expenses', x.id));
      const eNear=()=>val('eCity')||((stopOnDate(trip.id, val('eDate')||todayStr())||{}).city||'');
      const eloc=bindLoc(trip, 'e', form, x, ()=>val('eLabel'), eNear, (city, r)=>{
        if(r){ const lb=val('eLabel').trim(); if(!lb||lb.split(/\s+/).length<=2) $('#eLabel').value=r.name; }
        $('#eCity').value=city||(r&&r.address.split(',').pop().replace(/\d+/g,'').trim())||val('eCity'); });
      const mealHint=()=>{ $('#eMeal').hidden=val('eCat')!=='Food & drink'; };
      $('#eCat').addEventListener('change', mealHint);
      $('#eToMeal').onclick=()=>{ const a=parseFloat(val('eAmt').replace(',','.')), tm=val('eTime'), d=val('eDate')||todayStr(), city=val('eCity').trim();
        const n=val('eLabel').trim(), late=(tm&&tm>='17:00')||(!tm&&/dinner|d[îi]ner|drinks?|bar\b|ap[ée]ro/i.test(n));
        const st=(city&&tripStops(trip.id).find(s=>sameCity(s.city,city)))||(late?eveningStop(trip.id,d):stopOnDate(trip.id,d));
        closeSheet();
        placeSheet(st||null, null, {trip, replaces:x||null, prefill:{name:n, category:mealFor(tm,n), date:d, time:tm, cost:isFinite(a)?a:'', currency:val('eCur'), notes:val('eNote').trim(), photoIds}}); };
      const hint=t=>{ const el=$('#eUp'); if(el) el.textContent=t; };
      const sync=()=>{ if(!form.isConnected) return; $('#eSave').disabled=uploading||reading;
        const rb=$('#eRead'); if(rb){ rb.hidden=!(picked.length||photoIds.length); rb.disabled=uploading||reading; } };
      const orig=photoIds.slice(), added=[];
      const scIn=$('#eScanIn'); if(scIn) scIn.onchange=async()=>{ const f=(scIn.files||[])[0]; scIn.value=''; if(!f) return;
        // the scan drops the photo's GPS, so take the location from the original first
        if(!eloc.pos&&!eloc.text()){ const m=await readExif(f).catch(()=>null); if(m&&m.lat!=null&&form.isConnected) eloc.fromGps(m.lat, m.lon); }
        const out=await scanDoc(f); if(out&&form.isConnected) addFiles([out], true); };
      const eEl=$('#ePhotos'), drawEd=eEl?photoEditor(eEl, ()=>photoIds, v=>{ photoIds=v; }, sync):null;
      const drawPhotos=()=>{ if(drawEd) drawEd(); sync(); };
      drawPhotos();
      async function addFiles(fs, autoRead){
        picked=picked.concat(fs);
        if(assets){ uploading=true; sync(); hint('Uploading…'); const up=await uploadPhotos(fs); added.push(...up); photoIds=photoIds.concat(up); uploading=false; if(!form.isConnected) return; drawPhotos(); hint(''); }
        sync();
        if(!eloc.pos&&!eloc.text()){ const m=await readExif(fs[0]); if(m&&m.lat!=null&&form.isConnected) eloc.fromGps(m.lat, m.lon); }
        if(autoRead&&canRead) await fill(); else if(!assets) hint('');
      }
      function applyResult(r){
          if(r.gps&&!eloc.text()) eloc.fromGps(r.lat, r.lon);
          const set=(id,v)=>{ if(v!=null&&v!=='') $('#'+id).value=v; };
          if(r.time) set('eTime', r.time); else if(r.date&&r.date!==todayStr()) $('#eTime').value=''; set('eLabel', r.name); set('eAmt', r.amount!=null?String(r.amount):null); set('eDate', r.date); set('eCity', r.city); set('eCat', r.expCat);
          if(r.currency){ const sel=$('#eCur'); if(![...sel.options].some(o=>o.value===r.currency)) sel.add(new Option(r.currency)); sel.value=r.currency; }
          if(r.notes&&!val('eNote').trim()) $('#eNote').value=r.notes;

          hint(r.amount==null?'Couldn\'t read a total. Add the amount, then save.':'Filled in from the photo. Check it, then save.');
      }
      async function fill(){
        let imgs=picked.slice(-sampleImages);
        if(!imgs.length&&photoIds.length){ try{ const r=await fetch('/_blob/'+photoIds[photoIds.length-1]); if(r.ok) imgs=[await r.blob()]; }catch(e){} }
        if(!form.isConnected) return;
        if(!imgs.length){ hint('Add the photo again so Claude can read it.'); return; }

        try{
          const r=await readPhoto(trip, imgs, 'expense');
          if(!form.isConnected) return;

      const pin=$('#ePhotoIn'); if(pin) pin.onchange=()=>{ const fs=Array.from(pin.files||[]); pin.value=''; if(fs.length) addFiles(fs, !x&&!val('eLabel').trim()&&!val('eAmt').trim()); };
      const rb=$('#eRead'); if(rb) rb.onclick=fill;
      if(files&&files.length) addFiles(files, true);
      if(pre){ applyResult(pre.result); sync(); }
      mealHint();
      form.onsubmit=async e=>{ e.preventDefault(); const a=parseFloat(val('eAmt').replace(',','.')); const label=val('eLabel').trim();
        if(!label||!isFinite(a)){ const er=$('#fErr'); er.hidden=false; er.textContent='Add what it was and an amount.'; return; }
        const city=val('eCity').trim(), st=city&&tripStops(trip.id).find(s=>sameCity(s.city,city));
        const data={tripId:trip.id, label, amount:a, currency:val('eCur'), category:val('eCat'), date:val('eDate'), time:val('eTime'), city:st?st.city:city, stopId:st?st.id:'', paidBy:val('ePaid').trim(), notes:val('eNote').trim(), photoIds, updatedAt:now()};
        data.address=eloc.text(); if(eloc.pos){ data.lat=eloc.pos.lat; data.lon=eloc.pos.lon; } else if(x&&x.lat!=null){ data.lat=null; data.lon=null; }
        if(x&&x.date!==data.date) data.dayPos=null;
        { const b=bizRead('eBiz', trip, data.date); if(b!==undefined) data.biz=b; }
        let eid=x&&x.id;
        if(x) await patch('expenses', x.id, data); else eid=(await put('expenses', null, Object.assign({createdAt:now()}, data))).id;
        eloc.afterSave('expenses', eid, data.city);
        closeSheet();
        for(const y of orig.concat(added)) if(!photoIds.includes(y)) forgetAsset(y, x); };
    });
  }

  // Ask Claude about a photo. want: 'expense' | 'activity' | 'any' (Claude decides receipt vs activity).
  // Where it happened comes from, in order: the photo's GPS near a trip city, what Claude reads or
  // recognises, then the trip city you were in on that date.
  async function readPhoto(trip, imgs, want){
    let meta=null; for(const f of imgs){ meta=await readExif(f); if(meta) break; }
    const stops=tripStops(trip.id).filter(s=>!s.home);
    let near=null;
    if(meta&&meta.lat!=null) stops.forEach(s=>{ if(s.lat==null) return; const d=haversine(meta,s); if(!near||d<near.d) near={s,d}; });
    const blobs=await Promise.all(imgs.map(shrink));
    const r=await sample.json('Look at this travel photo and turn it into an entry for a trip journal.\n'
      + 'Trip: "'+String(trip.name||'').slice(0,80)+'", '+(trip.startDate||'?')+' to '+(trip.endDate||'?')+', main currency '+(trip.currency||'EUR')+'.\n'
      + 'Cities on the trip: '+(stops.slice(0,40).map(s=>s.city+', '+(s.country||'')+' ('+(s.arrive||'?')+' to '+(s.depart||'?')+')').join('; ')||'none yet')+'.\n'
      + 'Photo metadata: '+(meta&&meta.date?'taken '+meta.date+(meta.time?' '+meta.time:''):'no date')
      + (meta&&meta.lat!=null?', GPS '+meta.lat.toFixed(5)+','+meta.lon.toFixed(5)+(near?' (≈'+Math.round(near.d)+' km from '+near.s.city+')':'')+'. The GPS is where it was taken: trust it over the list of trip cities, the trip may have moved on to a new place':', no GPS')+'.\n'
      + 'Today is '+todayStr()+'.\n'
      + (want==='expense'?'It is a receipt, bill, ticket or price tag (kind "receipt").\n'
        : want==='activity'?'It shows something the traveller did or visited: a place, view, activity, meal or event (kind "activity").\n'
        : 'Decide whether it is a receipt, bill, ticket or price tag (kind "receipt"), an accommodation booking or confirmation (kind "stay"), or a photo of a place, view, activity, meal or event (kind "activity").\n')
      + 'Reply with only a JSON object: {"kind": "receipt", "stay" or "activity", '
      + '"name": string (receipt: merchant and item, e.g. "Dinner at Bar Nestor"; a meal or a restaurant front: "<Breakfast|Lunch|Dinner|Coffee|Drinks> at <the name on the sign, menu or receipt>", e.g. "Dinner at Zoe"; activity: the specific place or activity, e.g. "Dune du Pilat", "Guggenheim Bilbao", "Surf lesson, Côte des Basques"; max 50 characters), '
      + '"amount": number or null (receipt: final total paid incl. tax and tip; activity: only if a price is visible), "currency": ISO 4217 code or null, '
      + '"expenseCategory": one of '+JSON.stringify(EXP_CATS)+', "activityCategory": one of '+JSON.stringify(CATS.map(c=>c[0]).filter(c=>c!=='food'&&c!=='restaurant'))+' (a meal is breakfast, lunch or dinner by the time it was eaten, snack for ice cream, crêpes, pastries or a bite between meals, coffee for a café stop, drinks for a bar, wine, beer, juice or a soft drink; run, ride and hike only when the photo clearly shows that sport (running kit, a bike, a trail with hiking gear) — a castle, viewpoint, old town or monument reached on foot is attraction or citytour), '
      + '"date": "YYYY-MM-DD" or null (date printed on it, else the photo date), "time": "HH:MM" or null (24h time printed on it, else the photo time), '
      + '"city": string or null (the trip city it belongs to when within about 40 km of one, else the real nearest town), '
      + '"lat": number or null, "lon": number or null (where the place is: the GPS if given, else your best estimate for the place you named; null if you cannot tell), '
      + '"notes": string (one short line of useful detail: what you see, main items, ticket route; "" if nothing useful)}.', {images:blobs});
    const o=r&&typeof r==='object'?r:{};
    const num=v=>typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(',','.'));
    const amt=num(o.amount), la=num(o.lat), lo=num(o.lon);
    const out={ kind:want==='expense'?'receipt':want==='activity'?'activity':(o.kind==='receipt'||o.kind==='stay'?o.kind:'activity'),
      name:String(o.name||o.label||'').trim().slice(0,80), amount:isFinite(amt)?Math.round(amt*100)/100:null,
      currency:/^[A-Za-z]{3}$/.test(o.currency||'')?o.currency.toUpperCase():'',
      expCat:EXP_CATS.includes(o.expenseCategory)?o.expenseCategory:'', actCat:CAT_LABEL[o.activityCategory]?o.activityCategory:'',
      date:/^\d{4}-\d\d-\d\d$/.test(o.date||'')?o.date:(meta&&meta.date)||'', time:/^\d\d:\d\d/.test(o.time||'')?o.time.slice(0,5):((meta&&meta.time)||''), notes:String(o.notes||'').trim().slice(0,300), city:'', lat:null, lon:null };
    if(meta&&meta.lat!=null){ out.lat=meta.lat; out.lon=meta.lon; out.gps=true; }
    else if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180&&(la||lo)){ out.lat=la; out.lon=lo; }
    if(near&&near.d<40) out.city=near.s.city;
    if(!out.city&&o.city){ const m=stops.find(s=>norm(s.city)===norm(o.city)); out.city=m?m.city:String(o.city).slice(0,80); }
    if(!out.city&&out.lat!=null){ let b=null; stops.forEach(s=>{ if(s.lat==null) return; const d=haversine(out,s); if(d<40&&(!b||d<b.d)) b={s,d}; }); if(b) out.city=b.s.city; }
    if(!out.city&&out.date&&!out.gps){ const s=stopOnDate(trip.id,out.date); if(s) out.city=s.city; }
    return out;
  }
  function photoError(e){ const c=e&&e.code;
    return c==='not_granted'||c==='sampling_disabled'?'Claude isn\'t allowed here. Fill it in by hand.'
      : c==='image_rejected'?'Claude couldn\'t open that image. Try a JPEG or a sharper shot.'
      : c==='rate_limited'?'Too many requests. Try again in a minute.'
      : c==='cancelled'?'' : 'Couldn\'t read the photo. Try again, or fill it in by hand.'; }

  // Search for a real place ("Enterprise", "oyster bar", "bakery") near a trip city. Artifacts can't reach
  // map services, so Claude answers from what it knows: good for well-known places, worth a glance for small ones.
  async function findPlaces(q, near){
    const r=await sample.json('A traveller wants to find a place. Search: '+JSON.stringify(String(q).slice(0,120))+'. Near: '+JSON.stringify(near||'')+'.\n'
      + 'List up to 5 real places that match, closest to "near" first (for a brand or chain, its branches in that area: airport, station, town centre). '
      + 'Reply with only a JSON array of {"name": string (as signposted, e.g. "Enterprise Rent-A-Car – Bordeaux Gare Saint-Jean"), "address": string (street, postcode, town), "what": string (2-4 words, e.g. "car rental"), "lat": number, "lon": number}. '
      + 'Only places you are fairly sure exist; [] if none.', {cache:{gcTime:86400000}});
    return (Array.isArray(r)?r:[]).map(x=>({name:String(x.name||'').slice(0,90), address:String(x.address||'').slice(0,140), what:String(x.what||'').slice(0,40), lat:+x.lat, lon:+x.lon}))
      .filter(x=>x.name&&isFinite(x.lat)&&isFinite(x.lon)&&Math.abs(x.lat)<=90&&Math.abs(x.lon)<=180).slice(0,5);
  }
  // What's at a photo's GPS point (Claude, from what it knows): a place name if clear, and an address.
  async function whereIs(lat, lon){
    if(!sample) return null;
    const r=await sample.json('A photo was taken at latitude '+lat.toFixed(5)+', longitude '+lon.toFixed(5)+'. Work out where that is from the coordinates alone (they can be anywhere in the world). '
      +'Reply with only JSON {"place": the landmark, venue, beach or park at that spot if you are fairly sure, else "", "address": street or neighbourhood, postcode and town, "city": the town or city it belongs to, "country": the country}.', {cache:{gcTime:86400000}});
    return r&&typeof r==='object'?{place:String(r.place||'').slice(0,80), address:String(r.address||'').slice(0,140), city:String(r.city||'').slice(0,60), country:String(r.country||'').slice(0,40)}:null;
  }
  // A Location field: a photo's GPS pins it (Claude names the spot), or type / 🔎 Find / ✕ by hand.
  const locFieldHtml=(id, init, ph)=>'<div class="field"><label for="'+id+'Loc">Location</label><div style="display:flex;gap:6px"><input id="'+id+'Loc" autocomplete="off" value="'+esc(init||'')+'" placeholder="'+esc(ph||'Filled from the photo, or type a place or address')+'" style="flex:1;min-width:0">'
    + '<button type="button" class="btn small" id="'+id+'Find">🔎 Find</button><button type="button" class="btn small ghost" id="'+id+'Clr" aria-label="Remove the location">✕</button></div><div id="'+id+'Found"></div><div class="hint" id="'+id+'Pos"></div></div>';
  function bindLoc(trip, id, form, init, getName, getNear, onCity){
    const L={pos:init&&init.lat!=null?{lat:init.lat, lon:init.lon}:null, dirty:false};
    const inp=$('#'+id+'Loc'), hint=t=>{ $('#'+id+'Pos').textContent=t; };
    if(L.pos) hint('📍 Pinned on the map');
    inp.addEventListener('input',()=>{ L.dirty=true; hint(inp.value.trim()?'Tap Find to pick the exact place, or just save and it gets placed from what you typed.':''); });
    $('#'+id+'Clr').onclick=()=>{ L.pos=null; L.dirty=false; inp.value=''; $('#'+id+'Found').innerHTML=''; hint(''); };
    placeFinder(trip, $('#'+id+'Find'), $('#'+id+'Found'), ()=>inp.value||getName(), getNear, r=>{
      L.pos={lat:r.lat, lon:r.lon}; L.dirty=false; inp.value=[r.name,r.address].filter(Boolean).join(', '); hint('📍 Pinned on the map'); if(onCity&&r.city) onCity(r.city, r); });
    L.fromGps=async(lat, lon)=>{ L.pos={lat, lon}; L.dirty=false; hint('📍 From the photo\'s GPS'+(sample?' · looking up the place…':''));
      let near=null; tripStops(trip.id).filter(s=>!s.home&&s.lat!=null).forEach(s=>{ const d=haversine({lat,lon},s); if(d<40&&(!near||d<near.d)) near={s,d}; });
      if(near&&onCity) onCity(near.s.city);
      try{ const w=await whereIs(lat, lon); if(!form.isConnected||!L.pos||L.pos.lat!==lat) return;
        if(!near&&w&&w.city&&onCity) onCity(w.city);
        const txt=w?[w.place,w.address].filter(Boolean).join(', '):''; if(txt&&!L.dirty) inp.value=txt;
        hint('📍 From the photo\'s GPS. Type over it or tap Find to change.'); }catch(e){ if(form.isConnected) hint('📍 From the photo\'s GPS (pinned).'); } };
    // after saving: what was typed by hand gets placed
    L.afterSave=(col, docId, near)=>{ const t=inp.value.trim(); if(docId&&t&&L.dirty) findPlaces(t, near).then(rs=>{ if(rs[0]) return patch(col, docId, {lat:rs[0].lat, lon:rs[0].lon}); }).catch(()=>{}); };
    L.text=()=>inp.value.trim();
    return L;
  }
  // A "🔎 Find" button + result list. getQ/getNear read the form; onPick gets {name,address,lat,lon,city}.
  function placeFinder(trip, btn, out, getQ, getNear, onPick){
    if(!sample){ btn.hidden=true; return; }
    btn.onclick=async()=>{ const q=getQ().trim(); if(!q){ out.innerHTML='<div class="hint">Type what you\'re looking for first, e.g. "Enterprise" or "oyster bar".</div>'; return; }
      btn.disabled=true; out.innerHTML='<div class="hint">Searching near '+esc(getNear())+'…</div>';
      try{ const rs=await findPlaces(q, getNear()); if(!out.isConnected) return;
        if(!rs.length){ out.innerHTML='<div class="hint">Nothing found. Try another spelling or a bigger town nearby.</div>'; return; }
        out.innerHTML='<div class="found">'+rs.map((r,i)=>'<button type="button" data-f="'+i+'"><b>'+esc(r.name)+'</b><small>'+esc([r.what,r.address].filter(Boolean).join(' · '))+'</small></button>').join('')+'</div><div class="hint">From Claude\'s knowledge, not a live map: check the address for small places.</div>';
        out.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const r=rs[+b.dataset.f];
          let near=null; tripStops(trip.id).filter(s=>!s.home&&s.lat!=null).forEach(s=>{ const d=haversine(r,s); if(d<40&&(!near||d<near.d)) near={s,d}; });
          r.city=near?near.s.city:''; out.innerHTML='<div class="hint">📍 '+esc(r.name)+(r.address?' · '+esc(r.address):'')+'</div>'; onPick(r); });
      }catch(e){ out.innerHTML='<div class="hint">'+esc(photoError(e)||'Search failed. Try again.')+'</div>'; }
      finally{ btn.disabled=false; } };
  }

  // Coordinates for activities that have none, so they get a pin. One quick Claude call for the lot.
  async function locatePlaces(list){
    if(!sample||!list.length) return 0;
    const rows=list.slice(0,40).map((p,i)=>{ const s=stopOf(p.stopId)||{}; return {i, name:p.name, near:[s.city,s.country].filter(Boolean).join(', ')}; });
    const r=await sample.json('Give coordinates for each of these places a traveller logged. Reply with only a JSON array of {"i": number, "lat": number, "lon": number}, '
      +'one per place you can locate (skip ones you cannot). Places: '+JSON.stringify(rows), {modelTier:'quick', cache:{gcTime:86400000}});
    let n=0;
    for(const x of Array.isArray(r)?r:[]){ const p=list[+x.i]; const la=+x.lat, lo=+x.lon;
      if(!p||!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180) continue;
      const s=stopOf(p.stopId); if(s&&s.lat!=null&&haversine({lat:la,lon:lo},s)>300) continue; // implausibly far from its city
      try{ await patch('places', p.id, {lat:la, lon:lo}); n++; }catch(e){}
    }
    return n;
  }

  // ---------- tracks: Strava (via the viewer's Strava connector) and GPX files ----------
  // Imported runs/rides/hikes become activities with: track [[lat,lon],…] (≤400 points), distanceKm,
  // movingS, elevM, sport, and stravaId when they came from Strava.
  const STRAVA='Strava';
  function sportCat(s){ s=String(s||'').toLowerCase();
    if(/run|jog|^9$/.test(s)) return 'run'; if(/hike|^4$/.test(s)) return 'hike'; if(/walk|^10$/.test(s)) return 'walk';
    if(/ride|bike|cycl|^1$/.test(s)) return 'ride'; return 'other'; }
  const SPORT_ICON={run:'🏃',hike:'🥾',walk:'🚶',ride:'🚴',other:'⚡'};
  function fmtDur(s){ s=Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?h+'h'+pad2(m):m+' min'; }
  function statsLine(p){
    if(!p||!p.distanceKm) return '';
    const parts=[(+p.distanceKm).toFixed(p.distanceKm<10?2:1)+' km'];

  // ---------- days ----------
  function addDays(s, n){ const [y,m,d]=s.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate()); }
  // where the day ended: the last leg's destination that day, else the city you were in
  function eveningStop(tid, d){ const l=tripLegs(tid).filter(x=>x.date===d).pop(), s=l&&stopOf(l.toId); return s&&!s.home?s:stopOnDate(tid,d); }
  // where you woke up on day d: the stay covering the night before, else where the last earlier leg took you
  function morningStop(tid, d){ const prev=addDays(d,-1);
    const st=staysOnNight(tid, prev)[0], ss=st&&stopOf(st.stopId); if(ss&&!ss.home) return ss;
    const l=tripLegs(tid).filter(x=>x.date&&x.date<d).pop(), ls=l&&stopOf(l.toId);
    // a planned stop that starts after that leg (an itinerary city with no leg yet) is newer news
    const plan=tripStops(tid).filter(x=>!x.home&&x.arrive&&x.arrive<d&&(!l||x.arrive>l.date)).pop();
    if(plan) return plan;
    return ls&&!ls.home?ls:null; }
  // where you were on day d (at time tm when known): after the day's last leg that had arrived by then, else where you woke up
  function stopOnDate(tid, d, tm){
    if(tm){ const ls=tripLegs(tid).filter(l=>l.date===d&&(l.arrTime||legTime(l))&&(l.arrTime||legTime(l))<=tm), l=ls.pop(), s=l&&stopOf(l.toId); if(s&&!s.home) return s; }
    const m=morningStop(tid, d); if(m) return m; const xs=tripStops(tid).filter(s=>!s.home&&s.arrive&&s.arrive<=d&&d<=(s.depart||s.arrive)); return xs.find(s=>s.arrive!==d)||xs[xs.length-1]||null; }
  // The towns of a day, from what happened: where you woke up, the day's legs, activities, expenses and the night's stay.
  // An empty day shows only the towns planned to start that day (itinerary stops), never a stop whose stored
  // date range was stretched by an old edit.
  function dayCities(t, d){ const out=[], add=s=>{ if(s&&!s.home&&s.city&&!out.some(c=>cityKey(c)===cityKey(s.city))) out.push(s.city); };
    const legs=tripLegs(t.id).filter(l=>l.date===d), xs=S.places.filter(p=>p.tripId===t.id&&p.date===d).concat(S.expenses.filter(e=>e.tripId===t.id&&e.date===d));
    const night=d<t.endDate?staysOnNight(t.id, d)[0]:null;
    if(legs.length||xs.length||night){ if(d<=todayStr()||legs.length) add(morningStop(t.id, d));
      legs.forEach(l=>{ add(stopOf(l.fromId)); add(stopOf(l.toId)); }); xs.forEach(x=>add(stopOf(x.stopId))); if(night) add(stopOf(night.stopId)); return out; }
    if(d<=todayStr()) add(morningStop(t.id, d));
    tripStops(t.id).filter(s=>s.arrive===d).forEach(add);
    return out; }
  // One day's items in the order they happened. Times win when known. Otherwise an item goes with
  // its city: after the leg that brings you there, before the leg that takes you on. Items with no
  // city go last. Inside a stretch: by time, then by when they were logged that day.
  function loggedAt(x, d){ const c=new Date(x.createdAt||''); if(isNaN(c)) return '';
    return (c.getFullYear()+'-'+pad2(c.getMonth()+1)+'-'+pad2(c.getDate()))===d?pad2(c.getHours())+':'+pad2(c.getMinutes()):''; }
  function dayOrder(d, legs, acts, exps){
    const L=chainDay(legs);
    const cityOf=x=>norm((stopOf(x.stopId)||{}).city||x.city||'');
    const seg=L.length?[norm((stopOf(L[0].fromId)||{}).city)].concat(L.map(l=>norm((stopOf(l.toId)||{}).city))):[''];
    const timedLegs=L.map((l,k)=>[legTime(l),k]).filter(z=>z[0]);
    const segOf=x=>{ const t=hhmm(x);
      // a timed entry sits between the timed legs around it, and within that window with its own city
      if(t&&timedLegs.length){ let lo=0, hi=L.length; timedLegs.forEach(([lt,k])=>{ if(lt<=t) lo=k+1; else if(k<hi) hi=k; });
        const ci=seg.indexOf(cityOf(x)); return ci<0?lo:Math.min(Math.max(ci,lo),hi); }
      const c=cityOf(x); if(!c) return L.length;
      const k=seg.indexOf(c); return k<0?L.length:k; };
    const buckets=seg.map(()=>[]);
    acts.forEach(x=>buckets[segOf(x)].push({k:'act',x})); exps.forEach(x=>buckets[segOf(x)].push({k:'exp',x}));
    const key=e=>hhmm(e.x)||loggedAt(e.x,d)||'~';
    const out=[]; buckets.forEach((b,i)=>{ b.sort((a,c)=>key(a).localeCompare(key(c))); out.push(...b); if(L[i]) out.push({k:'leg',x:L[i]}); });
    const first=out.findIndex(e=>e.x.dayPos!=null);
    if(first>=0){ let last=null;
      out.forEach((e,i)=>{ if(e.x.dayPos!=null){ last=e.x.dayPos; e.p=last; } else e.p=last==null?out[first].x.dayPos-(first-i):last+(i+1)/1000; });
      out.sort((a,b)=>a.p-b.p); }
    return out;
  }

  function daysHtml(t){
    if(!t.startDate||!t.endDate||t.endDate<t.startDate) return '';
    const n=Math.min(dayCount(t.startDate,t.endDate),90), today=todayStr(), stops=tripStops(t.id).filter(s=>!s.home);
    // while the trip is under way, days before today fold to one line (tap to open)
    const live=t.startDate<=today&&today<=t.endDate;
    let html='';
    for(let i=0;i<n;i++){ const d=addDays(t.startDate,i);
      let cities=dayCities(t, d);
      const legs=tripLegs(t.id).filter(l=>l.date===d), acts=S.places.filter(p=>p.tripId===t.id&&p.date===d), exps=S.expenses.filter(e=>e.tripId===t.id&&e.date===d);
      // in the order you were there: first timed thing done in each city, then the legs' order
      const route=legs.length?[(stopOf(legs[0].fromId)||{}).city].concat(legs.map(l=>(stopOf(l.toId)||{}).city)).map(x=>norm(x||'')):[];
      const firstT=c=>{ const ts=acts.concat(exps).filter(x=>hhmm(x)&&norm((stopOf(x.stopId)||{}).city||x.city||'')===norm(c)).map(hhmm).sort(); return ts[0]||''; };
      const wake=cities[0]===((morningStop(t.id,d)||{}).city)?cities.shift():null;
      cities.sort((a,b)=>{ const x=firstT(a), y=firstT(b); if(x&&y) return x.localeCompare(y); const i=route.indexOf(norm(a)), j=route.indexOf(norm(b)); return (i<0?99:i)-(j<0?99:j); });
      if(wake) cities.unshift(wake);
      const folded=live&&d<today&&!openDays.has(d), nThings=acts.length+exps.length, km=d3.sum(legs,l=>+l.km||0);
      const stp=tripSteps(t)[d];
      const sum=[nThings?nThings+(nThings===1?' thing':' things'):'', stp?'👟 '+(+stp).toLocaleString():'', km?(legs.some(l=>l.kmEstimated)?'≈':'')+fmtKm(km)+' km':''].filter(Boolean).join(' · ')||'nothing logged';
      html+='<div class="day'+(d===today?' today':'')+(folded?' folded':'')+'"><div class="day-h"><div class="day-t"'+(live&&d<today?' data-fold="'+d+'" role="button" aria-expanded="'+!folded+'"':'')+'><b>'+fmtDate(d,{weekday:'short',month:'short',day:'numeric'})+'</b>'+(d===today?' <span class="pill accent">Today</span>':'')
        +' <span class="faint">'+esc(cities.join(' → '))+'</span>'+(stp&&!folded?' <button type="button" class="steps-tag" data-steps="'+d+'">👟 '+(+stp).toLocaleString()+'</button>':'')+(folded?'<div class="faint">'+sum+' <span class="fold-hint">▾ show</span></div>':live&&d<today?' <span class="fold-hint">▴</span>':'')+'</div>'
        +'<div class="row" style="gap:6px;flex-wrap:nowrap;flex-shrink:0">'+(nThings||legs.length?'<button type="button" class="btn small ghost day-plus" data-dayshare="'+d+'" aria-label="Share '+fmtDate(d)+'">'+ICON.share+'</button>':'')
        +'<button type="button" class="btn small ghost day-plus" data-daymenu="'+d+'" aria-label="Add or share on '+fmtDate(d)+'">'+ICON.plus+'</button></div></div>';
      if(folded){ html+='</div>'; continue; }
      html+='<div class="day-list" data-day="'+d+'">'+dayOrder(d, legs, acts, exps).map(({k,x})=>{ const tv=hhmm(x), tm='<label class="tset'+(tv?'':' empty')+'" data-tcol="'+(k==='leg'?'legs':k==='act'?'places':'expenses')+'" data-tid="'+x.id+'">'+(tv||'+ time')+'<input type="time" value="'+tv+'" aria-label="Time"></label>';
            if(k==='leg'){ const l=x; const a=stopOf(l.fromId)||{}, b=stopOf(l.toId)||{};
            const lph=(l.photoIds||[]).slice(0,8);
            return '<div class="day-i'+(lph.length?' has-ph':'')+'" data-leg="'+l.id+'">'+tm+emo(MODE_EMOJI[l.mode]||'🚗')+'<span style="flex:1">'+esc(a.city||'?')+' → '+esc(b.city||'?')+'</span><span class="faint mono">'+(l.kmEstimated?'≈':'')+fmtKm(l.km||0)+' km</span>'
              +(lph.length?'<div class="ph-strip">'+lph.map(id=>'<img alt="" loading="lazy" src="/_blob/'+id+'" data-photo="'+id+'">').join('')+'</div>':'')+'</div>'; }
            if(k==='act'){ const p=x, ph=(p.photoIds||[]).slice(0,8); return '<div class="day-i'+(ph.length?' has-ph':'')+'" data-pl="'+p.id+'">'+tm+emo(catIcon(p.category))+'<span style="flex:1;min-width:0">'+esc(p.name)+(p.status==='want'?' <span class="faint">· planned</span>':'')+(viaTxt(p)?' <span class="faint">· '+esc(viaTxt(p))+'</span>':'')
            +(statsLine(p)?' <span class="faint">'+statsLine(p)+'</span>':'')+'</span>'+(ph.length?'<div class="ph-strip">'+ph.map(id=>'<img alt="" loading="lazy" src="/_blob/'+id+'" data-photo="'+id+'">').join('')+'</div>':'')+'</div>'; }
            const e=x; return '<div class="day-i" data-exp="'+e.id+'">'+tm+emo(expIcon(e.category,e.label))+'<span style="flex:1;min-width:0">'+esc(e.label)+'</span><span class="faint mono">'+fmtMoney(e.amount,e.currency)+'</span></div>'; }).join('')+'</div>'
        + (legs.length||acts.length||exps.length?'':'<div class="faint">Nothing logged yet</div>')
        + nightHtml(t, d)

  async function readExif(file){

      let o=2;
      while(o+10<v.byteLength){

        if(m===0xFFE1&&v.getUint32(o+4)===0x45786966) return parseTiff(v, o+10);

    }catch(e){}

  }
  function parseTiff(v, t){

    const d=ex[0x9003]||ex[0x9004]||i0[0x0132];
    const dm=d&&str(d).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
    if(dm){ out.date=dm[1]+'-'+dm[2]+'-'+dm[3]; out.time=dm[4]+':'+dm[5]; }
    if(i0[0x8825]){ const g=ifd(u32(i0[0x8825].off));
      if(g[2]&&g[4]){ const dms=a=>a[0]+(a[1]||0)/60+(a[2]||0)/3600; let lat=dms(rats(g[2])), lon=dms(rats(g[4]));

    return out.date||out.lat!=null?out:null;
  }

  // ---------- Guide (recommendations for friends) and Itinerary (for colleagues): text with map links, or a PDF ----------
  // Only what the owner picks: a date range or one city, done places (never "Keep off shares"), no who-paid, no business costs.
  const mapsLink=(name, where, lat, lon)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat!=null&&isFinite(lat)?(+lat).toFixed(5)+','+(+lon).toFixed(5):[name,where].filter(Boolean).join(', '));
  const stars=n=>n?'★'.repeat(n):'';
  function guideData(t, g){
    const inRange=d=>d&&d>=g.from&&d<=g.to, cityOf=id=>(stopOf(id)||{}).city||'', okCity=c=>!g.city||norm(c)===g.city;
    const order=[]; // towns in travel order
    const seen=new Set(), push=c=>{ if(c&&!seen.has(norm(c))){ seen.add(norm(c)); order.push(c); } };
    for(let d=g.from; d<=g.to; d=addDays(d,1)) dayCities(t,d).forEach(push);
    const by={}; const bucket=c=>{ push(c); return by[norm(c)]=by[norm(c)]||{city:c, stay:[], eat:[], doo:[]}; };
    tripStays(t.id).filter(x=>x.checkIn<=g.to&&(x.checkOut||x.checkIn)>g.from).forEach(x=>{ const c=x.city||cityOf(x.stopId); if(!okCity(c)||(g.min&&(x.rating||0)<g.min)) return;
      bucket(c).stay.push({name:x.name, icon:stayIcon(x), what:(STAY_KIND[x.kind]||STAY_KIND.other)[1], rating:x.rating||0, price:perNight(x), extra:x.platform&&x.platform!=='Other'?x.platform:'', address:x.address||'', notes:x.notes||'', lat:x.lat, lon:x.lon, photo:(x.photoIds||[])[0], c}); });
    const names=new Set();
    S.places.filter(p=>p.tripId===t.id&&p.status==='done'&&!p.private&&inRange(p.date)&&p.category!=='laundry').sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''))).forEach(p=>{
      const c=cityOf(p.stopId); if(!okCity(c)||(g.min&&(p.rating||0)<g.min)) return;
      const k=norm(c)+'|'+norm(p.name); if(names.has(k)) return; names.add(k); // a place visited twice is one recommendation
      const it={name:p.name, icon:catIcon(p.category), what:CAT_LABEL[p.category]||'', rating:p.rating||0, price:+p.cost?fmtMoney(p.cost,p.currency):'', extra:viaTxt(p), address:p.address||'', notes:p.notes||'', lat:p.lat, lon:p.lon, photo:(p.photoIds||[])[0], c};
      const b=bucket(c); (MEAL_KEYS.has(p.category)?b.eat:p.category==='hotel'?b.stay:b.doo).push(it); });
    return order.map(c=>by[norm(c)]).filter(b=>b&&(b.stay.length||b.eat.length||b.doo.length));
  }
  function itinData(t, g){
    const days=[];
    for(let d=g.from; d<=g.to; d=addDays(d,1)){ const items=[];
      // the same order as Days (drives in their place between the towns' activities)
      const legs=tripLegs(t.id).filter(l=>l.date===d), acts=g.acts?S.places.filter(p=>p.tripId===t.id&&p.date===d&&!p.private&&p.category!=='laundry'):[];
      dayOrder(d, legs, acts, []).forEach(({k,x})=>{
        if(k==='leg') items.push({t:hhmm(x)||'', icon:MODE_EMOJI[x.mode]||'🚗', text:((stopOf(x.fromId)||{}).city||'?')+' → '+((stopOf(x.toId)||{}).city||'?')+(hhmm(x)&&x.arrTime?' (arrive '+x.arrTime+')':'')+(+x.km?' · '+fmtKm(x.km)+' km':'')});
        else if(k==='act') items.push({t:hhmm(x)||'', icon:catIcon(x.category), text:x.name+(x.status==='want'?' (planned)':''), lat:x.lat, lon:x.lon, address:x.address||''}); });
      staysOnNight(t.id, d).forEach(x=>items.push({t:'', icon:'🛏', text:x.name+(x.checkIn===d?' — check in':''), address:x.address||x.city||'', ref:g.refs&&x.checkIn===d?x.bookingRef||'':'', lat:x.lat, lon:x.lon}));
      if(items.length||!g.skipEmpty) days.push({d, cities:dayCities(t,d), items}); }

  }
  function guideTitle(t, g){ const c=g.city?(tripStops(t.id).find(s=>norm(s.city)===g.city)||{}).city:''; return (c||t.name||'Trip'); }
  function guideRange(g){ return g.from===g.to?fmtDate(g.from,{weekday:'short',month:'short',day:'numeric',year:'numeric'}):fmtDate(g.from,{month:'short',day:'numeric'})+' – '+fmtDate(g.to,{month:'short',day:'numeric',year:'numeric'}); }
  function guideText(t, g){
    const L=[];
    if(g.mode==='itin'){
      L.push('🗓 '+guideTitle(t,g)+' — itinerary', guideRange(g), '');
      itinData(t,g).forEach(day=>{ L.push(fmtDate(day.d,{weekday:'long',month:'short',day:'numeric'})+(day.cities.length?' · '+day.cities.join(' → '):''));
        if(!day.items.length) L.push('  (free day)');
        day.items.forEach(it=>{ L.push('  '+it.icon+' '+(it.t?it.t+' ':'')+it.text+(it.ref?' · ref '+it.ref:'')); if(it.address&&g.links) L.push('     '+it.address); if(g.links&&(it.lat!=null||it.address)&&it.icon==='🛏') L.push('     '+mapsLink(it.text.replace(/ — check in$/,''), it.address, it.lat, it.lon)); });
        L.push(''); });
    } else {
      L.push('📘 '+guideTitle(t,g)+' — our picks', guideRange(g), '');
      guideData(t,g).forEach(b=>{ L.push(b.city.toUpperCase());
        [['🛏 Where to stay',b.stay],['🍽️ Eat & drink',b.eat],['📍 What to do',b.doo]].forEach(([h,xs])=>{ if(!xs.length) return; L.push(h);
          xs.forEach(x=>{ L.push('• '+x.name+(x.rating?' '+stars(x.rating):'')+[g.prices?x.price:'', x.extra].filter(Boolean).map(s=>' · '+s).join(''));
            if(g.notes&&x.notes) L.push('  '+x.notes.replace(/\s*\n\s*/g,' · ').slice(0,220));

        L.push(''); });
      if(L.length<=3) L.push('(Nothing to recommend in this range yet: done activities, meals and stays show here.)');
    }
    L.push('Made with Waymark');
    return L.join('\n');
  }
  // the PDF: A4 pages drawn on a canvas (title, towns, sections, entries with an optional photo), packed by pdfFromJpegs

  function costRows(tid){

    S.expenses.filter(e=>e.tripId===tid).forEach(e=>rows.push({date:e.date||'', time:hhmm(e), type:'Expense', cat:e.category==='Transport'?(RIDE_CAT[expIcon('Transport',e.label)]||'Transport'):(e.category||'Other'), what:e.label, city:e.city||city(e.stopId), amount:+e.amount||0, cur:e.currency||'EUR', paid:e.paidBy||'', notes:e.notes||'', biz:isBiz(e)}));
    S.stays.filter(x=>x.tripId===tid&&+x.cost).forEach(x=>rows.push({date:x.checkIn||'', time:'', type:'Stay', cat:'Lodging', what:x.name+' · '+stayNights(x)+' night'+(stayNights(x)===1?'':'s'), city:x.city||city(x.stopId), amount:+x.cost, cur:x.currency||'EUR', paid:x.paidBy||'', notes:[x.platform,x.bookingRef].filter(Boolean).join(' · '), biz:isBiz(x)}));

  async function exportExpenses(t, opt){
    opt=opt||{};
    if(!downloads){ toast('Saving files isn\'t available here.'); return; }
    const rows=costRows(t.id).filter(r=>!opt.biz||r.biz);
    // business report: also the drives on business days, for a mileage claim (km × your rate)
    const drives=opt.biz?tripLegs(t.id).filter(l=>l.mode==='car'&&+l.km&&isBiz(l)):[];
    if(!rows.length&&!drives.length){ toast(opt.biz?'No business costs yet. Tick 💼 Business on a cost, or set the trip type.':'No costs to export yet.'); return; }
    const bcol=!opt.biz&&tripPurpose(t)!=='personal'; // the full export says which costs are business
    const head=['Date','Time','Type','Category','Description','City','Amount','Currency','Paid by','Notes'].concat(bcol?['Business']:[]);
    const list=[head].concat(rows.map(r=>[r.date,r.time,r.type,r.cat,r.what,r.city,Math.round(r.amount*100)/100,r.cur,r.paid,r.notes].concat(bcol?[r.biz?'yes':'']:[])));
    const by={}; rows.forEach(r=>{ const k=r.cat+'|'+r.cur; by[k]=(by[k]||0)+r.amount; });
    const tot={}; rows.forEach(r=>{ tot[r.cur]=(tot[r.cur]||0)+r.amount; });
    const cats=[['Category','Currency','Total']].concat(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{ const [c,cur]=k.split('|'); return [c,cur,Math.round(v*100)/100]; }))
      .concat(Object.entries(tot).map(([c,v])=>['Total',c,Math.round(v*100)/100]));
    const who={}; rows.filter(r=>r.paid).forEach(r=>{ const k=r.paid+'|'+r.cur; who[k]=(who[k]||0)+r.amount; });
    const payers=[['Paid by','Currency','Total']].concat(Object.entries(who).sort().map(([k,v])=>{ const [n,cur]=k.split('|'); return [n,cur,Math.round(v*100)/100]; }));
    const sheets=[{name:opt.biz?'Business expenses':'Expenses', rows:list, widths:[11,7,10,16,40,16,11,9,12,30,9]}, {name:'By category', rows:cats, widths:[18,10,12]}];
    if(payers.length>1) sheets.push({name:'Who paid', rows:payers, widths:[16,10,12]});
    if(drives.length){ const c=id=>(stopOf(id)||{}).city||''; const tk=drives.reduce((a,l)=>a+(+l.km||0),0);
      sheets.push({name:'Mileage', rows:[['Date','From','To','Km','Measured','Notes']].concat(drives.map(l=>[l.date,c(l.fromId),c(l.toId),Math.round(+l.km),legTrack(l)||!l.kmEstimated?'yes':'estimated',l.notes||'']), [['Total','','',Math.round(tk),'','']]), widths:[11,18,18,8,11,30]}); }

    try{ await downloads.save({filename:name, data}); toast('Saved'); }
    catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='extension_not_enabled'?'Excel files can\'t be saved here.':'Couldn\'t save the file.'); }
  }

  // Sightseeing photos through the same town on the same day are one outing ("Bordeaux city visit"), not one entry per
  // stop: consecutive sightseeing moments in one city, less than 3 h apart, are merged. Meals, receipts, stays and
  // specific activities (museum, hike, run…) stay on their own. A merged entry keeps its parts so the card can split it back.
  const WANDER=new Set(['attraction','citytour','walk','other','shopping']);
  function mergeWander(entries){
    const out=[]; let cur=null;
    const ts=e=>Date.parse(e.date+'T'+(e.time||'12:00'));
    entries.forEach(e=>{ const ok=e.kind==='activity'&&WANDER.has(e.cat)&&e.city;
      const last=cur&&(cur.parts||[cur]).slice(-1)[0];
      if(ok&&cur&&cur.date===e.date&&norm(cur.city)===norm(e.city)&&ts(e)-ts(last)<=3*3600000){
        if(!cur.parts){ const first=Object.assign({}, cur); Object.assign(cur, {parts:[first]}); }
        cur.parts.push(e); cur.photoIds=cur.parts.flatMap(x=>x.photoIds); cur.thumbs=cur.photoIds.length;
        const names=[...new Set(cur.parts.map(x=>String(x.name||'').trim()).filter(Boolean))];
        cur.name=cur.city+' city visit'; cur.cat='citytour'; cur.notes=names.join(' · ');

        return; }
      cur=ok?e:null; out.push(e); });
    return out;
  }

  function routeOf(e, st){ if(!SPORTS.has(e.cat)) return {};

    const pts=(e.pts||[]).slice().sort((a,b)=>String(a.t||'~').localeCompare(String(b.t||'~'))), tr=[];
    pts.forEach(q=>{ const last=tr[tr.length-1]; if(!last||haversine({lat:last[0],lon:last[1]},q)>0.2) tr.push([+q.lat.toFixed(5), +q.lon.toFixed(5)]); });
    const out={}; if(via.length>1) out.via=via; if(tr.length>1){ out.track=tr; out.trackFrom='photos'; } return out; }
  const viaTxt=p=>Array.isArray(p.via)&&p.via.length>1?p.via.join(' → '):'';
  const KIND_LABEL={activity:'📍 Activity', meal:'🍽️ Meal', expense:'💳 Expense', stay:'🛏 Stay'};

    // one entry from several: the first keeps its name, type, city and time; photos, notes and parts add up (Split undoes it)
    const joinInto=(a,b)=>{ const pa=a.parts||[Object.assign({}, a)], pb=b.parts||[b];

    openSheet('<h2>Check and save</h2><div class="hint">'+(from==='photos'?'Photos from the same outing became one entry (a walk through a town is one city visit; meals stay separate). A run or a day out split in pieces? Join them.':'Here\'s what Claude understood.')+' Fix anything, untick what you don\'t want, then save.</div>'

    form=>{

  // ---------- photo viewer: browse, make cover, replace, delete ----------

  function photoRows(id){ const out=[]; ['stops','places','expenses','stays','legs'].forEach(c=>S[c].forEach(r=>{ if((r.photoIds||[]).includes(id)) out.push({c,r}); })); return out; }
  async function editPhotoRows(id, fn){ for(const {c,r} of photoRows(id)) await patch(c, r.id, {photoIds:fn(r.photoIds||[])}); }
  // Delete the stored file once nothing points at it any more. Never throws.
  async function forgetAsset(id, exceptRow){
    if(!assets) return;
    const still=photoRows(id).some(({r})=>r!==exceptRow&&r.id!==(exceptRow&&exceptRow.id));
    if(!still){ try{ await assets.delete(id); }catch(e){} }
  }
  // every row holding it was just edited, so the file can go
  async function dropAsset(id){ if(!assets) return; try{ await assets.delete(id); }catch(e){} }
  let lbEl=null;
  function lightbox(id, list){
    list=(list&&list.length?list:((photoRows(id)[0]||{}).r||{}).photoIds)||[id];
    let i=Math.max(0,list.indexOf(id)), busy=false, confirmDel=false;
    if(lbEl) lbEl.remove();

    const close=()=>{ if(lbEl){ lbEl.remove(); lbEl=null; } document.removeEventListener('keydown', onKey); };
    const onKey=e=>{ if(e.key==='Escape') close(); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1); };
    document.addEventListener('keydown', onKey);
    const step=d=>{ if(list.length<2) return; i=(i+d+list.length)%list.length; confirmDel=false; draw(); };
    const draw=()=>{ if(!lbEl) return; const cur=list[i];
      lbEl.innerHTML='<div class="lb-top"><span>'+(list.length>1?(i+1)+' / '+list.length:'')+'</span><button type="button" class="lb-btn" data-a="close" aria-label="Close">✕</button></div>'
        + '<div class="lb-img"><img alt="" src="/_blob/'+cur+'">'
        + (list.length>1?'<button type="button" class="lb-btn lb-prev" data-a="prev" aria-label="Previous">‹</button><button type="button" class="lb-btn lb-next" data-a="next" aria-label="Next">›</button>':'')+'</div>'

            ? '<span>Delete this photo everywhere?</span><button type="button" class="btn small danger" data-a="del2">Delete</button><button type="button" class="btn small" data-a="keep">Keep</button>'
            : (i>0?'<button type="button" class="btn small" data-a="cover">★ Make cover</button>':'<span class="faint" style="color:#cfd6dd">Cover photo</span>')
              + '<label class="btn small">↻ Replace<input type="file" accept="image/*" hidden data-a="replace"></label><button type="button" class="btn small danger" data-a="del">Delete</button>')
          + '</div>':'');

      const rf=lbEl.querySelector('input[data-a="replace"]'); if(rf) rf.onchange=()=>{ const f=rf.files&&rf.files[0]; rf.value=''; if(f) act('replace', f); };
    };

  // Photo strip inside a form: tap = make cover, ✕ = remove. Works on the form's own copy of the ids.

      el.querySelectorAll('[data-cov]').forEach(im=>im.onclick=()=>{ sel=sel===im.dataset.cov?null:im.dataset.cov; draw(); });

  // ---------- share card ----------
  // The viewer picks a slice of the trip (dates), a format and what goes on the image.
  const SHARE_FORMATS={post:{w:1080,h:1350,label:'Post 4:5'}, square:{w:1080,h:1080,label:'Square'}, story:{w:1080,h:1920,label:'Story 9:16'}};
  // city (a norm()'d name, optional): only that city's stays and activities, no legs; the dates are the days spent there
  // hide: {placeId:true} for activities/meals left off this share
  function shareSlice(t, from, to, city, hide){
    let stops=tripStops(t.id).filter(s=>!s.home&&s.arrive&&s.arrive<=to&&(s.depart||s.arrive)>=from);
    if(city) stops=stops.filter(s=>norm(s.city)===city);

        const onChip=$('#shPre .chip.on'); if(onChip){ const bx=$('#shPre'); bx.scrollLeft=Math.max(0,onChip.offsetLeft-bx.offsetLeft-12); }
        if(!titleTouched){ o.title=presetTitle||defaultTitle(t,o.from,o.to); $('#shTitle').value=o.title; }
        const sl=shareSlice(t,o.from,o.to,o.city,o.hide), avail=sl.photos;
        drawActPick();
        o.photoIds=picksTouched?o.photoIds.filter(id=>avail.includes(id)):sl.pick.slice();
        $('#shPicsF').hidden=!avail.length;
        const drawPics=()=>{ $('#shPics').innerHTML=avail.map(id=>{ const n=o.photoIds.indexOf(id);
            return '<span style="position:relative;flex-shrink:0;width:84px;display:flex;flex-direction:column;gap:2px"><img alt="" src="/_blob/'+id+'" data-pick="'+id+'" style="'+(n>=0?'outline:3px solid var(--accent);outline-offset:-3px':'opacity:.5')+'">'
              +'<small style="font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(sl.owner[id]||'')+'</small>'
              +(n>=0?'<b style="position:absolute;top:4px;left:4px;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center">'+(n+1)+'</b>':'')+'</span>'; }).join('');
          $('#shPics').querySelectorAll('[data-pick]').forEach(im=>im.onclick=()=>{ picksTouched=true; const id=im.dataset.pick, n=o.photoIds.indexOf(id);
            if(n>=0) o.photoIds.splice(n,1); else if(o.photoIds.length<4) o.photoIds.push(id); else { toast('Up to 4 photos'); return; }
            drawPics(); later(); });
          $('#shPicN').textContent='('+o.photoIds.length+' of 4 picked · tap to add or remove)'; };
        drawPics();
        if(!capTouched) $('#cap').value=caption(t,o);
        later();
      };
      $('#shPre').querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ const p=presets[+b.dataset.pre]; o.from=p.from; o.to=p.to; o.city=p.city||''; presetTitle=p.title||''; picksTouched=false; sync(); });
      $('#shFrom').onchange=()=>{ o.from=val('shFrom'); o.city=''; presetTitle=''; picksTouched=false; sync(); };
      $('#shTo').onchange=()=>{ o.to=val('shTo'); o.city=''; presetTitle=''; picksTouched=false; sync(); };
      $('#shFmt').querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ o.format=b.dataset.fmt; $('#shFmt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); later(); });
      function drawActPick(){ const all=shareSlice(t,o.from,o.to,o.city).acts, box=$('#shActs');
        box.parentElement.hidden=!all.length;
        box.innerHTML=all.map(p=>'<label class="ed-row'+(o.hide[p.id]?' off':'')+'" style="cursor:pointer"><input type="checkbox" data-hid="'+p.id+'"'+(o.hide[p.id]?'':' checked')+'><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+catIcon(p.category)+' '+esc(p.name)+'</span>'+(p.private?'<span class="faint">🔒</span>':'')+'</label>').join('');
        box.querySelectorAll('[data-hid]').forEach(c=>c.onchange=()=>{ if(c.checked) delete o.hide[c.dataset.hid]; else o.hide[c.dataset.hid]=true; sync(); }); }
      $('#shPriv').querySelectorAll('[data-priv]').forEach(b=>b.onclick=()=>{ const k=b.dataset.priv; o.priv[k]=!o.priv[k]; b.classList.toggle('on',o.priv[k]);
        const on=Object.entries(o.priv).filter(([,v])=>v).map(([k])=>({spots:'only cities show on the map',names:'activities show as their type (e.g. "Lunch")',times:'no times',dates:'"4 days" instead of dates'}[k]));
        $('#shPrivHint').textContent=on.length?'Hiding: '+on.join(', ')+'.':'Prices are off unless you turn them on above. Contacts and notes never go on a share.';
        if(!capTouched) $('#cap').value=caption(t,o); later(); });
      $('#shShow').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const k=b.dataset.show; o[k]=!o[k]; b.classList.toggle('on',o[k]); later(); });
      $('#shTitle').oninput=()=>{ titleTouched=true; o.title=val('shTitle'); if(!capTouched) $('#cap').value=caption(t,o); later(); };
      $('#cap').oninput=()=>{ capTouched=true; saveShare(); };
      $('#toGuide').onclick=()=>guideSheet(t, {from:o.from, to:o.to});
      $('#toWrap').onclick=()=>{ closeSheet(); openWrapped(t); };
      $('#toPoster').onclick=()=>{ closeSheet(); openPoster(t); };
      $('#copyCap').onclick=async()=>{ const txt=val('cap'); try{ await navigator.clipboard.writeText(txt); toast('Caption copied'); }catch(e){ const ta=$('#cap'); ta.focus(); ta.select(); $('#shareHint').textContent='Press copy on your keyboard to copy the selected caption.'; } };
      const base=()=>(o.title||t.name).replace(/→/g,'-').replace(/[^\w\- ]+/g,'').replace(/\s+/g,' ').trim()||'trip', fname=()=>base()+'.png';
      const vidName=()=>base()+(vidBlob&&/mp4/.test(vidBlob.type)?'.mp4':'.webm');
      const blob=()=>new Promise(r=>canvas.toBlob(r,'image/png'));
      const sn=$('#shareNow'); if(sn) sn.onclick=async()=>{ if(!canvas) return; sn.disabled=true;
        try{ const file=vidBlob?new File([vidBlob], vidName(), {type:vidBlob.type}):new File([await blob()], fname(), {type:'image/png'});
          if(!navigator.canShare({files:[file]})) throw {name:'NotAllowedError'};
          try{ await navigator.clipboard.writeText(val('cap')); }catch(e){}
          await navigator.share({files:[file], text:val('cap')}); }
        catch(e){ if(!e||e.name!=='AbortError') $('#shareHint').textContent='Sharing straight to apps isn\'t allowed here. Save the image instead, or long‑press the preview.'; }
        finally{ sn.disabled=false; } };
      const btn=$('#saveImg');
      if(!downloads){ btn.hidden=true; if(!canShare) $('#shareHint').textContent='Long‑press the preview to save it, then post it from your photos.'; }
      else btn.onclick=async()=>{ if(!canvas) return; btn.disabled=true;
        try{ await downloads.save({filename:fname(), data:await blob()}); toast('Saved'); }
        catch(e){ if(e&&e.code!=='declined') $('#shareHint').textContent='Couldn\'t save the image. Long‑press the preview to save it instead.'; }
        finally{ btn.disabled=false; } };
      const mk=$('#mkVid');
      // while it builds, the same button stops it and goes back to the image
      if(mk) mk.onclick=async()=>{ if(mk.dataset.rec){ delete mk.dataset.rec; $('#shareHint').textContent='Video stopped.'; redraw(); return; }
        dropVideo(); stopListen(); const tok=vidTok; mk.dataset.rec='1'; mkSet('■ Stop · Creating video…', 0); $('#shareHint').textContent='';
        const alive=()=>tok===vidTok&&sheet.isConnected;
        // the audio context has to start inside the tap
        let actx=null; if(music.kind!=='none'){ playbackSession(); try{ actx=new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){ actx=null; } }
        try{
          const plan=await routeVideoPlan(t, JSON.parse(JSON.stringify(o))); if(!alive()) return;
          let audio=null;
          if(actx){ mkSet('■ Stop · Making the music…', 0); const buf=music.kind==='file'?music.buf:await makeTune(music.kind, plan.T+2); if(!alive()) return;
            if(buf) audio={ctx:actx, buf, start:music.kind==='file'?music.start:0, vol:music.vol, fade:music.fade}; }
          const cv=document.createElement('canvas'); cv.className='share-preview'; cv.style.cssText='max-height:46vh;width:auto;max-width:100%';
          $('#cardBox').innerHTML=''; $('#cardBox').appendChild(cv);
          const vb=await recordRouteVideo(plan, cv, tau=>{ if(alive()){ const pc=Math.min(100,Math.round(tau/plan.T*100)); mkSet('■ Stop · Creating video '+pc+'%', pc); } }, alive, audio);
          if(!vb||!alive()) return;
          vidBlob=vb; vidUrl=URL.createObjectURL(vb);
          $('#cardBox').innerHTML='<video class="share-preview" style="max-height:46vh;width:auto;max-width:100%" src="'+vidUrl+'" controls playsinline muted loop autoplay></video>';
          showVidBtns(true); mkSet('🎬 Create it again');
          $('#shareHint').textContent=Math.round(plan.T)+' s video'+(audio?' with music (unmute the player to hear it)':'')+(/mp4/.test(vb.type)?'':' (WebM)')+'. Change any option to go back to the image.';
        }catch(e){ if(alive()) $('#shareHint').textContent='Couldn\'t record a video here: '+((e&&e.message)||e); }
        finally{ if(tok===vidTok){ delete mk.dataset.rec; mk.disabled=false; } if(actx) actx.close().catch(()=>{}); } };
      // ----- editor: music, pace, scenes, photo edits
      const ed=$('#shEd');
      // the preview plays as a plain <audio> clip (a WAV made from the tune): iPhones mute page-made (Web Audio) sound when the ringer is off, not media
      let listen=null; function stopListen(){ if(listen){ try{ listen.el.pause(); }catch(e){} if(listen.url) URL.revokeObjectURL(listen.url); listen=null; } const b=$('#edListen'); if(b) b.textContent='▶ Listen'; }
      const mm=sec=>Math.floor(sec/60)+':'+pad2(Math.floor(sec%60));
      const drawMusic=()=>{ if(!ed) return; ed.querySelectorAll('[data-mu]').forEach(b=>b.classList.toggle('on',b.dataset.mu===music.kind));
        $('#edMuOpts').hidden=music.kind==='none'; $('#edMuOpts').style.display=music.kind==='none'?'none':'flex';
        $('#edStartRow').hidden=music.kind!=='file'; $('#edSongName').textContent=music.kind==='file'?'🎵 '+music.name+' · '+mm(music.buf.duration):'';
        $('#edFade').classList.toggle('on',music.fade); };
      const edLater=()=>{ clearTimeout(edTimer); edTimer=setTimeout(drawScenes,350); };
      let edTimer=null, sceneTok=0;
      async function drawScenes(){ if(!ed||!ed.open) return; const tok=++sceneTok; let plan;
        try{ plan=await routeVideoPlan(t, JSON.parse(JSON.stringify(o))); }catch(e){ return; } if(tok!==sceneTok||!sheet.isConnected) return;
        $('#edLen').textContent='≈ '+Math.round(plan.T)+' s';
        const E=o.edit;
        $('#edScenes').className=''; $('#edScenes').innerHTML=plan.scenes.map(sc=>{ const off=!!E.off[sc.id], m=String(E.mult[sc.id]||1);
          return '<div class="ed-row'+(off?' off':'')+'"><input type="checkbox" data-son="'+esc(sc.id)+'"'+(off?'':' checked')+(sc.id==='outro'?' disabled':'')+' aria-label="Keep this scene"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(sc.label)+'</span>'
            + '<select data-smul="'+esc(sc.id)+'" aria-label="Length"'+(off?' disabled':'')+'>'+[['0.6','Short'],['1','Normal'],['1.6','Long'],['2.4','Longer']].map(([v,l])=>'<option value="'+v+'"'+(v===m?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'; }).join('');
        $('#edScenes').querySelectorAll('[data-son]').forEach(c=>c.onchange=()=>{ if(c.checked) delete E.off[c.dataset.son]; else E.off[c.dataset.son]=true; changed(); });
        $('#edScenes').querySelectorAll('[data-smul]').forEach(c=>c.onchange=()=>{ if(c.value==='1') delete E.mult[c.dataset.smul]; else E.mult[c.dataset.smul]=+c.value; changed(); });
        drawPhotoEd(); }
      function drawPhotoEd(){ const ids=o.photoIds.slice(0,4); $('#edPhF').hidden=!ids.length;
        $('#edPhotos').innerHTML=ids.map(id=>{ const f=o.photoFx[id]||{};
          return '<div class="ed-row"><img class="ed-ph" alt="" src="/_blob/'+id+'" style="transform:rotate('+(f.rot||0)+'deg);filter:'+(PHOTO_CSS[f.fx||'none']||'none')+';object-position:'+(f.focus==='top'?'center top':f.focus==='bottom'?'center bottom':'center')+'">'
            + '<button type="button" class="btn small" data-rot="'+id+'" aria-label="Rotate">⟳</button>'
            + '<select data-fx="'+id+'" aria-label="Look">'+Object.entries(PHOTO_FX).map(([k,l])=>'<option value="'+k+'"'+((f.fx||'none')===k?' selected':'')+'>'+l+'</option>').join('')+'</select>'
            + '<select data-focus="'+id+'" aria-label="Framing">'+[['center','Middle'],['top','Top'],['bottom','Bottom']].map(([k,l])=>'<option value="'+k+'"'+((f.focus||'center')===k?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'; }).join('');
        const fx=id=>o.photoFx[id]=o.photoFx[id]||{};
        $('#edPhotos').querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{ const f=fx(b.dataset.rot); f.rot=((f.rot||0)+90)%360; drawPhotoEd(); later(); });
        $('#edPhotos').querySelectorAll('[data-fx]').forEach(c=>c.onchange=()=>{ fx(c.dataset.fx).fx=c.value; drawPhotoEd(); later(); });
        $('#edPhotos').querySelectorAll('[data-focus]').forEach(c=>c.onchange=()=>{ fx(c.dataset.focus).focus=c.value; drawPhotoEd(); later(); }); }
      function changed(){ dropVideo(); restoreImage(); edLater(); saveShare(); }
      function restoreImage(){ if(canvas&&!$('#cardBox img')) $('#cardBox').innerHTML='<img class="share-preview" style="max-height:46vh;width:auto;max-width:100%" alt="Share image preview" src="'+canvas.toDataURL('image/jpeg',.85)+'">'; }
      if(ed){
        ed.addEventListener('toggle',()=>{ if(ed.open) drawScenes(); });
        ed.querySelectorAll('[data-mu]').forEach(b=>b.onclick=()=>{ stopListen(); const k=b.dataset.mu;
          if(k==='file'){ $('#edSong').click(); return; } music.kind=k; drawMusic(); changed(); });
        $('#edSong').onchange=async()=>{ const f=($('#edSong').files||[])[0]; $('#edSong').value=''; if(!f) return;
          $('#edSongName').textContent='Opening '+f.name+'…'; $('#edMuOpts').hidden=false; $('#edMuOpts').style.display='flex';
          try{ const ab=await f.arrayBuffer(), oc=new OfflineAudioContext(2,44100,44100);
            const buf=await new Promise((res,rej)=>{ const pr=oc.decodeAudioData(ab,res,rej); if(pr&&pr.then) pr.then(res,rej); });
            music.kind='file'; music.buf=buf; music.name=f.name.replace(/\.[^.]+$/,''); music.start=0;
            const st=$('#edStart'); st.max=String(Math.max(0,Math.floor(buf.duration-5))); st.value='0'; $('#edStartV').textContent='0:00';
            drawMusic(); changed(); }
          catch(e){ $('#edSongName').textContent='Couldn\'t open that file. Try an MP3 or M4A saved on your phone.'; } };
        $('#edStart').oninput=()=>{ music.start=+$('#edStart').value; $('#edStartV').textContent=mm(music.start); };
        $('#edStart').onchange=()=>{ changed(); if(listen){ stopListen(); $('#edListen').click(); } };
        $('#edVol').oninput=()=>{ music.vol=+$('#edVol').value/100; $('#edVolV').textContent=$('#edVol').value+'%'; };
        $('#edVol').onchange=()=>{ changed(); if(listen){ stopListen(); $('#edListen').click(); } }; // iPhones ignore a clip's volume, so it's baked into the clip
        $('#edFade').onclick=()=>{ music.fade=!music.fade; drawMusic(); changed(); };
        $('#edListen').onclick=async()=>{ if(listen){ stopListen(); return; } const b=$('#edListen');
          playbackSession();
          // unlock the clip inside the tap (iPhones only let a tap start sound); the real sound is swapped in once it's ready
          const el=new Audio(); el.setAttribute('playsinline',''); el.src=SILENT_WAV; el.play().catch(()=>{});
          listen={el, url:null}; const mine=listen; b.textContent='…';
          try{ const buf=music.kind==='file'?music.buf:await makeTune(music.kind, 20); if(listen!==mine) return;
            if(!buf){ stopListen(); return; }
            mine.url=URL.createObjectURL(wavBlob(buf, music.kind==='file'?music.start:0, 20, music.vol));
            el.src=mine.url; el.onended=()=>{ if(listen===mine) stopListen(); };
            await el.play(); if(listen===mine) b.textContent='■ Stop'; }
          catch(e){ if(listen===mine){ stopListen(); toast('Couldn\'t play it here. Check that your phone isn\'t on silent and the volume is up.'); } } };
        ed.querySelectorAll('[data-pace]').forEach(b=>b.onclick=()=>{ o.edit.pace=+b.dataset.pace; ed.querySelectorAll('[data-pace]').forEach(x=>x.classList.toggle('on',x===b)); changed(); });
        new MutationObserver(()=>{ if(!sheet.isConnected) stopListen(); }).observe(document.getElementById('layer'),{childList:true});
      }
      const sv=$('#saveVid');
      sv.onclick=async()=>{ if(!vidBlob||!downloads) return; sv.disabled=true;
        try{ await downloads.save({filename:vidName(), data:vidBlob}); toast('Saved'); }
        catch(e){ if(e&&e.code!=='declined') $('#shareHint').textContent='Couldn\'t save the video.'; }
        finally{ sv.disabled=false; } };
      // put back what was chosen last time for these days
      $('#shShow').querySelectorAll('[data-show]').forEach(b=>b.classList.toggle('on',!!o[b.dataset.show]));
      $('#shPriv').querySelectorAll('[data-priv]').forEach(b=>b.classList.toggle('on',!!o.priv[b.dataset.priv]));
      if(ed){ ed.querySelectorAll('[data-pace]').forEach(b=>b.classList.toggle('on',+b.dataset.pace===+(o.edit.pace||1))); drawMusic();
        const vs=$('#edVol'); if(vs){ vs.value=String(Math.round(music.vol*100)); const vv=$('#edVolV'); if(vv) vv.textContent=vs.value+'%'; } }
      sync();
      if(saved){ if(titleTouched) $('#shTitle').value=o.title; if(capTouched&&saved.cap) $('#cap').value=saved.cap; }
    });
  }

  init();
})();
</script>
