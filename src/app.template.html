<title>Waymark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E4E9EE; --ink:#15202B; --ink-soft:#4C5967; --ink-faint:#8693A0;
    --line:#D3DAE1; --accent:#E2551B; --accent-ink:#FFFFFF; --accent-soft:#FBE4D9;
    --land:#D9DFE5; --land-visited:#F5C6AE; --sea:#F6F8FA; --border-land:#FFFFFF;
    --plane:#2F6FED; --car:#E2551B; --train:#22946A; --bus:#8E55C9; --ferry:#0E9BAD; --walk:#8A7F70;
    --good:#22946A; --track:#D6336C; --night:#4B4FA8; --shadow:0 1px 2px rgba(21,32,43,.06),0 8px 24px -12px rgba(21,32,43,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0F151B; --surface:#172029; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-soft:#A6B3BF; --ink-faint:#6E7D8A;
      --line:#2A3743; --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2216;
      --land:#25313C; --land-visited:#6B3A24; --sea:#121A21; --border-land:#0F151B;
      --plane:#6F9BFF; --car:#FF7A3D; --train:#4CC795; --bus:#B98BEB; --ferry:#3CC6D6; --walk:#B5AA9B;
      --good:#4CC795; --track:#FF5C8A; --night:#7C80E0; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-soft:#A6B3BF; --ink-faint:#6E7D8A;
    --line:#2A3743; --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2216;
    --land:#25313C; --land-visited:#6B3A24; --sea:#121A21; --border-land:#0F151B;
    --plane:#6F9BFF; --car:#FF7A3D; --train:#4CC795; --bus:#B98BEB; --ferry:#3CC6D6; --walk:#B5AA9B;
    --good:#4CC795; --track:#FF5C8A; --night:#7C80E0; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:'Barlow Condensed',system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:.01em;}

  .app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;}
  .brand b{color:var(--accent);}
  .top h1{font-size:22px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn svg{width:18px;height:18px;}
  main{padding:16px;display:flex;flex-direction:column;gap:18px;}
  .status{padding:48px 16px;text-align:center;color:var(--ink-faint);}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
  nav.tabs .in{display:flex;gap:4px;max-width:760px;width:100%;}
  nav.tabs button{flex:1;border:none;background:none;padding:6px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11.5px;font-weight:600;color:var(--ink-faint);}
  nav.tabs button svg{width:22px;height:22px;}
  nav.tabs button.on{color:var(--accent);}

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn:hover{border-color:var(--accent);}
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.small{padding:6px 10px;font-size:13px;border-radius:8px;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:#C2412D;border-color:#C2412D;background:transparent;}
  .btn:disabled{opacity:.55;cursor:default;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .sec-title h2{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);font-size:13px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .trip-card{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .trip-card:hover{border-color:var(--accent);}
  .trip-card h3{font-size:22px;font-weight:700;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);}
  .pill.accent{background:var(--accent-soft);color:var(--ink);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  /* stat strip — boarding-pass style */
  .pass{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;}
  .pass .cell{padding:10px 12px;border-right:1px dashed var(--line);}
  .pass .cell:last-child{border-right:none;}
  .pass .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .pass .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1.1;}
  @media (max-width:480px){ .pass{grid-template-columns:repeat(2,minmax(0,1fr));} .pass .cell:nth-child(2){border-right:none;} .pass .cell:nth-child(-n+2){border-bottom:1px dashed var(--line);} }

  .map-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea);}
  .map-wrap svg{display:block;width:100%;height:auto;}
  .map-ctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;}
  .map-ctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;padding:0;}
  .map-card{position:absolute;left:8px;right:52px;bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:14px;}
  .map-card[hidden]{display:none;}
  .map-card img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .days .day{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
  .days .day:last-child{border-bottom:none;}
  .days .day.today{background:var(--accent-soft);}
  .day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .day-h .btn{padding:4px 8px;}
  .day-i{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;cursor:pointer;}
  .day-i img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0;cursor:zoom-in;}
  .day-i.has-ph{flex-wrap:wrap;}
  .ph-strip{order:9;flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ph-strip::-webkit-scrollbar{display:none;}
  .day-i .ph-strip img{width:96px;height:96px;border-radius:10px;}
  .day-i .ph-strip img:first-child{width:144px;}
  .trip-hero{position:relative;margin:-4px 0 0;height:230px;border-radius:18px;overflow:hidden;background:var(--surface-2) center/cover no-repeat;box-shadow:var(--shadow);}
  .trip-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.62));}
  .trip-hero .hero-txt{position:absolute;left:16px;right:60px;bottom:14px;color:#fff;z-index:1;}
  .trip-hero h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;line-height:1.02;font-weight:700;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.35);}
  .trip-hero .hero-d{font-size:14px;opacity:.92;margin-top:4px;}
  .trip-hero .hero-wrap{position:absolute;right:10px;top:10px;z-index:1;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.92);color:#15202B;cursor:pointer;box-shadow:var(--shadow);}
  .trip-hero .hero-pick{position:absolute;right:10px;bottom:12px;z-index:1;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:18px;cursor:pointer;}
  .trip-cover{margin:-14px -16px 4px;height:150px;background:var(--surface-2) center/cover no-repeat;}
  .trip-card{overflow:hidden;position:relative;}
  .trip-card .pill{white-space:nowrap;}
  .trip-card .on-cover{position:absolute;top:12px;left:12px;box-shadow:var(--shadow);}
  .cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:60vh;overflow:auto;}
  .cover-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent;}
  .cover-grid img.on{border-color:var(--accent);}
  .drag{margin-left:auto;padding:6px 2px 6px 10px;color:var(--ink-faint);font-size:18px;line-height:1;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex-shrink:0;}
  .day-i.dragging{transform:scale(1.02);transition:transform .12s;}
  .day-i.dragging{background:var(--surface);box-shadow:var(--shadow);border-radius:8px;position:relative;z-index:2;}
  .night-add{align-self:flex-start;border:1px dashed var(--line);background:transparent;color:var(--ink-faint);border-radius:8px;padding:4px 10px;font-size:13px;margin-top:4px;cursor:pointer;}
  .day-i.night{border-top:1px dashed var(--line);margin-top:2px;padding-top:6px;}
  .mini{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .tset{position:relative;flex-shrink:0;min-width:42px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);cursor:pointer;}
  .tset.empty{font-family:inherit;font-size:11px;min-width:0;border:1px dashed var(--line);border-radius:6px;padding:1px 5px;opacity:.8;}
  .tset input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;}
  .found{display:flex;flex-direction:column;gap:4px;}
  .found button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;}
  .found button small{display:block;color:var(--ink-faint);font-size:12px;}
  .mini.emo{background:var(--surface-2);font-size:13px;line-height:1;}
  .mini svg{width:13px;height:13px;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}

  /* legs list */
  .legs{display:flex;flex-direction:column;}
  .leg{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .leg:last-child{border-bottom:none;}
  .leg:hover{background:var(--surface-2);}
  .mode-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;}
  .mode-badge svg{width:18px;height:18px;}
  .leg .route{font-weight:600;}
  .leg .meta{font-size:12.5px;color:var(--ink-faint);}
  .leg .km{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* cities grid */
  .cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .city{padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px;}
  .city:hover{border-color:var(--accent);}
  .city h3{font-size:20px;font-weight:700;}
  .city .thumbs{display:flex;gap:4px;margin-top:auto;}
  .city .thumbs img{width:34px;height:34px;object-fit:cover;border-radius:6px;}

  /* places */
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .place{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
  .place .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .place h3{font-family:'Figtree',sans-serif;font-size:16px;font-weight:700;letter-spacing:0;}
  .place .notes{font-size:14px;color:var(--ink-soft);white-space:pre-wrap;}
  .photos{display:flex;gap:6px;overflow-x:auto;}
  .photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in;flex-shrink:0;background:var(--surface-2);}
  .stars{color:var(--accent);letter-spacing:1px;font-size:14px;}
  .status-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;}
  .status-tag.want{background:var(--surface-2);color:var(--ink-soft);}
  .status-tag.done{background:var(--good);color:#fff;}

  /* budget */
  .budget-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14.5px;}
  .budget-row:last-child{border-bottom:none;}
  .budget-row .amt{font-family:'IBM Plex Mono',monospace;}
  .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px;}
  .bar i{display:block;height:100%;background:var(--accent);}

  /* discover */
  .reco{padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:10px;}
  .reco .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--accent);line-height:1;}
  .reco h3{font-family:'Figtree',sans-serif;font-size:15.5px;font-weight:700;}
  .reco p{margin:3px 0 0;font-size:14px;color:var(--ink-soft);}
  .reco .tip{font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:6px 9px;margin-top:6px;}

  /* world */
  .countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .country{padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:600;}
  .country .flag{font-size:22px;}

  /* sheet */
  .scan-ov{position:fixed;inset:0;z-index:80;background:#0B1117;color:#fff;display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;}
  .scan-top{display:flex;flex-direction:column;gap:2px;}
  .scan-top .faint{color:#A6B3BF;font-size:13px;}
  .scan-stage{position:relative;flex:1;min-height:0;touch-action:none;}
  .scan-stage canvas{position:absolute;}
  .scan-stage i{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,122,61,.35);border:3px solid #FF7A3D;touch-action:none;cursor:grab;}
  .scan-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .scan-bar .btn:not(.primary):not(.ghost){color:#15202B;} .scan-bar .btn.ghost{color:#fff;}
  .scan-bar .chip{background:#1F2A35;color:#fff;border-color:#2B3946;} .scan-bar .chip.on{background:#fff;color:#15202B;}
  .wr-ov{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));}
  .wr-ov canvas{max-width:100%;max-height:calc(100% - 96px);width:auto;height:auto;aspect-ratio:9/16;border-radius:14px;cursor:pointer;}
  .wr-bars{display:flex;gap:4px;width:100%;max-width:480px;}
  .wr-bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;} .wr-bars b{display:block;height:100%;width:0;background:#fff;}
  .poster-img{max-width:100%;max-height:calc(100% - 110px);width:auto;height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .wr-hint{color:rgba(255,255,255,.5);font-size:12px;}
  .wr-btns{display:flex;gap:8px;} .wr-btns .btn.ghost{color:#fff;}
  .sh-acts{display:flex;flex-direction:column;gap:8px;}
  .sh-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;} .sh-row .btn{width:100%;justify-content:center;padding-left:8px;padding-right:8px;white-space:nowrap;font-size:15px;} .sh-row [hidden]{display:none;}
  .sh-vid{position:relative;overflow:hidden;width:100%;height:50px;white-space:nowrap;justify-content:center;font-size:16px;}
  .sh-vid span{position:relative;} .sh-prog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.22;transition:width .25s linear;pointer-events:none;}
  .kb-done{position:fixed;top:10px;right:12px;z-index:60;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);cursor:pointer;}
  .sheet.kb-open{padding-bottom:min(55vh,420px);}
  .backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.55);display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){ .backdrop{align-items:center;} }
  .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;}
  @media (min-width:640px){ .sheet{border-radius:18px;} }
  .sheet h2{font-size:24px;font-weight:700;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;}
  .field textarea{min-height:84px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .grid2>*,.grid3>*{min-width:0;}
  input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:44px;text-align:left;}
  .grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px;}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .modes button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;}
  .modes button svg{width:16px;height:16px;}
  .modes button.on{border-color:var(--accent);background:var(--accent-soft);}
  .rating{display:flex;gap:4px;}
  .rating button{border:none;background:none;font-size:24px;cursor:pointer;color:var(--line);padding:0 2px;}
  .rating button.on{color:var(--accent);}
  .hint{font-size:12.5px;color:var(--ink-faint);}
  .err{font-size:13px;color:#C2412D;}

  const modeIcon = (m) => '<svg viewBox="0 0 24 24">' + (MODES[m]||MODES.car).icon + '</svg>';

  function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

  // business or personal: a trip is personal, business or mixed (work days bizFrom–bizTo); a cost's own biz true/false wins,

    S.stays.filter(x=>x.tripId===tid&&x.cost).forEach(x=>out.push({cat:'Lodging', label:x.name+' · '+stayNights(x)+' night'+(stayNights(x)===1?'':'s'), amount:+x.cost, cur:x.currency||'EUR', biz:isBiz(x)}));

  // ---------- data layer ----------
  const COLS = ['trips','stops','legs','places','expenses','stays'];
  async function init(){
    renderTabs();
    if(!window.claude || !window.claude.use){ main.innerHTML='<div class="status">Open this page from claude.ai to load your trips.</div>'; return; }
    window.claude.use('sample').then(x=>{ sample=x; render();
      if(x) x.limits().then(l=>{ sampleImages=(l&&l.images&&l.images.maxCount)||0; render(); }).catch(()=>{}); });
    window.claude.use('assets').then(x=>{ assets=x; render(); });

  async function put(col, id, data){ if(!db) throw new Error('offline'); return id ? db.collection(col).doc(id).set(data) : db.collection(col).add(data); }

  // Find coordinates for a city: reuse any stop we already know, else ask Claude.
  // City names as typed or dictated: "St Jean de Luz", "saint-jean-de-luz.", "San Sebastian" and "Saint Jean de Lutz"
  // should all land on the trip's Saint-Jean-de-Luz. cityKey drops case, accents, punctuation and spaces; fuzzyCity
  // also forgives a letter or two (dictation spelling) on names of 5+ letters.
  const cityKey=s=>norm(s).replace(/[.,!?;:]+$/,'').replace(/\bste?\.?\s/g,m=>/e/.test(m)?'sainte ':'saint ').replace(/[^a-z0-9]/g,'');
  function editDist(a,b){ const d=Array.from({length:b.length+1},(_,j)=>j);

  async function geocode(name, hint){
    const n=norm(name);
    const known=S.stops.find(s=>norm(s.city)===n && s.lat!=null);
    if(known) return {city:known.city, country:known.country, countryA2:known.countryA2, countryN3:known.countryN3, lat:known.lat, lon:known.lon};
    if(!sample) return null;

      +'{"city": string (proper name), "country": string (English short name), "countryA2": string (ISO 3166-1 alpha-2), "countryN3": string (ISO 3166-1 numeric, 3 digits), "lat": number, "lon": number}. '
      +'Example: {"city":"Bilbao","country":"Spain","countryA2":"ES","countryN3":"724","lat":43.263,"lon":-2.935}', {modelTier:'quick', cache:{gcTime:86400000}});

  }

  // ---------- render ----------
  let pending=false, dragActive=false, renderWanted=false;
  // Days: press the ⠿ handle and slide a row up or down; the day's order is saved as dayPos.
  function enableDayDrag(){
    main.querySelectorAll('.day-list').forEach(list=>{
      const rows=[...list.querySelectorAll('.day-i')]; if(rows.length<2) return;
      rows.forEach(row=>{
        const h=document.createElement('span'); h.className='drag'; h.setAttribute('role','button'); h.setAttribute('aria-label','Press and hold, then drag to reorder'); h.textContent='⠿';
        row.appendChild(h);
        h.addEventListener('click',e=>e.stopPropagation());
        // Press and hold the handle (~0.35 s) to pick a row up; a quick swipe over it just scrolls the page.
        let armed=false, holdT=null, finish=null;
        h.addEventListener('touchmove',e=>{ if(armed) e.preventDefault(); },{passive:false});
        const ended=()=>{ if(holdT){ clearTimeout(holdT); holdT=null; } if(finish) finish(); };
        h.addEventListener('touchend',ended); h.addEventListener('touchcancel',ended);
        h.addEventListener('contextmenu',e=>e.preventDefault());
        h.addEventListener('pointerdown',e=>{
          e.stopPropagation(); if(e.pointerType==='mouse') e.preventDefault();
          const y0=e.clientY, id=e.pointerId;
          const cancel=()=>{ clearTimeout(holdT); holdT=null; h.removeEventListener('pointermove',early); h.removeEventListener('pointerup',cancel); h.removeEventListener('pointercancel',cancel); };
          const early=ev=>{ if(Math.abs(ev.clientY-y0)>8) cancel(); };
          h.addEventListener('pointermove',early); h.addEventListener('pointerup',cancel); h.addEventListener('pointercancel',cancel);
          holdT=setTimeout(()=>{ cancel(); start(id); }, e.pointerType==='mouse'?0:350);
        });
        function start(pid){
          try{ h.setPointerCapture(pid); }catch(err){}
          const before=[...list.querySelectorAll('.day-i')];
          armed=true; dragActive=true; row.classList.add('dragging'); try{ navigator.vibrate&&navigator.vibrate(12); }catch(err){}
          let scrollT=null;
          const move=ev=>{ const y=ev.clientY;
            const next=[...list.querySelectorAll('.day-i')].filter(x=>x!==row).find(x=>{ const r=x.getBoundingClientRect(); return y<r.top+r.height/2; });
            if((next||null)!==row.nextElementSibling) list.insertBefore(row, next||null);
            clearInterval(scrollT); if(y<90) scrollT=setInterval(()=>window.scrollBy(0,-10),30); else if(y>innerHeight-110) scrollT=setInterval(()=>window.scrollBy(0,10),30); };
          const up=async()=>{ if(finish!==up) return; finish=null; clearInterval(scrollT); armed=false;
            h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); h.removeEventListener('pointercancel',up);
            row.classList.remove('dragging');
            const after=[...list.querySelectorAll('.day-i')];
            if(after.some((r,i)=>r!==before[i])) await saveDayOrder(after);
            dragActive=false; if(renderWanted){ renderWanted=false; schedule(); } };
          finish=up; h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
        }
      });
    });
  }
  async function saveDayOrder(rows){
    const writes=[];

      const x=S[c].find(y=>y.id===id); if(x&&x.dayPos!==pos) writes.push(patch(c, id, {dayPos:pos})); });

  }
  function schedule(){ if(pending) return; pending=true; requestAnimationFrame(()=>{ pending=false; render(); }); }

  const scrollMem={}, viewKey=()=>R.tab+'|'+(R.tripId||'')+'|'+(R.stopId||'')+'|'+(R.country||'')+(R.tripId&&!R.stopId?'|'+tripSec():''), depth=()=>R.stopId?2:(R.tripId||R.country)?1:0;

  function showSec(k){ if(k===tripSec()){ const bar=$('#secTabs'); if(bar) window.scrollTo({top:Math.max(0,bar.offsetTop-topH()), behavior:'smooth'}); return; }

  // ---------- map ----------
  const worldFeat = topojson.feature(WORLD, WORLD.objects.countries);
  // Zoomable map. Pinch (two fingers) or the +/- buttons zoom; one finger still scrolls the page.
  // Pins and lines keep their on-screen size at any zoom. Zoom and the open pin card survive re-renders.
  const mapView={}, mapSel={};
  function drawMap(container, opts){
    const W=opts.width||720, H=opts.height||420, key=opts.key||'map', world=!!opts.world;
    const stops=(opts.stops||[]).filter(s=>s.lat!=null&&s.lon!=null), legs=opts.legs||[];
    const acts=(opts.places||[]).filter(p=>p.lat!=null&&p.lon!=null), sleeps=(opts.stays||[]).filter(x=>x.lat!=null&&x.lon!=null);
    const visited=new Set(opts.visitedN3||[]);
    let proj;
    if(world&&opts.focus&&opts.focus.length){ // one country: fit its cities, not the whole world
      proj=d3.geoMercator();
      if(opts.focus.length>1) proj.fitExtent([[90,120],[W-200,H-50]],{type:'MultiPoint',coordinates:opts.focus}); // room for photo pins above, zoom buttons on the right

    else if(world) proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:'Sphere'});
    else {
      const away=stops.filter(s=>!s.home);
      const pts=(away.length?away:stops).map(s=>[s.lon,s.lat]).concat(acts.map(p=>[p.lon,p.lat]));
      proj=d3.geoMercator();
      if(pts.length>=2) proj.fitExtent([[40,46],[W-100,H-46]],{type:'MultiPoint',coordinates:pts});
      else if(pts.length===1) proj.scale(2400).center(pts[0]).translate([W/2,H/2]);
      else proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:'Sphere'});
      if(pts.length&&proj.scale()>40000){ // one tight cluster: don't zoom past street level

    }
    const path=d3.geoPath(proj);
    const svg=d3.create('svg').attr('viewBox',[0,0,W,H]).attr('role','img').attr('aria-label',opts.label||'Map').style('touch-action','pan-x pan-y');
    svg.append('rect').attr('width',W).attr('height',H).attr('fill','var(--sea)');
    const g=svg.append('g');
    g.append('g').selectAll('path').data(worldFeat.features).join('path').attr('d',path)
      .attr('fill',d=>visited.has(String(d.id))?'var(--land-visited)':'var(--land)').attr('stroke','var(--border-land)').attr('stroke-width',.6).attr('vector-effect','non-scaling-stroke')
      .attr('data-n3',d=>opts.onCountry&&visited.has(String(d.id))?String(d.id):null).style('cursor',d=>opts.onCountry&&visited.has(String(d.id))?'pointer':null);
    const lines=[], marks=[];
    // side trips: dotted line from the city to each activity pin
    const gx=g.append('g').attr('fill','none').attr('stroke','var(--accent)').attr('opacity',.7);
    if(!world) acts.forEach(p=>{ const s=stopOf(p.stopId); if(!s||s.lat==null) return;
      const d=path({type:'LineString',coordinates:[[s.lon,s.lat],[p.lon,p.lat]]}); if(d) lines.push({el:gx.append('path').attr('d',d), w:1.6, dash:[2,4]}); });
    // routes of imported runs, rides and hikes
    const gt=g.append('g').attr('fill','none').attr('stroke','var(--track)').attr('stroke-linecap','round').attr('stroke-linejoin','round');
    if(!world) (opts.places||[]).forEach(p=>{ if(!Array.isArray(p.track)||p.track.length<2) return;
      const d=path({type:'LineString',coordinates:p.track.map(q=>[q[1],q[0]])}); if(d) lines.push({el:gt.append('path').attr('d',d), w:3, dash:null}); });
    const gl=g.append('g').attr('fill','none').attr('stroke-linecap','round');
    const ga=g.append('g');
    // the legs come in travel order (tripLegs chains each day: A→B before B→C); only regroup by date, keeping that order
    const order=legs.map((l,i)=>[l,i]).sort((a,b)=>(a[0].date||'').localeCompare(b[0].date||'')||a[1]-b[1]).map(x=>x[0]);
    const legEls=[];
    order.forEach(l=>{
      const a=stopOf(l.fromId), b=stopOf(l.toId); if(!a||!b||a.lat==null||b.lat==null) return;
      const tr=legTrack(l), d=path({type:'LineString',coordinates:tr||[[a.lon,a.lat],[b.lon,b.lat]]}); if(!d) return;
      const color=(MODES[l.mode]||MODES.car).color;
      const ln={el:gl.append('path').attr('d',d).attr('stroke',color).attr('opacity',.95), w:world?1.6:3.2, dash:l.mode==='plane'?[7,6]:l.mode==='train'?[2,5]:null};
      lines.push(ln); legEls.push(ln);
      if(world) return;
      // direction arrow halfway along the leg
      // a flight from/to home has its middle off the map: put its badge near the trip end instead
      const lenKm=haversine(a,b), near=Math.min(.5, 12/Math.max(lenKm,1));
      const bt=a.home&&!b.home?1-near:b.home&&!a.home?near:.5;
      const gi=tr?(f=>tr[Math.min(tr.length-1,Math.round(f*(tr.length-1)))]):d3.geoInterpolate([a.lon,a.lat],[b.lon,b.lat]), mm=proj(gi(bt)), m=proj(gi(.62)), p0=proj(gi(.57)), p1=proj(gi(.67));
      if(!m||!mm||!p0||!p1||Math.hypot(p1[0]-p0[0],p1[1]-p0[1])<.01) return;
      const badge=ga.append('g').node();
      d3.select(badge).append('circle').attr('r',11).attr('fill','var(--surface)').attr('stroke',color).attr('stroke-width',2);
      d3.select(badge).append('text').attr('text-anchor','middle').attr('dy','.36em').attr('font-size',12).text(MODE_EMOJI[l.mode]||'🚗');
      marks.push({node:badge, x:mm[0], y:mm[1]});
      const node=ga.append('g').node();
      d3.select(node).append('path').attr('d','M-5,-5 L5,0 L-5,5 Z').attr('fill',color).attr('stroke','var(--sea)').attr('stroke-width',1.5)
        .attr('transform','rotate('+(Math.atan2(p1[1]-p0[1],p1[0]-p0[0])*180/Math.PI)+')');
      marks.push({node, x:m[0], y:m[1]});
    });
    const gs=g.append('g');
    const items={};
    const pin=(x,y,id,draw)=>{ const node=gs.append('g').attr('data-pin',id).style('cursor','pointer').node(); draw(d3.select(node)); marks.push({node,x,y}); };
    if(world){
      stops.forEach(s=>{ const p=proj([s.lon,s.lat]); if(!p) return; items['s:'+s.id]={type:'stop', s};
        pin(p[0],p[1],'s:'+s.id,m=>{ m.append('circle').attr('r',12).attr('fill','transparent'); m.append('circle').attr('r',3.5).attr('fill','var(--surface)').attr('stroke','var(--ink)').attr('stroke-width',1.4); }); });
      // one photo pin per trip (its cover photo, labelled with the month), like a travel scrapbook
      // photo pins: the point always sits on the real place; when two photos would cover each other the later one
      // leans aside on a short stick (it stays the same size on screen at any zoom, like the pins)
      const placed=[];
      (opts.tripPins||[]).forEach((tp,i)=>{ const p0=proj([tp.lon,tp.lat]); if(!p0) return; items['t:'+tp.id]={type:'trip', tp};
        let dx=0; for(let k=0;k<8;k++){ const hit=placed.find(q=>Math.abs(q[0]-(p0[0]+dx))<70&&Math.abs(q[1]-p0[1])<74); if(!hit) break;
          dx+=(p0[0]>=hit[0]-dx?1:-1)*(70-Math.abs(hit[0]-(p0[0]+dx))+4); }
        placed.push([p0[0]+dx,p0[1]]);
        pin(p0[0],p0[1],'t:'+tp.id,m=>{ const cid='tpc'+i, bx=dx;
          if(dx){ m.append('path').attr('d','M0,0 L'+bx+',-10').attr('stroke','#fff').attr('stroke-width',5).attr('stroke-linecap','round');
            m.append('path').attr('d','M0,0 L'+bx+',-10').attr('stroke','var(--ink)').attr('stroke-width',1.6).attr('stroke-linecap','round'); }
          m.append('circle').attr('r',4).attr('fill','var(--ink)').attr('stroke','#fff').attr('stroke-width',1.5);
          const y0=dx?-10:0;
          m.append('clipPath').attr('id',cid).append('rect').attr('x',bx-27).attr('y',y0-66).attr('width',54).attr('height',54).attr('rx',9);
          m.append('rect').attr('x',bx-31).attr('y',y0-70).attr('width',62).attr('height',62).attr('rx',12).attr('fill','#fff').attr('stroke','rgba(0,0,0,.18)');
          if(tp.photo) m.append('image').attr('href','/_blob/'+tp.photo).attr('x',bx-27).attr('y',y0-66).attr('width',54).attr('height',54).attr('preserveAspectRatio','xMidYMid slice').attr('clip-path','url(#'+cid+')');
          else m.append('text').text('🧳').attr('x',bx).attr('text-anchor','middle').attr('y',y0-30).attr('font-size',30);
          if(!dx) m.append('path').attr('d','M-8,-8.5 L0,-1 L8,-8.5 Z').attr('fill','#fff');
          m.append('text').text(tp.label).attr('x',bx).attr('text-anchor','middle').attr('y',20).attr('font-family','Figtree, sans-serif').attr('font-size',17).attr('font-weight',700)
            .attr('fill','var(--ink)').attr('paint-order','stroke').attr('stroke','var(--sea)').attr('stroke-width',3);
          if(tp.sub) m.append('text').text(tp.sub).attr('x',bx).attr('text-anchor','middle').attr('y',37).attr('font-family','Figtree, sans-serif').attr('font-size',14).attr('font-weight',600)
            .attr('fill','var(--ink-soft)').attr('paint-order','stroke').attr('stroke','var(--sea)').attr('stroke-width',3); }); });
    } else {
      // one numbered pin per city, in visiting order; home shows as a small dot
      const seen=new Map(); let n=0;
      stops.slice().sort((a,b)=>(a.arrive||'').localeCompare(b.arrive||'')||(a.order||0)-(b.order||0)).forEach(s=>{
        const k=(s.home?'home:':'')+norm(s.city); if(seen.has(k)){ seen.get(k).visits.push(s); return; }
        const it={type:'stop', s, visits:[s], n:s.home?0:++n}; seen.set(k,it); items['s:'+s.id]=it;
        const p=proj([s.lon,s.lat]); if(!p) return;
        pin(p[0],p[1],'s:'+s.id,m=>{
          m.append('circle').attr('r',16).attr('fill','transparent');
          if(s.home){ m.append('circle').attr('r',5).attr('fill','var(--surface)').attr('stroke','var(--ink)').attr('stroke-width',2); }
          else { m.append('circle').attr('r',10).attr('fill','var(--ink)').attr('stroke','var(--surface)').attr('stroke-width',2);
            m.append('text').text(it.n).attr('text-anchor','middle').attr('dy','.35em').attr('fill','var(--surface)').attr('font-size',11).attr('font-weight',700).attr('font-family','Figtree, sans-serif'); }
          m.append('text').text(s.city).attr('x',s.home?9:14).attr('y',4).attr('font-family','Figtree, sans-serif').attr('font-size',13).attr('font-weight',700)
            .attr('fill','var(--ink)').attr('paint-order','stroke').attr('stroke','var(--sea)').attr('stroke-width',3.5);
        });
      });
      sleeps.forEach(x=>{ const q=proj([x.lon,x.lat]); if(!q) return; items['h:'+x.id]={type:'stay', x};
        pin(q[0],q[1],'h:'+x.id,m=>{ m.append('circle').attr('r',14).attr('fill','transparent');
          m.append('rect').attr('x',-8).attr('y',-8).attr('width',16).attr('height',16).attr('rx',4).attr('fill','var(--night)').attr('stroke','var(--surface)').attr('stroke-width',2);
          m.append('text').text('H').attr('text-anchor','middle').attr('dy','.36em').attr('fill','#fff').attr('font-size',10).attr('font-weight',800).attr('font-family','Figtree, sans-serif'); }); });
      acts.forEach(p=>{ const q=proj([p.lon,p.lat]); if(!q) return; items['p:'+p.id]={type:'place', p};
        pin(q[0],q[1],'p:'+p.id,m=>{ m.append('circle').attr('r',14).attr('fill','transparent');
          m.append('rect').attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('rx',3).attr('transform','rotate(45)')
            .attr('fill',p.status==='done'?'var(--accent)':'var(--surface)').attr('stroke',p.status==='done'?'var(--surface)':'var(--accent)').attr('stroke-width',2); }); });
    }
    const apply=t=>{ g.attr('transform',t); const k=t.k;
      marks.forEach(m=>m.node.setAttribute('transform','translate('+m.x+','+m.y+') scale('+(1/k)+')'));
      lines.forEach(l=>{ l.el.attr('stroke-width',l.w/k); if(!l.anim) l.el.attr('stroke-dasharray',l.dash?l.dash.map(v=>v/k).join(' '):null); }); };
    const zoom=d3.zoom().scaleExtent(world?(opts.focus?[.15,30]:[1,30]):[.02,60])
      .filter(e=>(!e.ctrlKey||e.type==='wheel')&&!e.button&&!(e.touches&&e.touches.length<2))
      .on('zoom',e=>{ mapView[key]=e.transform; apply(e.transform); });
    svg.call(zoom).on('dblclick.zoom',null);
    svg.call(zoom.transform, mapView[key]||d3.zoomIdentity);
    container.innerHTML=''; container.appendChild(svg.node());
    // controls
    const ctl=document.createElement('div'); ctl.className='map-ctl';
    ctl.innerHTML='<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button><button type="button" aria-label="Reset view">⤢</button>'+(!world&&legEls.length?'<button type="button" aria-label="Replay the route">▶</button>':'');
    const [bIn,bOut,bReset,bPlay]=ctl.querySelectorAll('button');
    bIn.onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,2);
    bOut.onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,.5);
    bReset.onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);
    if(bPlay) bPlay.onclick=()=>{ const k=(mapView[key]||d3.zoomIdentity).k, step=Math.max(350,Math.min(900,6000/legEls.length));

    const card=document.createElement('div'); card.className='map-card'; card.hidden=true; container.appendChild(card);

      let html='', act=null;

        html=(tp.photo?'<img alt="" src="/_blob/'+tp.photo+'">':'')+'<div style="flex:1;min-width:0"><b>'+esc(tp.name)+'</b><div class="faint">'+esc(tp.when)+'</div></div>';
        act=tp.open||(()=>go({tab:'trips', tripId:tp.id, stopId:null}));
      } else if(it.type==='stop'){ const s=it.s, visits=it.visits||[s]; const ids=visits.map(v=>v.id);
        const np=S.places.filter(p=>ids.includes(p.stopId)).length, t=tripOf(s.tripId);
        const ph=[].concat(...visits.map(v=>v.photoIds||[]))[0];
        html=(ph?'<img alt="" src="/_blob/'+ph+'">':'')+'<div style="flex:1;min-width:0"><b>'+flag(s.countryA2)+' '+esc(s.city)+'</b><div class="faint">'
          +(world&&t?esc(t.name)+' · ':'')+visits.map(v=>fmtDate(v.arrive)+(v.depart&&v.depart!==v.arrive?' – '+fmtDate(v.depart):'')).join(' & ')+(world?'':' · '+np+' activit'+(np===1?'y':'ies'))+'</div></div>';
        if(opts.onStop&&!s.home) act=()=>opts.onStop(s);
      } else if(it.type==='stay'){ const x=it.x;
        html=((x.photoIds||[])[0]?'<img alt="" src="/_blob/'+x.photoIds[0]+'">':'')+'<div style="flex:1;min-width:0"><b>'+stayIcon(x)+' '+esc(x.name)+'</b><div class="faint">'+fmtDate(x.checkIn)+' – '+fmtDate(x.checkOut)+' · '+stayNights(x)+' night'+(stayNights(x)===1?'':'s')+(perNight(x)?' · '+perNight(x):'')+'</div></div>';

        html=((p.photoIds||[])[0]?'<img alt="" src="/_blob/'+p.photoIds[0]+'">':'')+'<div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><div class="faint">'+(p.date?fmtDate(p.date,{weekday:'short',month:'short',day:'numeric'})+' · ':'')
          +(p.status==='done'?'Been':'Want to go')+(statsLine(p)?'<br>'+statsLine(p):'')+'</div></div>';

      card.innerHTML=html+(act?'<button type="button" class="btn small">Open</button>':'')+'<button type="button" class="btn small ghost" aria-label="Close">✕</button>';
      const bs=card.querySelectorAll('button'); if(act) bs[0].onclick=act; bs[bs.length-1].onclick=()=>show(null);
      card.hidden=false; };
    svg.on('click',e=>{ const t=e.target.closest('[data-pin]'); if(!t&&opts.onCountry&&e.target.getAttribute&&e.target.getAttribute('data-n3')){ opts.onCountry(e.target.getAttribute('data-n3')); return; }
      show(t?t.getAttribute('data-pin'):null); });
    if(mapSel[key]) show(mapSel[key]);
  }
  function legendHtml(modes, acts, tracks){
    return '<div class="legend">'+modes.map(m=>'<span><i class="dot" style="background:'+MODES[m].color+'"></i>'+MODES[m].label+'</span>').join('')

  }

  // ---------- trip detail ----------

    const tripPlaces=S.places.filter(p=>p.tripId===t.id), unplaced=tripPlaces.filter(p=>p.lat==null);

        return cv?'<div class="trip-hero" style="background-image:url(/_blob/'+cv+')"><div class="hero-txt"><h1>'+esc(t.name)+'</h1><div class="hero-d">'+dates+'</div></div><button type="button" class="hero-pick" id="coverPick" aria-label="Change the cover photo">🖼</button><button type="button" class="hero-wrap" id="wrapBtn">✨ Wrapped</button></div>'
          +(t.notes?'<div class="faint">'+esc(t.notes)+'</div>':'')
          :'<div class="faint">'+dates+(t.notes?' · '+esc(t.notes):'')+'</div>'; })()
      + ((t.people||[]).length?'<div class="faint" style="margin-top:-10px">👥 '+t.people.length+' '+(t.people.length===1?'traveller':'travellers')+': '+esc(t.people.map(x=>x.name||x.email||'?').join(', '))+'</div>':'')
      + '<div class="pass"><div class="cell"><div class="k">Distance</div><div class="v mono">'+fmtKm(st.km)+'<small style="font-size:14px"> km</small></div></div>'
      + '<div class="cell"><div class="k">Days</div><div class="v">'+st.days+'</div></div>'
      + '<div class="cell"><div class="k">Cities</div><div class="v">'+st.cities+'</div></div>'
      + '<div class="cell"><div class="k">Spent</div><div class="v" style="font-size:'+(money.length>1?'18px':'26px')+'">'+(money.length?money.map(([c,a])=>fmtMoney(a,c)).join('<br>'):'—')+'</div></div></div>'
      + activeHtml(t)
      // one compact add bar under the numbers: 📷 photos · say or type · Add
      + '<div class="hero-add"><div class="qa">'+(assets||(sample&&sampleImages)?'<label class="btn primary hero-btn" for="heroPhotos" aria-label="Add photos">📷</label><input id="heroPhotos" type="file" accept="image/*" multiple hidden>':'')
        + (sample?'<input id="qaText" autocomplete="off" enterkeyhint="send" placeholder="🎤 dinner 45€ at Chez Pierre, Alex paid"><button class="btn" type="button" id="qaGo">Add</button>':'')+'</div>'
        + '<div class="faint" style="font-size:12.5px">📷 Photos or 🎤 a sentence become activities, meals, receipts or stays on the right day.</div></div>'

    main.querySelectorAll('#secTabs [data-sec]').forEach(b=>b.onclick=()=>showSec(b.dataset.sec));

      if(x.notes&&x.notes!==k.notes) ch.notes=[k.notes,x.notes].filter(Boolean).join(' · ');

      try{ await patch('legs', k.id, ch); await del('legs', x.id); toast('Merged into one drive'); }catch(e){ b.disabled=false; toast('Couldn\'t merge them. Try again.'); } });

  function whoPaidHtml(list){
    const m={}; list.filter(e=>e.paidBy).forEach(e=>{ const k=e.paidBy; m[k]=m[k]||{}; m[k][e.currency||'EUR']=(m[k][e.currency||'EUR']||0)+(+e.amount||0); });
    const names=Object.keys(m); if(!names.length) return '';
    return '<div class="sec-title"><h2 style="font-size:18px">Who paid</h2><span class="faint">Everything with a price</span></div><div class="card">'
      + names.sort().map(n=>'<div class="budget-row"><span>'+esc(n)+'</span><span class="amt">'+Object.entries(m[n]).map(([c,a])=>fmtMoney(a,c)).join(' + ')+'</span></div>').join('')+'</div>';
  }
  function budgetHtml(tid){
    const lines=costLines(tid);
    if(!lines.length) return '<div class="card empty"><p>Add a cost to any leg, place or expense and the trip total builds here.</p></div>';
    const tot=totalsByCur(lines);
    const byCat={}; lines.forEach(l=>{ const k=l.cat+'|'+l.cur; byCat[k]=(byCat[k]||0)+l.amount; });
    const max=Math.max(...Object.values(byCat));
    const other=S.expenses.filter(e=>e.tripId===tid), trip=tripOf(tid);
    const bizHtml=tripPurpose(trip)==='personal'?'':(()=>{ const b=totalsByCur(lines.filter(l=>l.biz)), pz=totalsByCur(lines.filter(l=>!l.biz)), f=m=>Object.keys(m).length?Object.entries(m).map(([c,a])=>fmtMoney(a,c)).join(' + '):'—';
      return '<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px"><div class="between"><span>💼 Business</span><span class="amt">'+f(b)+'</span></div><div class="between"><span>🏖 Personal</span><span class="amt">'+f(pz)+'</span></div>'
        + (downloads?'<div class="row"><button type="button" class="btn small" id="bizXlsx">⬇ Business expense report</button><button type="button" class="btn small ghost" id="bizPdf">⬇ Receipts PDF</button></div>':'')+'</div>'; })();
    return bizHtml+'<div class="card">'+Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,a])=>{ const [cat,cur]=k.split('|');
        return '<div class="budget-row" style="display:block"><div class="between"><span>'+expIcon(cat)+' '+esc(cat)+'</span><span class="amt">'+fmtMoney(a,cur)+'</span></div><div class="bar"><i style="width:'+Math.round(a/max*100)+'%"></i></div></div>'; }).join('')
      + '<div class="budget-row" style="font-weight:700"><span>Total</span><span class="amt">'+Object.entries(tot).map(([c,a])=>fmtMoney(a,c)).join(' + ')+'</span></div></div>'
      + (other.length?'<div class="card">'+other.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>'<div class="budget-row" data-exp="'+e.id+'" style="cursor:pointer;gap:10px"><span style="min-width:0">'+expIcon(e.category,e.label)+' '+esc(e.label)+(tripPurpose(trip)!=='personal'&&isBiz(e)?' 💼':'')+' <span class="faint">· '+esc(e.category||'Other')+(e.date?' · '+fmtDate(e.date):'')+(e.city?' · '+esc(e.city):'')+(e.paidBy?' · paid by '+esc(e.paidBy):'')+'</span>'
          + (e.notes?'<span class="faint" style="display:block;white-space:pre-wrap">'+esc(e.notes)+'</span>':'')+'</span><span class="amt" style="display:flex;gap:8px;align-items:center;flex-shrink:0">'+((e.photoIds||[]).length?'<img alt="Receipt" src="/_blob/'+e.photoIds[0]+'" data-photo="'+e.photoIds[0]+'" style="width:32px;height:32px;object-fit:cover;border-radius:6px;cursor:zoom-in">':'')+fmtMoney(e.amount,e.currency)+'</span></div>').join('')+'</div>':'')
      + whoPaidHtml(other.concat(S.places.filter(p=>p.tripId===tid&&+p.cost&&p.paidBy).map(p=>({paidBy:p.paidBy, currency:p.currency, amount:p.cost})),
          S.legs.concat(S.stays).filter(x=>x.tripId===tid&&+x.cost&&x.paidBy).map(x=>({paidBy:x.paidBy, currency:x.currency, amount:x.cost}))))
      + (downloads&&other.some(e=>(e.photoIds||[]).length)?'<button type="button" class="btn small ghost" id="allPdf" style="align-self:flex-start">⬇ All receipts as PDF</button>':'')
      + '<div class="faint">Totals are kept per currency; no exchange rates are applied.</div>';
  }

  // ---------- city ----------
  function renderCity(){
    const s=stopOf(R.stopId); if(!s){ go({stopId:null}); return; }
    const t=tripOf(s.tripId);
    const twins=S.stops.filter(x=>x.tripId===s.tripId && norm(x.city)===norm(s.city)); const ids=twins.map(x=>x.id);

    $('#editStop').onclick=()=>stopSheet(s);

      .concat(S.stays.filter(x=>ids.includes(x.stopId)&&x.cost).map(x=>({amount:+x.cost,cur:x.currency||'EUR'}))));

    main.innerHTML =
      '<div class="faint">'+flag(s.countryA2)+' '+esc(s.country||'')+' · '+twins.map(x=>fmtDate(x.arrive)+(x.depart&&x.depart!==x.arrive?' – '+fmtDate(x.depart):'')).join(' & ')+(t?' · '+esc(t.name):'')+'</div>'
      + '<div class="row"><button class="btn primary" id="addPlace">'+ICON.plus+' Activity</button>'
      + (assets?'<label class="btn" for="cityPhotoIn">'+ICON.camera+' Photos</label><input id="cityPhotoIn" type="file" accept="image/*" multiple hidden>':'')
      + '<button class="btn" id="topHere">'+ICON.spark+' Top 10 here</button></div>'
      + (cityPhotos.length?'<div class="photos">'+cityPhotos.map(id=>'<img alt="Photo in '+esc(s.city)+'" src="/_blob/'+id+'" data-photo="'+id+'" data-list="'+cityPhotos.join(',')+'">').join('')+'</div>':'')
      + (cityStays.length?'<div class="card">'+cityStays.map(x=>'<div class="day-i night" style="padding:10px 14px;border-top:none" data-stay="'+x.id+'"><span class="mini" style="background:var(--night)">'+stayIcon(x)+'</span><span style="flex:1">Staying at <b>'+esc(x.name)+'</b> <span class="faint">'+fmtDate(x.checkIn)+' – '+fmtDate(x.checkOut)+' · '+stayNights(x)+' night'+(stayNights(x)===1?'':'s')+(perNight(x)?' · '+perNight(x):'')+'</span></span></div>').join('')+'</div>':'')
      + (Object.keys(spent).length?'<div class="faint">Spent here: '+Object.entries(spent).map(([c,a])=>fmtMoney(a,c)).join(' + ')+'</div>':'')
      + (cats.length>1?'<div class="chips"><button class="chip '+(R.placeCat==='all'?'on':'')+'" data-cat="all">All</button>'+cats.map(c=>'<button class="chip '+(R.placeCat===c?'on':'')+'" data-cat="'+c+'">'+catIcon(c)+' '+esc(CAT_LABEL[c]||c)+'</button>').join('')+'</div>':'')
      + (places.length?places.map(p=>'<div class="card place" data-place="'+p.id+'"><div class="head"><div><h3>'+esc(p.name)+'</h3><div class="faint">'+catIcon(p.category)+' '+esc(CAT_LABEL[p.category]||p.category)+(p.date?' · '+fmtDate(p.date):'')+(p.cost?' · '+fmtMoney(p.cost,p.currency):'')+(statsLine(p)?' · '+statsLine(p):'')+'</div></div>'

  let discoverCtl=null;
  async function runDiscover(){
    if(!discover.city.trim()){ discover.error='Type a city first.'; render(); return; }
    if(!discover.interests.length){ discover.error='Pick at least one thing you\'re looking for.'; render(); return; }
    discover.loading=true; discover.error=''; render();
    discoverCtl=new AbortController();
    const prompt='You are a sharp local travel guide. City: '+discover.city.slice(0,80)+'. The traveller wants: '+discover.interests.join(', ')+'. Vibe: '+discover.vibe+'.'
      + (discover.extra?' Extra context: '+discover.extra.slice(0,200)+'.':'')
      + ' Give exactly 10 specific, real recommendations (named places, routes or concrete tactics), ranked best first. For practical topics (airport transfer, Uber vs taxi, saving money) give concrete options with typical prices. '
      + 'Reply with only a JSON array of 10 objects: {"name": string, "category": string (one of: food, restaurant, museum, attraction, hike, run, hotel, nightlife, shopping, transport, tip), "why": string (max 25 words), "area": string (neighbourhood or distance), "price": string (e.g. "€", "€€€", "~€18", "free"), "tip": string (one insider tip, max 20 words)}.';
    try{
      const r=await sample.json(prompt,{signal:discoverCtl.signal, cache:{gcTime:3600000}});
      if(!Array.isArray(r)||!r.length) throw {code:'invalid_json'};
      discover.results=r.slice(0,10).map(x=>({name:String(x.name||''),category:String(x.category||''),why:String(x.why||''),area:String(x.area||''),price:String(x.price||''),tip:String(x.tip||'')}));
      discover.resultsTitle='Top 10 · '+discover.city;
    }catch(e){
      const c=e&&e.code;
      discover.error = c==='not_granted'||c==='sampling_disabled'?'Claude isn\'t allowed for this page, so recommendations are off.'
        : c==='rate_limited'?'Too many requests right now. Try again in a minute.'
        : c==='cancelled'?'' : c==='invalid_json'?'The answer came back in the wrong format. Try again.':'Couldn\'t get recommendations. Check your connection and try again.';
    }finally{ discover.loading=false; render(); }
  }

  }

  // ---------- sheets ----------
  function openSheet(html, bind){
    layer.innerHTML='<div class="backdrop" id="bd"><form class="sheet" id="sheet" novalidate>'+html+'</form></div>';
    const bd=$('#bd'), sh=$('#sheet'); bd.onclick=e=>{ if(e.target===bd) closeSheet(); };
    document.addEventListener('keydown', escClose);
    // the phone keyboard: keep the sheet above it, scrollable, and easy to put away
    sh.addEventListener('submit', e=>{ if(!sh.onsubmit) e.preventDefault(); }); // a sheet without a Save never reloads the page on Enter
    sh.addEventListener('keydown', e=>{ const x=e.target; if(e.key==='Enter'&&x.tagName==='INPUT'&&!sh.onsubmit){ e.preventDefault(); x.blur(); } });
    const typing=el=>el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!/^(checkbox|radio|range|file|button)$/.test(el.type||'');
    sh.addEventListener('touchstart', e=>{ const a=document.activeElement; if(typing(a)&&!typing(e.target)&&!(e.target.closest&&e.target.closest('label'))) a.blur(); }, {passive:true});
    // inside the Claude app the page isn't told the keyboard's height: a Done button at the top, a swipe puts the keyboard
    // away, and while typing the sheet gets room at the bottom so the next fields can scroll up above the keyboard
    const done=document.createElement('button'); done.type='button'; done.className='kb-done'; done.textContent='Done ⌄'; done.hidden=true;
    done.addEventListener('pointerdown', e=>{ e.preventDefault(); const a=document.activeElement; if(a&&a.blur) a.blur(); });
    bd.appendChild(done);
    sh.addEventListener('focusin', e=>{ if(typing(e.target)){ done.hidden=false; sh.classList.add('kb-open'); } });
    sh.addEventListener('focusout', ()=>setTimeout(()=>{ if(!typing(document.activeElement)){ done.hidden=true; sh.classList.remove('kb-open'); } }, 60));
    let y0=null; sh.addEventListener('touchstart', e=>{ y0=e.touches[0].clientY; }, {passive:true});
    sh.addEventListener('touchmove', e=>{ if(y0!=null&&Math.abs(e.touches[0].clientY-y0)>14){ const a=document.activeElement; if(typing(a)) a.blur(); y0=null; } }, {passive:true});
    fitSheet(); bind(sh);
  }

  // Towns added from photos/entries have no leg yet: list the drives between consecutive cities that the route lacks.
  function missingLegs(tid){
    // the route you actually took: every timed activity/meal/expense, in time order, by its city
    const ok=s=>s&&!s.home&&s.lat!=null, today=todayStr();
    const ev=S.places.concat(S.expenses).filter(x=>x.tripId===tid&&x.date&&x.date<=today&&hhmm(x)&&ok(stopOf(x.stopId)))
      .map(x=>({t:x.date+'T'+hhmm(x), d:x.date, s:stopOf(x.stopId), p:x.lat!=null?x:null})).sort((a,b)=>a.t.localeCompare(b.t));
    let seq=[]; ev.forEach(e=>{ if(!seq.length||norm(seq[seq.length-1].s.city)!==norm(e.s.city)) seq.push(e); });
    // a lone entry filed far off the route (e.g. a dinner pinned 180 km away, between two Bayonne entries) isn't a drive
    for(let i=1;i<seq.length-1;i++){ const a=seq[i-1].s, b=seq[i].s, c=seq[i+1].s;
      if(haversine(a,b)+haversine(b,c) > 2.5*haversine(a,c)+60){ seq.splice(i,1); i=Math.max(0,i-2); } }
    seq=seq.filter((e,i)=>!i||norm(seq[i-1].s.city)!==norm(e.s.city));
    const legs=tripLegs(tid), cityOf=id=>norm((stopOf(id)||{}).city), out=[], seen=new Set();
    for(let i=1;i<seq.length;i++){ const A=seq[i-1], B=seq[i], bc=norm(B.s.city);
      // follow legs already logged from A (e.g. Pilat → Messanges) before deciding what's missing
      // only legs that had left by B's time: a drive later that day doesn't explain where you were at 14:29
      let cur=A.s, covered=false; const bt=B.t.slice(11), before=l=>!(l.date===B.d&&legTime(l)&&legTime(l)>bt);
      for(let g=0; g<6; g++){ const l=legs.find(l=>cityOf(l.fromId)===norm(cur.city)&&l.date>=A.d&&l.date<=B.d&&before(l));
        if(!l) break; if(cityOf(l.toId)===bc){ covered=true; break; } cur=stopOf(l.toId)||cur; if(!cur.lat) break; }
      // or the route already reaches B that day from anywhere (Pilat → Messanges covers Arcachon → Messanges)
      if(!covered) covered=legs.some(l=>cityOf(l.toId)===bc&&l.date>=A.d&&l.date<=B.d);
      if(covered||norm(cur.city)===bc) continue;
      // the actual pins say you barely moved (laundry in a Bayonne suburb, run in Bayonne next morning)
      if(cur===A.s&&A.p&&B.p&&haversine(A.p,B.p)<3) continue;
      const k=norm(cur.city)+'>'+bc; if(seen.has(k)) continue; seen.add(k);
      const d=haversine(cur,B.s); if(d<10) continue; // a village next to where you were (a yard sale in Ramous from Puyoô) isn't a drive to log
      out.push({a:cur, b:B.s, date:B.d, km:Math.round(d*ROAD_FACTOR.car)}); }
    return out;
  }
  // at: a known position for the place (Timeline/GPS), used when Claude can't place the name, or places it far away
  async function ensureStop(trip, name, dateArrive, dateDepart, again, at){
    name=String(name||'').trim().replace(/[.,!?;:]+$/,'');
    const tripCities=[...new Set(tripStops(trip.id).filter(s=>!s.home).map(s=>s.city))];
    name=fuzzyCity(name, tripCities)||name;
    const n=norm(name);
    // reuse a stop in this trip if the dates touch it
    const existing=tripStops(trip.id).filter(s=>norm(s.city)===n);
    const hit=existing.find(s=>(dateArrive&&(s.arrive===dateArrive||s.depart===dateArrive))||(dateDepart&&(s.depart===dateDepart||s.arrive===dateDepart)))
      || (existing.length===1 && !dateArrive ? existing[0] : null);
    if(hit){
      const up={}; if(dateArrive && (!hit.arrive||dateArrive<hit.arrive)) up.arrive=dateArrive; if(dateDepart && (!hit.depart||dateDepart>hit.depart)) up.depart=dateDepart;
      if(Object.keys(up).length) await patch('stops', hit.id, up);
      return Object.assign({}, hit, up);
    }
    let g=null; try{ g=await geocode(name, tripCities.join(', ')); }catch(e){ if(!at) throw e; }
    // Claude's proper name may be a city the trip already has ("Donostia" → San Sebastián)

      const nb=S.stops.filter(x=>x.countryA2&&x.lat!=null).map(x=>[haversine(x,at),x]).sort((a,b)=>a[0]-b[0])[0], c=g||(nb&&nb[0]<400?nb[1]:{});

    if(!g) throw new Error('Couldn\'t find "'+name+'". Check the spelling, or add country (e.g. "Pau, France").');

  }

  const COUNTRY_TZ={FR:'Europe/Paris',ES:'Europe/Madrid',PT:'Europe/Lisbon',GB:'Europe/London',IE:'Europe/Dublin',IT:'Europe/Rome',DE:'Europe/Berlin',NL:'Europe/Amsterdam',BE:'Europe/Brussels',LU:'Europe/Luxembourg',CH:'Europe/Zurich',AT:'Europe/Vienna',

  const lonTz=(a2,lon)=>{ if(a2==='US') return lon<-150?'Pacific/Honolulu':lon<-130?'America/Anchorage':lon<-114.5?'America/Los_Angeles':lon<-101?'America/Denver':lon<-86?'America/Chicago':'America/New_York';

  function legSheet(trip, l, rec){

      + '<div class="hint" id="lDurH"></div>'

      + '<div class="field" id="lPaidF"'+(l&&+l.cost?'':' hidden')+'><label for="lPaid">Paid by</label>'+'<input id="lPaid" list="lPayers" autocomplete="off" value="'+esc(l&&l.paidBy||lastPayer(trip.id))+'"><datalist id="lPayers">'+payers(trip.id).map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'+bizBox('lBiz', trip, l, (l?l.date:dDate))+'</div>'

    form=>{
      $('#xCancel').onclick=closeSheet;

      // how long it took, from the two times (an arrival "earlier" than the departure is the next day)
      // each time is that city's own clock: the duration comes from the two time zones (Bordeaux 9:27 → Montreal 11:05 is 7h38),
      // and typing a duration fills the local arrival instead

        const m=legMins(); if(m!=null&&!durTyped&&val('lTime')&&val('lArr')) $('#lDur').value=Math.floor(m/60)+':'+pad2(m%60);
        let diff=''; if(za&&zb&&za!==zb){ const t0=localToUtc(za,d,dep||'12:00'), dh=(tzOffset(za,t0)-tzOffset(zb,t0))/60; if(dh) diff=(a?a.city:'')+' is '+Math.abs(dh)+' h '+(dh>0?'ahead of ':'behind ')+(b?b.city:''); }
        let next=''; if(m!=null&&dep){ const land=localToUtc(za,d,dep)+m*60000, ld=utcToLocalDate(zb,land); if(ld>d) next=' · lands the next day'; }
        h.textContent=m!=null?'⏱ '+fmtDur(m*60)+' on the way'+next+(diff?' · '+diff:''):(rec&&rec.durationS?'⏱ '+fmtDur(rec.durationS)+' recorded':(diff?'🕐 '+diff+': enter each time on its own city\'s clock':'')); };

      $('#lDur').addEventListener('input',()=>{ durTyped=true; const m=parseDur(val('lDur')), dep=val('lTime'); if(m!=null&&dep){ const {za,zb}=zones(), d=val('lDate')||todayStr(); $('#lArr').value=utcToLocalHM(zb, localToUtc(za,d,dep)+m*60000); } showDur(); });
      $('#lArr').addEventListener('input',()=>{ durTyped=false; showDur(); });
      $('#lTime').addEventListener('input',()=>{ const m=parseDur(val('lDur')); if(durTyped&&m!=null&&val('lTime')){ const {za,zb}=zones(), d=val('lDate')||todayStr(); $('#lArr').value=utcToLocalHM(zb, localToUtc(za,d,val('lTime'))+m*60000); } showDur(); });
      ['lFrom','lTo','lDate'].forEach(id=>$('#'+id).addEventListener('change',()=>{ showDur(); const z=zones(); ensureTz([z.a,z.b]).then(showDur); }));
      showDur(); { const z=zones(); ensureTz([z.a,z.b]).then(()=>{ if(form.isConnected) showDur(); }); }

    });
  }

  // Stops no remaining leg uses: delete the empty ones, say which still hold activities or photos.
  async function dropEmptyStops(ids, goneLegId){
    const kept=[];
    for(const id of [...new Set(ids)]){ const s=stopOf(id); if(!s) continue;
      if(S.legs.some(l=>l.id!==goneLegId&&(l.fromId===id||l.toId===id))) continue;
      const busy=(s.photoIds||[]).length||S.places.some(p=>p.stopId===id)||S.expenses.some(e=>e.stopId===id);
      if(busy){ kept.push(s.city); continue; }
      try{ await del('stops', id); }catch(e){}
    }
    if(kept.length) setTimeout(()=>toast([...new Set(kept)].join(', ')+' still has activities or photos. Open it and use Remove city to take it off the trip.'), 300);
  }
  // Remove a city (every visit to it in this trip) with its legs and activities. Photos stay in storage; expenses keep their city name.
  async function removeCity(stops){
    const ids=stops.map(x=>x.id);
    for(const l of S.legs.filter(l=>ids.includes(l.fromId)||ids.includes(l.toId))) await del('legs', l.id);
    for(const p of S.places.filter(p=>ids.includes(p.stopId))) await del('places', p.id);
    for(const x of S.stays.filter(x=>ids.includes(x.stopId))) await del('stays', x.id);
    for(const e of S.expenses.filter(e=>ids.includes(e.stopId))) await patch('expenses', e.id, {stopId:''});
    for(const id of ids) await del('stops', id);
  }

  function stopSheet(s){

  // Add or edit an activity / place. From a city page `stop` is set; from a trip day it is null and the
  // city follows the date. opts: {trip, date, files (photos to read first), any (photo may turn out to be a receipt)}.
  function placeSheet(stop, p, opts){
    opts=opts||{};

    let rating=p?p.rating||0:0, status=p?p.status||'done':(opts.todo||date0&&date0>todayStr()?'want':'done'), photoIds=p?(p.photoIds||[]).slice():[];
    let picked=[], uploading=false, reading=false, cityTouched=!!stop||!!p, statusTouched=!!p;
    let pos=p&&p.lat!=null?{lat:p.lat, lon:p.lon, name:p.name}:(pre&&pre.lat!=null?{lat:pre.lat, lon:pre.lon}:null);
    if(!p&&pre&&pre.photoIds) photoIds=pre.photoIds.slice();
    const isMeal=c=>MEAL_KEYS.has(c);
    openSheet('<h2 id="pTitle">'+(p?(isMeal(p.category)?'Edit meal':'Edit activity'):(pre&&isMeal(pre.category)?'Add a meal':'Add an activity'))+'</h2>'
      + (assets||canRead?'<div class="field"><label>Photos</label><div class="photos" id="pPhotos"></div><div class="row"><label class="btn small" for="pPhotoIn">'+ICON.camera+' Add photos</label><input id="pPhotoIn" type="file" accept="image/*" multiple hidden>'
        + (canRead?'<button type="button" class="btn small" id="pRead" hidden>'+ICON.spark+' Fill in from photo</button>':'')+'</div>'
        + '<div class="hint" id="pUp">'+(canRead&&!p?'Start with a photo: Claude reads where and when it was taken and what it shows.':'')+'</div></div>':'')
      + '<div class="field"><label for="pName">What</label><input id="pName" value="'+esc(p?p.name:'')+'" placeholder="'+(pre&&isMeal(pre.category)?'e.g. Chez Pierre, oysters at the market':'e.g. Dune du Pilat, surf lesson, Guggenheim')+'"></div>'
      + '<div class="grid2"><div class="field"><label for="pDate">Date</label><input id="pDate" type="date" value="'+esc(date0)+'"></div>'
      + '<div class="field"><label for="pTime">Time (optional)</label><input id="pTime" type="time" value="'+esc(p?hhmm(p):((pre&&pre.time)||(date0===todayStr()&&!opts.todo?nowHM():'')))+'"></div></div>'
      + '<div class="grid2"><div class="field"><label for="pCity">City</label><input id="pCity" list="pCities" autocomplete="off" placeholder="From the photo, or type" value="'+esc(p?((stopOf(p.stopId)||{}).city||p.city||''):stop?stop.city:'')+'"><datalist id="pCities">'+cityNames.map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div>'
      + '<div class="field"><label for="pCat">Type</label><select id="pCat">'+catOptions(p?p.category:(pre&&pre.category)||'attraction')+'</select></div></div>'
      + '<div class="field"><label for="pLoc">Location</label><div style="display:flex;gap:6px"><input id="pLoc" autocomplete="off" value="'+esc(p&&p.address||'')+'" placeholder="Filled from the photo, or type a place or address" style="flex:1;min-width:0">'
        + '<button type="button" class="btn small" id="pFind" aria-label="Find this place">🔎 Find</button><button type="button" class="btn small ghost" id="pClr" aria-label="Remove the location">✕</button></div>'
        + '<div id="pFound"></div><div class="hint" id="pPos">'+(p&&p.track&&p.track.length?'📍 Route on the map · '+statsLine(p):pos?'📍 Pinned on the map':'')+'</div></div>'
      + '<div class="field"><label>Status</label><div class="row"><button type="button" class="chip '+(status==='done'?'on':'')+'" data-st="done">Been</button><button type="button" class="chip '+(status==='want'?'on':'')+'" data-st="want">Want to go</button></div></div>'
      + '<div class="field"><label>Rating</label><div class="rating" id="rating">'+[1,2,3,4,5].map(i=>'<button type="button" data-r="'+i+'" aria-label="'+i+' stars" class="'+(i<=rating?'on':'')+'">★</button>').join('')+'</div></div>'
      + (()=>{ const x=p||(pre&&pre.extra)||{}, sp=SPORTS.has(p?p.category:(pre&&pre.category)||'');
          return '<div class="grid2" id="pSportF"'+(sp?'':' hidden')+'><div class="field"><label for="pKm">Distance km</label><input id="pKm" inputmode="decimal" placeholder="e.g. 8.4" value="'+(x.distanceKm?esc(x.distanceKm):'')+'"></div>'
            + '<div class="field"><label for="pDur">Time (h:mm)</label><input id="pDur" inputmode="numeric" placeholder="e.g. 0:45" value="'+(x.movingS?Math.floor(x.movingS/3600)+':'+pad2(Math.round(x.movingS%3600/60)):'')+'"></div></div>'
            + '<div class="field" id="pViaF"'+(sp?'':' hidden')+'><label for="pVia">Through (towns along the way)</label><input id="pVia" autocomplete="off" placeholder="e.g. Capbreton, Hossegor, Seignosse" value="'+esc((x.via||[]).join(', '))+'"></div>'; })()
      + '<div class="grid3"><div class="field"><label for="pCost">Price (optional)</label><input id="pCost" inputmode="decimal" value="'+esc(p&&p.cost?p.cost:'')+'"></div><div class="field"><label for="pCur">Currency</label>'+curSelect('pCur', p?p.currency:trip.currency)+'</div></div>'
      + '<div class="field" id="pPaidF"'+(p&&+p.cost?'':' hidden')+'><label for="pPaid">Paid by</label>'+'<input id="pPaid" list="pPayers" autocomplete="off" value="'+esc(p&&p.paidBy||lastPayer(trip.id))+'"><datalist id="pPayers">'+payers(trip.id).map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'+bizBox('pBiz', trip, p, date0)+'</div>'
      + '<label class="row" style="gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" id="pPriv" style="width:20px;height:20px"'+(p&&p.private?' checked':'')+'> 🔒 Keep off shares <span class="faint">(stays in your log, never on images or videos)</span></label>'
      + '<div class="field"><label for="pNotes">Notes</label><textarea id="pNotes" placeholder="What you did, what you ordered, would you go back?">'+esc(p?p.notes||'':'')+'</textarea></div>'
      + '<div class="err" id="fErr" hidden></div>'
      + '<button type="button" class="btn small ghost" id="pToExp" style="align-self:flex-start">💳 Turn into an expense</button>'
      + '<div class="row"><button class="btn primary" type="submit" id="pSave">Save</button><button class="btn" type="button" id="xCancel">Cancel</button>'+(p?'<button class="btn danger" type="button" id="xDel" style="margin-left:auto">Delete</button>':'')+'</div>',
    form=>{
      $('#xCancel').onclick=closeSheet;
      const hint=t=>{ const el=$('#pUp'); if(el) el.textContent=t; };
      const sync=()=>{ if(!form.isConnected) return; $('#pSave').disabled=uploading||reading;
        const rb=$('#pRead'); if(rb){ rb.hidden=!(picked.length||photoIds.length); rb.disabled=uploading||reading; } };
      const orig=photoIds.slice(), added=[];
      const pEl=$('#pPhotos'), drawEd=pEl?photoEditor(pEl, ()=>photoIds, v=>{ photoIds=v; }, sync):null;
      const drawPhotos=()=>{ if(drawEd) drawEd(); sync(); };
      const setStatus=s=>{ status=s; form.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x.dataset.st===s)); };
      drawPhotos();
      form.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ statusTouched=true; setStatus(b.dataset.st); });
      $('#rating').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const r=+b.dataset.r; rating = rating===r?0:r; $('#rating').querySelectorAll('button').forEach(x=>x.classList.toggle('on', +x.dataset.r<=rating)); });
      $('#pCity').addEventListener('input',()=>{ cityTouched=true; });
      $('#pDate').onchange=()=>{ const d=val('pDate'); if(!statusTouched&&d) setStatus(d>todayStr()?'want':'done'); };
      let timeTouched=!!p; $('#pTime').addEventListener('input',()=>{ timeTouched=true; }); $('#pDate').addEventListener('input',()=>{ timeTouched=true; });
      async function addFiles(fs, autoRead){
        picked=picked.concat(fs);
        if(assets){ uploading=true; sync(); hint('Uploading…'); const up=await uploadPhotos(fs); added.push(...up); photoIds=photoIds.concat(up); uploading=false; if(!form.isConnected) return; drawPhotos(); hint(''); }
        sync();
        // the photo's own date and time (when it was taken) win over "now", unless typed by hand
        let m=null; for(const f of fs){ m=await readExif(f); if(m&&(m.date||m.time)) break; }
        if(!form.isConnected) return;
        if(m&&!timeTouched){
          if(m.date&&!p){ $('#pDate').value=m.date; $('#pDate').onchange(); }
          if(m.time&&(!m.date||m.date===val('pDate'))) $('#pTime').value=m.time;
        }
        if(autoRead&&canRead) await fill();
        else if(m&&!p&&m.lat!=null) fromGps(m.lat, m.lon);
      }
      async function fill(){
        let imgs=picked.slice(-sampleImages);
        if(!imgs.length&&photoIds.length){ try{ const r=await fetch('/_blob/'+photoIds[photoIds.length-1]); if(r.ok) imgs=[await r.blob()]; }catch(e){} }
        if(!form.isConnected) return;
        if(!imgs.length){ hint('Add the photo again so Claude can read it.'); return; }
        reading=true; sync(); hint('Claude is looking at the photo…');
        try{
          const r=await readPhoto(trip, imgs, opts.any&&!p?'any':'activity');
          if(!form.isConnected) return;
          if(r.kind==='receipt'&&r.expCat!=='Food & drink'&&opts.any&&!p){ closeSheet(); expenseSheet(trip, null, null, {photoIds, picked, result:r}); return; }
          if(r.kind==='stay'&&opts.any&&!p){ closeSheet(); staySheet(null, {trip, pre:{photoIds, picked}}); return; }
          const set=(id,v)=>{ if(v!=null&&v!=='') $('#'+id).value=v; };
          set('pName', r.name);
          const meal=r.kind==='receipt'&&r.expCat==='Food & drink'||MEAL_KEYS.has(r.actCat);
          if(meal&&!catTouched) $('#pCat').value=MEALS.some(m=>m[0]===r.actCat)?r.actCat:mealFor(r.time,r.name); else set('pCat', r.actCat);
          if(meal) $('#pTitle').textContent=p?'Edit meal':'Add a meal';
          if(!timeTouched){ if(r.date){ $('#pDate').value=r.date; }
            if(r.time) $('#pTime').value=r.time; else if(r.date&&r.date!==todayStr()&&!p) $('#pTime').value=''; }
          if(r.city&&!r.gps&&!cityTouched&&!val('pCity').trim()) $('#pCity').value=r.city; // with GPS the photo's own town is used (below)
          $('#pDate').onchange();
          if(r.amount!=null&&!val('pCost').trim()){ set('pCost', String(r.amount)); if(r.currency){ const sel=$('#pCur'); if(![...sel.options].some(o=>o.value===r.currency)) sel.add(new Option(r.currency)); sel.value=r.currency; } }
          if(r.notes&&!val('pNotes').trim()) $('#pNotes').value=r.notes;
          if(r.gps) fromGps(r.lat, r.lon, r.name);
          else if(r.lat!=null){ pos={lat:r.lat, lon:r.lon, name:r.name}; if(!val('pLoc').trim()) $('#pLoc').value=r.name; $('#pPos').textContent='📍 Pinned where Claude thinks "'+r.name+'" is'+(r.city&&!cityNames.includes(r.city)?' (near '+r.city+')':'')+'. Change it above if that\'s wrong.'; }
          hint('Filled in from the photo. Add a rating or price if you like, then save.');
        }catch(e){ hint(photoError(e)); }
        finally{ reading=false; sync(); }
      }
      const pin=$('#pPhotoIn'); if(pin) pin.onchange=()=>{ const fs=Array.from(pin.files||[]); pin.value=''; if(fs.length) addFiles(fs, !p&&!val('pName').trim()); };
      const rb=$('#pRead'); if(rb) rb.onclick=fill;
      if(opts.files&&opts.files.length) addFiles(opts.files, true);
      if(pre){ if(pre.name) $('#pName').value=pre.name; if(pre.category) $('#pCat').value=pre.category;
        if(pre.cost){ $('#pCost').value=pre.cost; if(pre.currency){ const sel=$('#pCur'); if(![...sel.options].some(o=>o.value===pre.currency)) sel.add(new Option(pre.currency)); sel.value=pre.currency; } }
        if(pre.notes) $('#pNotes').value=pre.notes;
        if(pre.extra){ setStatus('done'); statusTouched=true; const ln=statsLine(Object.assign({category:pre.category}, pre.extra)); $('#pPos').textContent='📍 Route on the map'+(ln?' · '+ln:''); } }
      // location: a photo's GPS fills it (and Claude names the spot); typing + Find, or just typing, changes it
      let locDirty=false;
      const townOf=a=>String(a||'').split(',').map(x=>x.replace(/\b\d{4,6}\b/g,'').trim()).filter(Boolean).pop()||'';
      const setCity=c=>{ if(!c||cityTouched) return; const hit=cityNames.find(x=>norm(x)===norm(c)); $('#pCity').value=hit||c; };
      const nearTxt=()=>val('pCity')||((stopOnDate(trip.id, val('pDate')||todayStr())||{}).city||'');
      async function fromGps(lat, lon, guess){
        pos={lat, lon}; locDirty=false; $('#pFound').innerHTML='';
        $('#pPos').textContent='📍 From the photo\'s GPS'+(sample?' · looking up the place…':'');
        try{ const w=await whereIs(lat, lon); if(!form.isConnected||!pos||pos.lat!==lat) return;
          if(w) setCity(w.city||townOf(w.address)); // the photo's own town, even if a trip city is close by
          // a meal is at the restaurant in the photo, not the landmark next door
          const venue=isMeal(val('pCat'))?((val('pName').match(/\bat (.+)$/i)||[])[1]||''):'';
          const txt=w?[venue||w.place,w.address].filter(Boolean).join(', '):'';
