<title>Waymark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E4E9EE; --ink:#15202B; --ink-soft:#4C5967; --ink-faint:#8693A0;
    --line:#D3DAE1; --accent:#E2551B; --accent-ink:#FFFFFF; --accent-soft:#FBE4D9;
    --land:#D9DFE5; --land-visited:#F5C6AE; --sea:#F6F8FA; --border-land:#FFFFFF;
    --plane:#2F6FED; --car:#E2551B; --train:#22946A; --bus:#8E55C9; --ferry:#0E9BAD; --walk:#8A7F70;
    --good:#22946A; --shadow:0 1px 2px rgba(21,32,43,.06),0 8px 24px -12px rgba(21,32,43,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0F151B; --surface:#172029; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-soft:#A6B3BF; --ink-faint:#6E7D8A;
      --line:#2A3743; --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2216;
      --land:#25313C; --land-visited:#6B3A24; --sea:#121A21; --border-land:#0F151B;
      --plane:#6F9BFF; --car:#FF7A3D; --train:#4CC795; --bus:#B98BEB; --ferry:#3CC6D6; --walk:#B5AA9B;
      --good:#4CC795; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-soft:#A6B3BF; --ink-faint:#6E7D8A;
    --line:#2A3743; --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3A2216;
    --land:#25313C; --land-visited:#6B3A24; --sea:#121A21; --border-land:#0F151B;
    --plane:#6F9BFF; --car:#FF7A3D; --train:#4CC795; --bus:#B98BEB; --ferry:#3CC6D6; --walk:#B5AA9B;
    --good:#4CC795; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:'Barlow Condensed',system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:.01em;}

  .app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;}
  .brand b{color:var(--accent);}
  .top h1{font-size:22px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn svg{width:18px;height:18px;}
  main{padding:16px;display:flex;flex-direction:column;gap:18px;}
  .status{padding:48px 16px;text-align:center;color:var(--ink-faint);}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
  nav.tabs .in{display:flex;gap:4px;max-width:760px;width:100%;}
  nav.tabs button{flex:1;border:none;background:none;padding:6px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11.5px;font-weight:600;color:var(--ink-faint);}
  nav.tabs button svg{width:22px;height:22px;}
  nav.tabs button.on{color:var(--accent);}

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn:hover{border-color:var(--accent);}
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.small{padding:6px 10px;font-size:13px;border-radius:8px;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:#C2412D;border-color:#C2412D;background:transparent;}
  .btn:disabled{opacity:.55;cursor:default;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .sec-title h2{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);font-size:13px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .trip-card{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .trip-card:hover{border-color:var(--accent);}
  .trip-card h3{font-size:22px;font-weight:700;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);}
  .pill.accent{background:var(--accent-soft);color:var(--ink);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  /* stat strip — boarding-pass style */
  .pass{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;}
  .pass .cell{padding:10px 12px;border-right:1px dashed var(--line);}
  .pass .cell:last-child{border-right:none;}
  .pass .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .pass .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1.1;}
  @media (max-width:480px){ .pass{grid-template-columns:repeat(2,minmax(0,1fr));} .pass .cell:nth-child(2){border-right:none;} .pass .cell:nth-child(-n+2){border-bottom:1px dashed var(--line);} }

  .map-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea);}
  .map-wrap svg{display:block;width:100%;height:auto;}
  .map-ctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;}
  .map-ctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;padding:0;}
  .map-card{position:absolute;left:8px;right:52px;bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:14px;}
  .map-card[hidden]{display:none;}
  .map-card img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .days .day{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
  .days .day:last-child{border-bottom:none;}
  .days .day.today{background:var(--accent-soft);}
  .day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .day-h .btn{padding:4px 8px;}
  .day-i{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;cursor:pointer;}
  .day-i img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0;cursor:zoom-in;}
  .mini{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .mini svg{width:13px;height:13px;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}

  /* legs list */
  .legs{display:flex;flex-direction:column;}
  .leg{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .leg:last-child{border-bottom:none;}
  .leg:hover{background:var(--surface-2);}
  .mode-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;}
  .mode-badge svg{width:18px;height:18px;}
  .leg .route{font-weight:600;}
  .leg .meta{font-size:12.5px;color:var(--ink-faint);}
  .leg .km{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* cities grid */
  .cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .city{padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px;}
  .city:hover{border-color:var(--accent);}
  .city h3{font-size:20px;font-weight:700;}
  .city .thumbs{display:flex;gap:4px;margin-top:auto;}
  .city .thumbs img{width:34px;height:34px;object-fit:cover;border-radius:6px;}

  /* places */
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .place{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
  .place .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .place h3{font-family:'Figtree',sans-serif;font-size:16px;font-weight:700;letter-spacing:0;}
  .place .notes{font-size:14px;color:var(--ink-soft);white-space:pre-wrap;}
  .photos{display:flex;gap:6px;overflow-x:auto;}
  .photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in;flex-shrink:0;background:var(--surface-2);}
  .stars{color:var(--accent);letter-spacing:1px;font-size:14px;}
  .status-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;}
  .status-tag.want{background:var(--surface-2);color:var(--ink-soft);}
  .status-tag.done{background:var(--good);color:#fff;}

  /* budget */
  .budget-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14.5px;}
  .budget-row:last-child{border-bottom:none;}
  .budget-row .amt{font-family:'IBM Plex Mono',monospace;}
  .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px;}
  .bar i{display:block;height:100%;background:var(--accent);}

  /* discover */
  .reco{padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:10px;}
  .reco .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--accent);line-height:1;}
  .reco h3{font-family:'Figtree',sans-serif;font-size:15.5px;font-weight:700;}
  .reco p{margin:3px 0 0;font-size:14px;color:var(--ink-soft);}
  .reco .tip{font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:6px 9px;margin-top:6px;}

  /* world */
  .countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .country{padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:600;}
  .country .flag{font-size:22px;}

  /* sheet */
  .backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.55);display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){ .backdrop{align-items:center;} }
  .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;}
  @media (min-width:640px){ .sheet{border-radius:18px;} }
  .sheet h2{font-size:24px;font-weight:700;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;}
  .field textarea{min-height:84px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px;}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .modes button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;}
  .modes button svg{width:16px;height:16px;}
  .modes button.on{border-color:var(--accent);background:var(--accent-soft);}
  .rating{display:flex;gap:4px;}
  .rating button{border:none;background:none;font-size:24px;cursor:pointer;color:var(--line);padding:0 2px;}
  .rating button.on{color:var(--accent);}
  .hint{font-size:12.5px;color:var(--ink-faint);}
  .err{font-size:13px;color:#C2412D;}
  .confirm{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px;}

  .lightbox{position:fixed;inset:0;z-index:60;background:#05080B;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));color:#fff;}
  .lb-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:38px;}
  .lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;}
  .lb-img img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;}
  .lb-btn{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);}
  .lb-prev{left:0;} .lb-next{right:0;}
  .lb-bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding-top:10px;font-size:14px;}
  .lb-bar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .lb-bar .btn.danger{color:#FF9A85;border-color:#FF9A85;background:transparent;}
  .ph-ed{position:relative;flex-shrink:0;}
  .ph-ed img{cursor:pointer;}
  .ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .ph-cover{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);}
  .share-preview{width:100%;border-radius:12px;border:1px solid var(--line);}
  .empty{padding:28px 16px;text-align:center;color:var(--ink-soft);display:flex;flex-direction:column;gap:10px;align-items:center;}
</style>

<div class="app">
  <header class="top" id="topbar"></header>
  <main id="main"><div class="status">Loading your trips…</div></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
const WORLD = __WORLD__;
(function(){
  // ---------- state ----------
  const S = { trips:[], stops:[], legs:[], places:[], expenses:[] };
  let db = null, assets = null, sample = null, downloads = null;
  let sampleImages = 0; // how many images one Claude call can take here (0: none)
  let ready = { db:false };
  let R = { tab:'trips', tripId:null, stopId:null, placeCat:'all' };
  let discover = { city:'', interests:['Museums'], vibe:'Authentic', results:null, loading:false, error:'', forStopId:null };
  const $ = s => document.querySelector(s);
  const main = $('#main'), top = $('#topbar'), layer = $('#layer');

  const MODES = {
    plane:{label:'Flight', color:'var(--plane)', icon:'<path d="M2 16l20-8-2-2-8 3-5-6-2 1 3 6-4 1.5-2-2-1 .5 2 4z" fill="currentColor"/>'},
    car:{label:'Drive', color:'var(--car)', icon:'<path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6h-2v-2H7v2H5z M7.5 13.5a1 1 0 1 0 0-.01M16.5 13.5a1 1 0 1 0 0-.01M6.7 10h10.6l-1-3H7.7z" fill="currentColor" fill-rule="evenodd"/>'},
    train:{label:'Train', color:'var(--train)', icon:'<path d="M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-2 2.8l2 2.2h-2.5l-1.8-2H8.3l-1.8 2H4l2-2.2A3 3 0 0 1 4 15V6a3 3 0 0 1 3-3zm-1 4v4h12V7zm2 8.5a1 1 0 1 0 0-.01m8 0a1 1 0 1 0 0-.01" fill="currentColor" fill-rule="evenodd"/>'},
    bus:{label:'Bus', color:'var(--bus)', icon:'<path d="M6 3h12a2 2 0 0 1 2 2v12h-1v2h-3v-2H8v2H5v-2H4V5a2 2 0 0 1 2-2zm0 3v5h12V6zm1.5 8a1 1 0 1 0 0-.01m9 0a1 1 0 1 0 0-.01" fill="currentColor" fill-rule="evenodd"/>'},
    ferry:{label:'Boat', color:'var(--ferry)', icon:'<path d="M11 3h2v3h4l2 6-7-2-7 2 2-6h4zM3 17c2 0 3-1.5 4.5-1.5S10 17 12 17s3-1.5 4.5-1.5S19 17 21 17v2c-2 0-3-1.5-4.5-1.5S14 19 12 19s-3-1.5-4.5-1.5S5 19 3 19z" fill="currentColor"/>'},
    walk:{label:'Walk/Bike', color:'var(--walk)', icon:'<path d="M13 4a2 2 0 1 1-.01 0zM10 8l3-1 3 4 3 1-1 2-4-1-1 3 3 3v4h-2v-3l-3-2-1 5H8l2-9-2 1v3H6V9z" fill="currentColor"/>'}
  };
  const CATS = [
    ['food','Food & drink'],['restaurant','Restaurant'],['museum','Museum'],['attraction','Attraction'],['hike','Hike'],['run','Run'],
    ['hotel','Hotel'],['nightlife','Nightlife'],['shopping','Shopping'],['other','Other']
  ];
  const CAT_LABEL = Object.fromEntries(CATS);
  const CURRENCIES = ['EUR','CAD','USD','GBP','CHF','JPY','MXN'];
  const INTERESTS = ['Museums','Restaurants','Local food','Cafés','Running routes','Hikes','Hotels','Nightlife & clubs','Attractions','Day trips',
    'Ways to save money','Airport to city','Uber vs taxi vs transit','High-end shopping','Thrifting & markets','Family-friendly','Rainy day'];
  const VIBES = ['Authentic','Touristy classics','Mix of both'];

  const ICON = {
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
    trips:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z M9 7V5h6v2"/></svg>',
    world:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
    spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>',
    coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6c0 2.4-5 1-5 3.4 0 1 1 1.5 2.5 1.5s2.5-.5 2.5-1.5"/></svg>',
    camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
  };
  const modeIcon = (m) => '<svg viewBox="0 0 24 24">' + (MODES[m]||MODES.car).icon + '</svg>';

  // ---------- helpers ----------
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const now = () => new Date().toISOString();
  const pad2 = n => String(n).padStart(2,'0');
  const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
  function fmtDate(s, opts){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined, opts||{month:'short',day:'numeric'}); }
  function dayCount(a,b){ if(!a||!b) return 0; const A=new Date(a+'T12:00'),B=new Date(b+'T12:00'); return Math.round((B-A)/864e5)+1; }
  const fmtKm = n => Math.round(n).toLocaleString();
  function fmtMoney(amt, cur){ try{ return new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'EUR',maximumFractionDigits:0}).format(amt||0); }catch(e){ return (cur||'')+' '+Math.round(amt||0); } }
  function haversine(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
    const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
  const ROAD_FACTOR = { car:1.25, bus:1.25, train:1.2, ferry:1.1, walk:1.2, plane:1 };
  function flag(a2){ if(!a2||a2.length!==2) return ''; return String.fromCodePoint(...a2.toUpperCase().split('').map(c=>127397+c.charCodeAt(0))); }
  const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const tripOf = id => S.trips.find(t=>t.id===id);
  const stopOf = id => S.stops.find(s=>s.id===id);
  const tripStops = tid => S.stops.filter(s=>s.tripId===tid).sort((a,b)=>(a.arrive||'').localeCompare(b.arrive||'')||(a.order||0)-(b.order||0));
  const tripLegs = tid => S.legs.filter(l=>l.tripId===tid).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.order||0)-(b.order||0));
  function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

  function costLines(tid){
    const out=[];
    tripLegs(tid).forEach(l=>{ if(l.cost) out.push({cat:'Transport', label:(MODES[l.mode]||{}).label+': '+(stopOf(l.fromId)||{}).city+' → '+(stopOf(l.toId)||{}).city, amount:+l.cost, cur:l.currency||'EUR'}); });
    S.places.filter(p=>p.tripId===tid && p.cost).forEach(p=>{
      const cat = p.category==='hotel'?'Lodging':(p.category==='food'||p.category==='restaurant')?'Food & drink':(p.category==='shopping')?'Shopping':'Activities';
      out.push({cat, label:p.name, amount:+p.cost, cur:p.currency||'EUR'}); });
    S.expenses.filter(e=>e.tripId===tid).forEach(e=>out.push({cat:e.category||'Other', label:e.label, amount:+e.amount, cur:e.currency||'EUR', id:e.id}));
    return out;
  }
  function totalsByCur(lines){ const m={}; lines.forEach(l=>{ m[l.cur]=(m[l.cur]||0)+l.amount; }); return m; }
  function tripStats(tid){
    const legs=tripLegs(tid), stops=tripStops(tid);
    const byMode={}; let km=0;
    legs.forEach(l=>{ const k=+l.km||0; km+=k; byMode[l.mode]=(byMode[l.mode]||0)+k; });
    const cities=new Set(stops.filter(s=>!s.home).map(s=>norm(s.city)));
    const countries=new Set(stops.filter(s=>!s.home).map(s=>s.countryA2).filter(Boolean));
    const t=tripOf(tid)||{};
    return { km, byMode, cities:cities.size, countries:countries.size, days:dayCount(t.startDate,t.endDate), totals:totalsByCur(costLines(tid)) };
  }

  // ---------- data layer ----------
  const COLS = ['trips','stops','legs','places','expenses'];
  async function init(){
    renderTabs();
    if(!window.claude || !window.claude.use){ main.innerHTML='<div class="status">Open this page from claude.ai to load your trips.</div>'; return; }
    window.claude.use('sample').then(x=>{ sample=x; render();
      if(x) x.limits().then(l=>{ sampleImages=(l&&l.images&&l.images.maxCount)||0; render(); }).catch(()=>{}); });
    window.claude.use('assets').then(x=>{ assets=x; render(); });
    window.claude.use('downloads').then(x=>{ downloads=x; });
    db = await window.claude.use('db');
    if(!db){ main.innerHTML='<div class="status">Storage isn\'t available in this view. Sign in on claude.ai and reopen.</div>'; return; }
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{ S[c]=snap.docs.map(d=>Object.assign({id:d.id}, d.data()||{})); ready.db=true; schedule(); },
        err=>{ console.error(c, err); });
    });
  }
  async function put(col, id, data){ if(!db) throw new Error('offline'); return id ? db.collection(col).doc(id).set(data) : db.collection(col).add(data); }
  async function patch(col, id, data){ return db.collection(col).doc(id).update(data); }
  async function del(col, id){ return db.collection(col).doc(id).delete(); }

  // Find coordinates for a city: reuse any stop we already know, else ask Claude.
  async function geocode(name){
    const n=norm(name);
    const known=S.stops.find(s=>norm(s.city)===n && s.lat!=null);
    if(known) return {city:known.city, country:known.country, countryA2:known.countryA2, countryN3:known.countryN3, lat:known.lat, lon:known.lon};
    if(!sample) return null;
    const r = await sample.json('Give the location of this place a traveller typed: "'+name.slice(0,120)+'". Reply with only a JSON object '
      +'{"city": string (proper name), "country": string (English short name), "countryA2": string (ISO 3166-1 alpha-2), "countryN3": string (ISO 3166-1 numeric, 3 digits), "lat": number, "lon": number}. '
      +'Example: {"city":"Bilbao","country":"Spain","countryA2":"ES","countryN3":"724","lat":43.263,"lon":-2.935}', {modelTier:'quick', cache:{gcTime:86400000}});
    if(!r || typeof r.lat!=='number' || typeof r.lon!=='number') return null;
    return {city:String(r.city||name), country:String(r.country||''), countryA2:String(r.countryA2||'').toUpperCase().slice(0,2), countryN3:String(r.countryN3||'').padStart(3,'0').slice(-3), lat:r.lat, lon:r.lon};
  }

  // ---------- render ----------
  let pending=false;
  function schedule(){ if(pending) return; pending=true; requestAnimationFrame(()=>{ pending=false; render(); }); }
  function go(next){ Object.assign(R, next); window.scrollTo(0,0); render(); }

  function renderTabs(){
    const tabs=[['trips','Trips',ICON.trips],['world','My world',ICON.world],['discover','Top 10',ICON.spark]];
    $('#tabs').innerHTML = tabs.map(([k,l,i])=>'<button type="button" data-tab="'+k+'" class="'+(R.tab===k?'on':'')+'" aria-current="'+(R.tab===k?'page':'false')+'">'+i+'<span>'+l+'</span></button>').join('');
    $('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go({tab:b.dataset.tab, tripId:null, stopId:null}));
  }
  function setTop(title, opts){
    opts=opts||{};
    top.innerHTML = (opts.back?'<button class="icon-btn" id="tBack" aria-label="Back">'+ICON.back+'</button>':'')
      + (title?'<h1>'+esc(title)+'</h1>':'<div class="brand" style="flex:1">Way<b>mark</b></div>')
      + (opts.actions||'');
    if(opts.back) $('#tBack').onclick=opts.back;
  }
  function render(){
    renderTabs();
    if(!ready.db){ return; }
    if(R.tab==='trips'){ if(R.stopId) return renderCity(); if(R.tripId) return renderTrip(); return renderTrips(); }
    if(R.tab==='world') return renderWorld();
    if(R.tab==='discover') return renderDiscover();
  }

  // ---------- map ----------
  const worldFeat = topojson.feature(WORLD, WORLD.objects.countries);
  // Zoomable map. Pinch (two fingers) or the +/- buttons zoom; one finger still scrolls the page.
  // Pins and lines keep their on-screen size at any zoom. Zoom and the open pin card survive re-renders.
  const mapView={}, mapSel={};
  function drawMap(container, opts){
    const W=opts.width||720, H=opts.height||420, key=opts.key||'map', world=!!opts.world;
    const stops=(opts.stops||[]).filter(s=>s.lat!=null&&s.lon!=null), legs=opts.legs||[];
    const acts=(opts.places||[]).filter(p=>p.lat!=null&&p.lon!=null);
    const visited=new Set(opts.visitedN3||[]);
    let proj;
    if(world) proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:'Sphere'});
    else {
      const away=stops.filter(s=>!s.home);
      const pts=(away.length?away:stops).map(s=>[s.lon,s.lat]).concat(acts.map(p=>[p.lon,p.lat]));
      proj=d3.geoMercator();
      if(pts.length>=2) proj.fitExtent([[40,46],[W-100,H-46]],{type:'MultiPoint',coordinates:pts});
      else if(pts.length===1) proj.scale(2400).center(pts[0]).translate([W/2,H/2]);
      else proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:'Sphere'});
      if(pts.length&&proj.scale()>40000){ // one tight cluster: don't zoom past street level
        const c=[d3.mean(pts,p=>p[0]), d3.mean(pts,p=>p[1])]; proj.scale(40000); const q=proj(c), t=proj.translate(); proj.translate([t[0]+W/2-q[0], t[1]+H/2-q[1]]); }
    }
    const path=d3.geoPath(proj);
    const svg=d3.create('svg').attr('viewBox',[0,0,W,H]).attr('role','img').attr('aria-label',opts.label||'Map').style('touch-action','pan-x pan-y');
    svg.append('rect').attr('width',W).attr('height',H).attr('fill','var(--sea)');
    const g=svg.append('g');
    g.append('g').selectAll('path').data(worldFeat.features).join('path').attr('d',path)
      .attr('fill',d=>visited.has(String(d.id))?'var(--land-visited)':'var(--land)').attr('stroke','var(--border-land)').attr('stroke-width',.6).attr('vector-effect','non-scaling-stroke');
    const lines=[], marks=[];
    // side trips: dotted line from the city to each activity pin
    const gx=g.append('g').attr('fill','none').attr('stroke','var(--accent)').attr('opacity',.7);
    if(!world) acts.forEach(p=>{ const s=stopOf(p.stopId); if(!s||s.lat==null) return;
      const d=path({type:'LineString',coordinates:[[s.lon,s.lat],[p.lon,p.lat]]}); if(d) lines.push({el:gx.append('path').attr('d',d), w:1.6, dash:[2,4]}); });
    const gl=g.append('g').attr('fill','none').attr('stroke-linecap','round');
    const ga=g.append('g');
    const order=legs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.order||0)-(b.order||0));
    const legEls=[];
    order.forEach(l=>{
      const a=stopOf(l.fromId), b=stopOf(l.toId); if(!a||!b||a.lat==null||b.lat==null) return;
      const d=path({type:'LineString',coordinates:[[a.lon,a.lat],[b.lon,b.lat]]}); if(!d) return;
      const color=(MODES[l.mode]||MODES.car).color;
      const ln={el:gl.append('path').attr('d',d).attr('stroke',color).attr('opacity',.95), w:world?1.6:3.2, dash:l.mode==='plane'?[7,6]:l.mode==='train'?[2,5]:null};
      lines.push(ln); legEls.push(ln);
      if(world) return;
      // direction arrow halfway along the leg
      const gi=d3.geoInterpolate([a.lon,a.lat],[b.lon,b.lat]), m=proj(gi(.5)), p0=proj(gi(.45)), p1=proj(gi(.55));
      if(!m||!p0||!p1||Math.hypot(p1[0]-p0[0],p1[1]-p0[1])<.01) return;
      const node=ga.append('g').node();
      d3.select(node).append('path').attr('d','M-5,-5 L5,0 L-5,5 Z').attr('fill',color).attr('stroke','var(--sea)').attr('stroke-width',1.5)
        .attr('transform','rotate('+(Math.atan2(p1[1]-p0[1],p1[0]-p0[0])*180/Math.PI)+')');
      marks.push({node, x:m[0], y:m[1]});
    });
    const gs=g.append('g');
    const items={};
    const pin=(x,y,id,draw)=>{ const node=gs.append('g').attr('data-pin',id).style('cursor','pointer').node(); draw(d3.select(node)); marks.push({node,x,y}); };
    if(world){
      stops.forEach(s=>{ const p=proj([s.lon,s.lat]); if(!p) return; items['s:'+s.id]={type:'stop', s};
        pin(p[0],p[1],'s:'+s.id,m=>{ m.append('circle').attr('r',12).attr('fill','transparent'); m.append('circle').attr('r',3.5).attr('fill','var(--surface)').attr('stroke','var(--ink)').attr('stroke-width',1.4); }); });
    } else {
      // one numbered pin per city, in visiting order; home shows as a small dot
      const seen=new Map(); let n=0;
      stops.slice().sort((a,b)=>(a.arrive||'').localeCompare(b.arrive||'')||(a.order||0)-(b.order||0)).forEach(s=>{
        const k=(s.home?'home:':'')+norm(s.city); if(seen.has(k)){ seen.get(k).visits.push(s); return; }
        const it={type:'stop', s, visits:[s], n:s.home?0:++n}; seen.set(k,it); items['s:'+s.id]=it;
        const p=proj([s.lon,s.lat]); if(!p) return;
        pin(p[0],p[1],'s:'+s.id,m=>{
          m.append('circle').attr('r',16).attr('fill','transparent');
          if(s.home){ m.append('circle').attr('r',5).attr('fill','var(--surface)').attr('stroke','var(--ink)').attr('stroke-width',2); }
          else { m.append('circle').attr('r',10).attr('fill','var(--ink)').attr('stroke','var(--surface)').attr('stroke-width',2);
            m.append('text').text(it.n).attr('text-anchor','middle').attr('dy','.35em').attr('fill','var(--surface)').attr('font-size',11).attr('font-weight',700).attr('font-family','Figtree, sans-serif'); }
          m.append('text').text(s.city).attr('x',s.home?9:14).attr('y',4).attr('font-family','Figtree, sans-serif').attr('font-size',13).attr('font-weight',700)
            .attr('fill','var(--ink)').attr('paint-order','stroke').attr('stroke','var(--sea)').attr('stroke-width',3.5);
        });
      });
      acts.forEach(p=>{ const q=proj([p.lon,p.lat]); if(!q) return; items['p:'+p.id]={type:'place', p};
        pin(q[0],q[1],'p:'+p.id,m=>{ m.append('circle').attr('r',14).attr('fill','transparent');
          m.append('rect').attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('rx',3).attr('transform','rotate(45)')
            .attr('fill',p.status==='done'?'var(--accent)':'var(--surface)').attr('stroke',p.status==='done'?'var(--surface)':'var(--accent)').attr('stroke-width',2); }); });
    }
    const apply=t=>{ g.attr('transform',t); const k=t.k;
      marks.forEach(m=>m.node.setAttribute('transform','translate('+m.x+','+m.y+') scale('+(1/k)+')'));
      lines.forEach(l=>{ l.el.attr('stroke-width',l.w/k); if(!l.anim) l.el.attr('stroke-dasharray',l.dash?l.dash.map(v=>v/k).join(' '):null); }); };
    const zoom=d3.zoom().scaleExtent(world?[1,30]:[.02,60])
      .filter(e=>(!e.ctrlKey||e.type==='wheel')&&!e.button&&!(e.touches&&e.touches.length<2))
      .on('zoom',e=>{ mapView[key]=e.transform; apply(e.transform); });
    svg.call(zoom).on('dblclick.zoom',null);
    svg.call(zoom.transform, mapView[key]||d3.zoomIdentity);
    container.innerHTML=''; container.appendChild(svg.node());
    // controls
    const ctl=document.createElement('div'); ctl.className='map-ctl';
    ctl.innerHTML='<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button><button type="button" aria-label="Reset view">⤢</button>'+(!world&&legEls.length?'<button type="button" aria-label="Replay the route">▶</button>':'');
    const [bIn,bOut,bReset,bPlay]=ctl.querySelectorAll('button');
    bIn.onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,2);
    bOut.onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,.5);
    bReset.onclick=()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);
    if(bPlay) bPlay.onclick=()=>{ const k=(mapView[key]||d3.zoomIdentity).k, step=Math.max(350,Math.min(900,6000/legEls.length));
      legEls.forEach((l,i)=>{ const L=l.el.node().getTotalLength(); l.anim=true;
        l.el.interrupt().attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L)
          .transition().delay(i*step).duration(step).ease(d3.easeCubicInOut).attr('stroke-dashoffset',0)
          .on('end interrupt',()=>{ l.anim=false; l.el.attr('stroke-dashoffset',null).attr('stroke-dasharray',l.dash?l.dash.map(v=>v/((mapView[key]||d3.zoomIdentity).k)).join(' '):null); }); }); void k; };
    container.appendChild(ctl);
    // tap a pin: info card at the bottom of the map
    const card=document.createElement('div'); card.className='map-card'; card.hidden=true; container.appendChild(card);
    const show=id=>{ const it=items[id]; mapSel[key]=it?id:null; if(!it){ card.hidden=true; return; }
      let html='', act=null;
      if(it.type==='stop'){ const s=it.s, visits=it.visits||[s]; const ids=visits.map(v=>v.id);
        const np=S.places.filter(p=>ids.includes(p.stopId)).length, t=tripOf(s.tripId);
        const ph=[].concat(...visits.map(v=>v.photoIds||[]))[0];
        html=(ph?'<img alt="" src="/_blob/'+ph+'">':'')+'<div style="flex:1;min-width:0"><b>'+flag(s.countryA2)+' '+esc(s.city)+'</b><div class="faint">'
          +(world&&t?esc(t.name)+' · ':'')+visits.map(v=>fmtDate(v.arrive)+(v.depart&&v.depart!==v.arrive?' – '+fmtDate(v.depart):'')).join(' & ')+(world?'':' · '+np+' activit'+(np===1?'y':'ies'))+'</div></div>';
        if(opts.onStop&&!s.home) act=()=>opts.onStop(s);
      } else { const p=it.p;
        html=((p.photoIds||[])[0]?'<img alt="" src="/_blob/'+p.photoIds[0]+'">':'')+'<div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><div class="faint">'+(p.date?fmtDate(p.date,{weekday:'short',month:'short',day:'numeric'})+' · ':'')
          +(p.status==='done'?'Been':'Want to go')+(p.rating?' · '+'★'.repeat(p.rating):'')+'</div></div>';
        if(opts.onPlace) act=()=>opts.onPlace(p);
      }
      card.innerHTML=html+(act?'<button type="button" class="btn small">Open</button>':'')+'<button type="button" class="btn small ghost" aria-label="Close">✕</button>';
      const bs=card.querySelectorAll('button'); if(act) bs[0].onclick=act; bs[bs.length-1].onclick=()=>show(null);
      card.hidden=false; };
    svg.on('click',e=>{ const t=e.target.closest('[data-pin]'); show(t?t.getAttribute('data-pin'):null); });
    if(mapSel[key]) show(mapSel[key]);
  }
  function legendHtml(modes, acts){
    return '<div class="legend">'+modes.map(m=>'<span><i class="dot" style="background:'+MODES[m].color+'"></i>'+MODES[m].label+'</span>').join('')
      + (acts?'<span><i class="dot" style="background:var(--accent);border-radius:2px;transform:rotate(45deg)"></i>Activity</span>':'')+'</div>';
  }

  // ---------- trips list ----------
  function renderTrips(){
    setTop('', {actions:'<button class="btn small primary" id="newTrip">'+ICON.plus+' Trip</button>'});
    $('#newTrip').onclick=()=>tripSheet(null);
    const trips=S.trips.slice().sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
    if(!trips.length){
      main.innerHTML='<div class="card empty"><h2 style="font-size:26px">Your first trip</h2><p>Add a trip, then the flights, drives and trains between cities. Waymark maps the route and adds it to your world.</p><button class="btn primary" id="emptyNew">'+ICON.plus+' New trip</button></div>';
      $('#emptyNew').onclick=()=>tripSheet(null); return;
    }
    const t0=todayStr();
    main.innerHTML='<div class="sec-title"><h2>Trips</h2><span class="faint">'+trips.length+' trip'+(trips.length===1?'':'s')+'</span></div>'
      + trips.map(t=>{
        const st=tripStats(t.id); const live = t.startDate<=t0 && t0<=t.endDate; const soon = t.startDate>t0;
        const money=Object.entries(st.totals).map(([c,a])=>fmtMoney(a,c)).join(' · ');
        return '<div class="card trip-card" data-trip="'+t.id+'"><div class="between"><h3>'+esc(t.name)+'</h3>'

  function whoPaidHtml(list){
    const m={}; list.filter(e=>e.paidBy).forEach(e=>{ const k=e.paidBy; m[k]=m[k]||{}; m[k][e.currency||'EUR']=(m[k][e.currency||'EUR']||0)+(+e.amount||0); });
    const names=Object.keys(m); if(!names.length) return '';
    return '<div class="sec-title"><h2 style="font-size:18px">Who paid</h2><span class="faint">Expenses only</span></div><div class="card">'
      + names.sort().map(n=>'<div class="budget-row"><span>'+esc(n)+'</span><span class="amt">'+Object.entries(m[n]).map(([c,a])=>fmtMoney(a,c)).join(' + ')+'</span></div>').join('')+'</div>';
  }
  function budgetHtml(tid){
    const lines=costLines(tid);
    if(!lines.length) return '<div class="card empty"><p>Add a cost to any leg, place or expense and the trip total builds here.</p></div>';
    const tot=totalsByCur(lines);
    const byCat={}; lines.forEach(l=>{ const k=l.cat+'|'+l.cur; byCat[k]=(byCat[k]||0)+l.amount; });
    const max=Math.max(...Object.values(byCat));
    const other=S.expenses.filter(e=>e.tripId===tid);
    return '<div class="card">'+Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,a])=>{ const [cat,cur]=k.split('|');
        return '<div class="budget-row" style="display:block"><div class="between"><span>'+esc(cat)+'</span><span class="amt">'+fmtMoney(a,cur)+'</span></div><div class="bar"><i style="width:'+Math.round(a/max*100)+'%"></i></div></div>'; }).join('')
      + '<div class="budget-row" style="font-weight:700"><span>Total</span><span class="amt">'+Object.entries(tot).map(([c,a])=>fmtMoney(a,c)).join(' + ')+'</span></div></div>'
      + (other.length?'<div class="card">'+other.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>'<div class="budget-row" data-exp="'+e.id+'" style="cursor:pointer;gap:10px"><span style="min-width:0">'+esc(e.label)+' <span class="faint">· '+esc(e.category||'Other')+(e.date?' · '+fmtDate(e.date):'')+(e.city?' · '+esc(e.city):'')+(e.paidBy?' · paid by '+esc(e.paidBy):'')+'</span>'
          + (e.notes?'<span class="faint" style="display:block;white-space:pre-wrap">'+esc(e.notes)+'</span>':'')+'</span><span class="amt" style="display:flex;gap:8px;align-items:center;flex-shrink:0">'+((e.photoIds||[]).length?'<img alt="Receipt" src="/_blob/'+e.photoIds[0]+'" data-photo="'+e.photoIds[0]+'" style="width:32px;height:32px;object-fit:cover;border-radius:6px;cursor:zoom-in">':'')+fmtMoney(e.amount,e.currency)+'</span></div>').join('')+'</div>':'')
      + whoPaidHtml(other)
      + '<div class="faint">Totals are kept per currency; no exchange rates are applied.</div>';
  }

    if(!discover.city.trim()){ discover.error='Type a city first.'; render(); return; }
    if(!discover.interests.length){ discover.error='Pick at least one thing you\'re looking for.'; render(); return; }

    discoverCtl=new AbortController();
    const prompt='You are a sharp local travel guide. City: '+discover.city.slice(0,80)+'. The traveller wants: '+discover.interests.join(', ')+'. Vibe: '+discover.vibe+'.'
      + (discover.extra?' Extra context: '+discover.extra.slice(0,200)+'.':'')
      + ' Give exactly 10 specific, real recommendations (named places, routes or concrete tactics), ranked best first. For practical topics (airport transfer, Uber vs taxi, saving money) give concrete options with typical prices. '
      + 'Reply with only a JSON array of 10 objects: {"name": string, "category": string (one of: food, restaurant, museum, attraction, hike, run, hotel, nightlife, shopping, transport, tip), "why": string (max 25 words), "area": string (neighbourhood or distance), "price": string (e.g. "€", "€€€", "~€18", "free"), "tip": string (one insider tip, max 20 words)}.';
    try{
      const r=await sample.json(prompt,{signal:discoverCtl.signal, cache:{gcTime:3600000}});
      if(!Array.isArray(r)||!r.length) throw {code:'invalid_json'};
      discover.results=r.slice(0,10).map(x=>({name:String(x.name||''),category:String(x.category||''),why:String(x.why||''),area:String(x.area||''),price:String(x.price||''),tip:String(x.tip||'')}));
      discover.resultsTitle='Top 10 · '+discover.city;
    }catch(e){
      const c=e&&e.code;
      discover.error = c==='not_granted'||c==='sampling_disabled'?'Claude isn\'t allowed for this page, so recommendations are off.'
        : c==='rate_limited'?'Too many requests right now. Try again in a minute.'
        : c==='cancelled'?'' : c==='invalid_json'?'The answer came back in the wrong format. Try again.':'Couldn\'t get recommendations. Check your connection and try again.';
    }finally{ discover.loading=false; render(); }
  }
  async function saveReco(r){
    let stop = discover.forStopId && stopOf(discover.forStopId);
    if(!stop || norm(stop.city)!==norm(discover.city)) stop = S.stops.find(s=>norm(s.city)===norm(discover.city) && !s.home);
    if(!stop){ toast('Add '+discover.city+' to a trip first, then save'); return; }
    const catMap={transport:'other',tip:'other'};
    const cat = CAT_LABEL[r.category] ? r.category : (catMap[r.category]||'other');
    await put('places', null, {tripId:stop.tripId, stopId:stop.id, name:r.name, category:cat, status:'want', notes:[r.why, r.tip?'Tip: '+r.tip:'', r.area?'Where: '+r.area:''].filter(Boolean).join('\n'), price:r.price||'', source:'top10', createdAt:now(), updatedAt:now()});
    toast('Saved to '+stop.city);
  }

  async function ensureStop(trip, name, dateArrive, dateDepart){
    const n=norm(name);
    // reuse a stop in this trip if the dates touch it
    const existing=tripStops(trip.id).filter(s=>norm(s.city)===n);
    const hit=existing.find(s=>(dateArrive&&(s.arrive===dateArrive||s.depart===dateArrive))||(dateDepart&&(s.depart===dateDepart||s.arrive===dateDepart)))
      || (existing.length===1 && !dateArrive ? existing[0] : null);
    if(hit){
      const up={}; if(dateArrive && (!hit.arrive||dateArrive<hit.arrive)) up.arrive=dateArrive; if(dateDepart && (!hit.depart||dateDepart>hit.depart)) up.depart=dateDepart;
      if(Object.keys(up).length) await patch('stops', hit.id, up);
      return Object.assign({}, hit, up);
    }
    const g=await geocode(name);
    if(!g) throw new Error('Couldn\'t find "'+name+'". Check the spelling, or add country (e.g. "Pau, France").');
    const data=Object.assign(g,{tripId:trip.id, arrive:dateArrive||dateDepart||'', depart:dateDepart||dateArrive||'', order:Date.now(), photoIds:[], createdAt:now()});
    const ref=await put('stops', null, data);
    return Object.assign({id:ref.id}, data);
  }

  // Stops no remaining leg uses: delete the empty ones, say which still hold activities or photos.
  async function dropEmptyStops(ids, goneLegId){
    const kept=[];
    for(const id of [...new Set(ids)]){ const s=stopOf(id); if(!s) continue;
      if(S.legs.some(l=>l.id!==goneLegId&&(l.fromId===id||l.toId===id))) continue;
      const busy=(s.photoIds||[]).length||S.places.some(p=>p.stopId===id)||S.expenses.some(e=>e.stopId===id);
      if(busy){ kept.push(s.city); continue; }
      try{ await del('stops', id); }catch(e){}
    }
    if(kept.length) setTimeout(()=>toast([...new Set(kept)].join(', ')+' still has activities or photos. Open it and use Remove city to take it off the trip.'), 300);
  }
  // Remove a city (every visit to it in this trip) with its legs and activities. Photos stay in storage; expenses keep their city name.
  async function removeCity(stops){
    const ids=stops.map(x=>x.id);
    for(const l of S.legs.filter(l=>ids.includes(l.fromId)||ids.includes(l.toId))) await del('legs', l.id);
    for(const p of S.places.filter(p=>ids.includes(p.stopId))) await del('places', p.id);
    for(const e of S.expenses.filter(e=>ids.includes(e.stopId))) await patch('expenses', e.id, {stopId:''});
    for(const id of ids) await del('stops', id);
  }

      + '<div class="grid2"><div class="field"><label for="pCat">Type</label><select id="pCat">'+CATS.map(([k,l])=>'<option value="'+k+'"'+((p?p.category:'attraction')===k?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'
      + '<div class="field"><label>Status</label><div class="row"><button type="button" class="chip '+(status==='done'?'on':'')+'" data-st="done">Been</button><button type="button" class="chip '+(status==='want'?'on':'')+'" data-st="want">Want to go</button></div></div></div>'

      + '<div class="grid3"><div class="field"><label for="pCost">Price (optional)</label><input id="pCost" inputmode="decimal" value="'+esc(p&&p.cost?p.cost:'')+'"></div><div class="field"><label for="pCur">Currency</label>'+curSelect('pCur', p?p.currency:trip.currency)+'</div></div>'
      + '<div class="field"><label for="pNotes">Notes</label><textarea id="pNotes" placeholder="What you did, what you ordered, would you go back?">'+esc(p?p.notes||'':'')+'</textarea></div>'
      + '<div class="hint" id="pPos">'+(pos?'📍 On the map':'')+'</div>'

      + '<div class="row"><button class="btn primary" type="submit" id="pSave">Save</button><button class="btn" type="button" id="xCancel">Cancel</button>'+(p?'<button class="btn danger" type="button" id="xDel" style="margin-left:auto">Delete</button>':'')+'</div>',
    form=>{
      $('#xCancel').onclick=closeSheet;

      const sync=()=>{ if(!form.isConnected) return; $('#pSave').disabled=uploading||reading;
        const rb=$('#pRead'); if(rb){ rb.hidden=!(picked.length||photoIds.length); rb.disabled=uploading||reading; } };
      const orig=photoIds.slice(), added=[];
      const pEl=$('#pPhotos'), drawEd=pEl?photoEditor(pEl, ()=>photoIds, v=>{ photoIds=v; }, sync):null;
      const drawPhotos=()=>{ if(drawEd) drawEd(); sync(); };
      const setStatus=s=>{ status=s; form.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x.dataset.st===s)); };

      form.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ statusTouched=true; setStatus(b.dataset.st); });
      $('#rating').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const r=+b.dataset.r; rating = rating===r?0:r; $('#rating').querySelectorAll('button').forEach(x=>x.classList.toggle('on', +x.dataset.r<=rating)); });
      $('#pCity').onchange=()=>{ cityTouched=true; };
      $('#pDate').onchange=()=>{ const d=val('pDate'); if(!cityTouched){ const s=stopOnDate(trip.id,d); if(s) $('#pCity').value=s.city; } if(!statusTouched&&d) setStatus(d>todayStr()?'want':'done'); };
      async function addFiles(fs, autoRead){
        picked=picked.concat(fs);
        if(assets){ uploading=true; sync(); hint('Uploading…'); const up=await uploadPhotos(fs); added.push(...up); photoIds=photoIds.concat(up); uploading=false; if(!form.isConnected) return; drawPhotos(); hint(''); }
        sync();
        if(autoRead&&canRead) await fill();
        else if(!p){ // no Claude here: still take date and place from the photo itself
          const m=await readExif(fs[0]); if(!form.isConnected||!m) return;
          if(m.date&&!val('pName').trim()){ $('#pDate').value=m.date; $('#pDate').onchange(); }

      async function fill(){
        let imgs=picked.slice(-sampleImages);

      if(p) $('#xDel').onclick=()=>confirmDelete(form,'"'+p.name+'"', ()=>del('places', p.id));
      form.onsubmit=async e=>{ e.preventDefault();
        const name=val('pName').trim(); if(!name){ const er=$('#fErr'); er.hidden=false; er.textContent='Say what it was (a name is enough).'; return; }
        const date=val('pDate'), city=val('pCity');
        const same=tStops.filter(s=>s.city===city);
        const st=same.find(s=>date&&s.arrive<=date&&date<=(s.depart||s.arrive))||same[0]||cur;
        const c=parseFloat(val('pCost').replace(',','.'));
        // a position Claude guessed for another name is stale; a photo's GPS stays
        const keep=pos&&(pos.name==null||pos.name===name);
        const data={tripId:trip.id, stopId:st.id, name, category:val('pCat'), date, status, rating, cost:isFinite(c)?c:0, currency:val('pCur'), notes:val('pNotes').trim(), photoIds, updatedAt:now()};
        if(keep){ data.lat=pos.lat; data.lon=pos.lon; }
        let id=p&&p.id;
        if(p){ if(!keep&&p.lat!=null){ data.lat=null; data.lon=null; } await patch('places', p.id, data); }
        else id=(await put('places', null, Object.assign({createdAt:now()}, data))).id;
        closeSheet();
        for(const x of orig.concat(added)) if(!photoIds.includes(x)) forgetAsset(x, p);
        if(!keep&&id) locatePlaces([Object.assign({id}, data)]).catch(()=>{});
      };
    });
  }

  function payers(tid){ const set=new Set(['Me']); S.expenses.filter(e=>e.tripId===tid&&e.paidBy).forEach(e=>set.add(e.paidBy)); return [...set]; }
  function lastPayer(tid){ const l=S.expenses.filter(e=>e.tripId===tid&&e.paidBy).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))[0]; return l?l.paidBy:'Me'; }

  // Ask Claude about a photo. want: 'expense' | 'activity' | 'any' (Claude decides receipt vs activity).
  // Where it happened comes from, in order: the photo's GPS near a trip city, what Claude reads or
  // recognises, then the trip city you were in on that date.
  async function readPhoto(trip, imgs, want){
    let meta=null; for(const f of imgs){ meta=await readExif(f); if(meta) break; }
    const stops=tripStops(trip.id).filter(s=>!s.home);
    let near=null;
    if(meta&&meta.lat!=null) stops.forEach(s=>{ if(s.lat==null) return; const d=haversine(meta,s); if(!near||d<near.d) near={s,d}; });
    const blobs=await Promise.all(imgs.map(shrink));
    const r=await sample.json('Look at this travel photo and turn it into an entry for a trip journal.\n'
      + 'Trip: "'+String(trip.name||'').slice(0,80)+'", '+(trip.startDate||'?')+' to '+(trip.endDate||'?')+', main currency '+(trip.currency||'EUR')+'.\n'
      + 'Cities on the trip: '+(stops.slice(0,40).map(s=>s.city+', '+(s.country||'')+' ('+(s.arrive||'?')+' to '+(s.depart||'?')+')').join('; ')||'none yet')+'.\n'
      + 'Photo metadata: '+(meta&&meta.date?'taken '+meta.date+(meta.time?' '+meta.time:''):'no date')
      + (meta&&meta.lat!=null?', GPS '+meta.lat.toFixed(5)+','+meta.lon.toFixed(5)+(near?' (≈'+Math.round(near.d)+' km from '+near.s.city+')':''):', no GPS')+'.\n'
      + 'Today is '+todayStr()+'.\n'
      + (want==='expense'?'It is a receipt, bill, ticket or price tag (kind "receipt").\n'
        : want==='activity'?'It shows something the traveller did or visited: a place, view, activity, meal or event (kind "activity").\n'
        : 'Decide whether it is a receipt, bill, ticket or price tag (kind "receipt") or a photo of a place, view, activity, meal or event (kind "activity").\n')
      + 'Reply with only a JSON object: {"kind": "receipt" or "activity", '
      + '"name": string (receipt: merchant and item, e.g. "Dinner at Bar Nestor"; activity: the specific place or activity, e.g. "Dune du Pilat", "Guggenheim Bilbao", "Surf lesson, Côte des Basques"; max 50 characters), '
      + '"amount": number or null (receipt: final total paid incl. tax and tip; activity: only if a price is visible), "currency": ISO 4217 code or null, '
      + '"expenseCategory": one of '+JSON.stringify(EXP_CATS)+', "activityCategory": one of '+JSON.stringify(CATS.map(c=>c[0]))+', '
      + '"date": "YYYY-MM-DD" or null (date printed on it, else the photo date), '
      + '"city": string or null (the trip city it belongs to when within about 40 km of one, else the real nearest town), '
      + '"lat": number or null, "lon": number or null (where the place is: the GPS if given, else your best estimate for the place you named; null if you cannot tell), '
      + '"notes": string (one short line of useful detail: what you see, main items, ticket route; "" if nothing useful)}.', {images:blobs});
    const o=r&&typeof r==='object'?r:{};
    const num=v=>typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(',','.'));
    const amt=num(o.amount), la=num(o.lat), lo=num(o.lon);
    const out={ kind:want==='expense'?'receipt':want==='activity'?'activity':(o.kind==='receipt'?'receipt':'activity'),
      name:String(o.name||o.label||'').trim().slice(0,80), amount:isFinite(amt)?Math.round(amt*100)/100:null,
      currency:/^[A-Za-z]{3}$/.test(o.currency||'')?o.currency.toUpperCase():'',
      expCat:EXP_CATS.includes(o.expenseCategory)?o.expenseCategory:'', actCat:CAT_LABEL[o.activityCategory]?o.activityCategory:'',
      date:/^\d{4}-\d\d-\d\d$/.test(o.date||'')?o.date:(meta&&meta.date)||'', notes:String(o.notes||'').trim().slice(0,300), city:'', lat:null, lon:null };
    if(meta&&meta.lat!=null){ out.lat=meta.lat; out.lon=meta.lon; }
    else if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180&&(la||lo)){ out.lat=la; out.lon=lo; }
    if(near&&near.d<40) out.city=near.s.city;
    if(!out.city&&o.city){ const m=stops.find(s=>norm(s.city)===norm(o.city)); out.city=m?m.city:String(o.city).slice(0,80); }
    if(!out.city&&out.lat!=null){ let b=null; stops.forEach(s=>{ if(s.lat==null) return; const d=haversine(out,s); if(d<40&&(!b||d<b.d)) b={s,d}; }); if(b) out.city=b.s.city; }
    if(!out.city&&out.date){ const s=stopOnDate(trip.id,out.date); if(s) out.city=s.city; }
    return out;
  }
  function photoError(e){ const c=e&&e.code;
    return c==='not_granted'||c==='sampling_disabled'?'Claude isn\'t allowed here. Fill it in by hand.'
      : c==='image_rejected'?'Claude couldn\'t open that image. Try a JPEG or a sharper shot.'
      : c==='rate_limited'?'Too many requests. Try again in a minute.'
      : c==='cancelled'?'' : 'Couldn\'t read the photo. Try again, or fill it in by hand.'; }

  // Coordinates for activities that have none, so they get a pin. One quick Claude call for the lot.
  async function locatePlaces(list){
    if(!sample||!list.length) return 0;
    const rows=list.slice(0,40).map((p,i)=>{ const s=stopOf(p.stopId)||{}; return {i, name:p.name, near:[s.city,s.country].filter(Boolean).join(', ')}; });
    const r=await sample.json('Give coordinates for each of these places a traveller logged. Reply with only a JSON array of {"i": number, "lat": number, "lon": number}, '
      +'one per place you can locate (skip ones you cannot). Places: '+JSON.stringify(rows), {modelTier:'quick', cache:{gcTime:86400000}});
    let n=0;
    for(const x of Array.isArray(r)?r:[]){ const p=list[+x.i]; const la=+x.lat, lo=+x.lon;
      if(!p||!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180) continue;
      const s=stopOf(p.stopId); if(s&&s.lat!=null&&haversine({lat:la,lon:lo},s)>300) continue; // implausibly far from its city
      try{ await patch('places', p.id, {lat:la, lon:lo}); n++; }catch(e){}
    }
    return n;
  }

  function stopOnDate(tid, d){ const xs=tripStops(tid).filter(s=>!s.home&&s.arrive&&s.arrive<=d&&d<=(s.depart||s.arrive)); return xs.find(s=>s.arrive!==d)||xs[xs.length-1]||null; }

        +' <span class="faint">'+esc(cities.join(' → '))+'</span></div><div class="row" style="flex-wrap:nowrap;gap:4px"><button type="button" class="btn small ghost" data-shareday="'+d+'" aria-label="Share '+fmtDate(d)+'">'+ICON.share+'</button><button type="button" class="btn small ghost" data-addact="'+d+'" aria-label="Add an activity on '+fmtDate(d)+'">'+ICON.plus+'</button></div></div>'
        + legs.map(l=>{ const a=stopOf(l.fromId)||{}, b=stopOf(l.toId)||{};
            return '<div class="day-i" data-leg="'+l.id+'"><span class="mini" style="background:'+(MODES[l.mode]||MODES.car).color+'">'+modeIcon(l.mode)+'</span><span style="flex:1">'+esc(a.city||'?')+' → '+esc(b.city||'?')+'</span><span class="faint mono">'+(l.kmEstimated?'≈':'')+fmtKm(l.km||0)+' km</span></div>'; }).join('')
        + acts.map(p=>'<div class="day-i" data-pl="'+p.id+'"><span class="status-tag '+(p.status==='done'?'done':'want')+'">'+(p.status==='done'?'Been':'Want')+'</span><span style="flex:1;min-width:0">'+esc(p.name)
            +(p.rating?' <span class="stars">'+'★'.repeat(p.rating)+'</span>':'')+'</span>'+(p.photoIds||[]).slice(0,3).map(id=>'<img alt="" src="/_blob/'+id+'" data-photo="'+id+'">').join('')+'</div>').join('')
        + exps.map(e=>'<div class="day-i" data-exp="'+e.id+'"><span class="mini" style="background:var(--ink-faint)">'+ICON.coin+'</span><span style="flex:1;min-width:0">'+esc(e.label)+'</span><span class="faint mono">'+fmtMoney(e.amount,e.currency)+'</span></div>').join('')

  // Date and GPS from a JPEG's EXIF block (null when absent or not a JPEG).
  async function readExif(file){
    try{
      const v=new DataView(await file.slice(0,262144).arrayBuffer());
      if(v.getUint16(0)!==0xFFD8) return null;
      let o=2;
      while(o+10<v.byteLength){
        const m=v.getUint16(o); if((m&0xFF00)!==0xFF00) return null;
        if(m===0xFFE1&&v.getUint32(o+4)===0x45786966) return parseTiff(v, o+10);
        o+=2+v.getUint16(o+2);
      }
    }catch(e){}
    return null;
  }
  function parseTiff(v, t){
    const le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
    const ifd=p=>{ const out={}, n=u16(t+p); for(let i=0;i<n;i++){ const e=t+p+2+i*12; out[u16(e)]={count:u32(e+4), off:e+8}; } return out; };
    const str=e=>{ const p=e.count>4?t+u32(e.off):e.off; let s=''; for(let i=0;i<e.count;i++){ const c=v.getUint8(p+i); if(!c) break; s+=String.fromCharCode(c); } return s; };
    const rats=e=>{ const p=t+u32(e.off), r=[]; for(let i=0;i<e.count;i++) r.push(u32(p+i*8)/(u32(p+i*8+4)||1)); return r; };
    const out={}, i0=ifd(u32(t+4));
    const ex=i0[0x8769]?ifd(u32(i0[0x8769].off)):{};
    const d=ex[0x9003]||ex[0x9004]||i0[0x0132];
    const dm=d&&str(d).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
    if(dm){ out.date=dm[1]+'-'+dm[2]+'-'+dm[3]; out.time=dm[4]+':'+dm[5]; }
    if(i0[0x8825]){ const g=ifd(u32(i0[0x8825].off));
      if(g[2]&&g[4]){ const dms=a=>a[0]+(a[1]||0)/60+(a[2]||0)/3600; let lat=dms(rats(g[2])), lon=dms(rats(g[4]));
        if(g[1]&&str(g[1])==='S') lat=-lat; if(g[3]&&str(g[3])==='W') lon=-lon;
        if(isFinite(lat)&&isFinite(lon)&&(lat||lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180){ out.lat=lat; out.lon=lon; } } }
    return out.date||out.lat!=null?out:null;
  }

  // ---------- photos ----------
  async function shrink(file){
    try{
      const bmp=await createImageBitmap(file, {imageOrientation:'from-image'});
      const max=1600, k=Math.min(1, max/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));
    }catch(e){ return file; }
  }
  async function uploadPhotos(files){
    if(!assets||!files||!files.length) return [];
    const ids=[];
    for(const f of Array.from(files).slice(0,12)){
      try{ const blob=await shrink(f); const r=await assets.upload(blob,{type:blob.type&&blob.type.startsWith('image/')?blob.type:'image/jpeg'}); ids.push(r.id); }
      catch(e){ toast(e&&e.code==='quota_or_state'?'Photo storage is full':'A photo failed to upload'); }
    }
    return ids;
  }
  // ---------- photo viewer: browse, make cover, replace, delete ----------
  // A photo id can sit in stops, places or expenses (photoIds[]). Edits apply to every row holding it.
  function photoRows(id){ const out=[]; ['stops','places','expenses'].forEach(c=>S[c].forEach(r=>{ if((r.photoIds||[]).includes(id)) out.push({c,r}); })); return out; }
  async function editPhotoRows(id, fn){ for(const {c,r} of photoRows(id)) await patch(c, r.id, {photoIds:fn(r.photoIds||[])}); }
  // Delete the stored file once nothing points at it any more. Never throws.
  async function forgetAsset(id, exceptRow){
    if(!assets) return;
    const still=photoRows(id).some(({r})=>r!==exceptRow&&r.id!==(exceptRow&&exceptRow.id));
    if(!still){ try{ await assets.delete(id); }catch(e){} }
  }
  // every row holding it was just edited, so the file can go
  async function dropAsset(id){ if(!assets) return; try{ await assets.delete(id); }catch(e){} }
  let lbEl=null;
  function lightbox(id, list){
    list=(list&&list.length?list:((photoRows(id)[0]||{}).r||{}).photoIds)||[id];
    let i=Math.max(0,list.indexOf(id)), busy=false, confirmDel=false;
    if(lbEl) lbEl.remove();
    lbEl=document.createElement('div'); lbEl.className='lightbox'; lbEl.setAttribute('role','dialog'); lbEl.setAttribute('aria-label','Photo');
    document.body.appendChild(lbEl);
    const close=()=>{ if(lbEl){ lbEl.remove(); lbEl=null; } document.removeEventListener('keydown', onKey); };
    const onKey=e=>{ if(e.key==='Escape') close(); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1); };
    document.addEventListener('keydown', onKey);
    const step=d=>{ if(list.length<2) return; i=(i+d+list.length)%list.length; confirmDel=false; draw(); };
    const draw=()=>{ if(!lbEl) return; const cur=list[i];
      lbEl.innerHTML='<div class="lb-top"><span>'+(list.length>1?(i+1)+' / '+list.length:'')+'</span><button type="button" class="lb-btn" data-a="close" aria-label="Close">✕</button></div>'
        + '<div class="lb-img"><img alt="" src="/_blob/'+cur+'">'
        + (list.length>1?'<button type="button" class="lb-btn lb-prev" data-a="prev" aria-label="Previous">‹</button><button type="button" class="lb-btn lb-next" data-a="next" aria-label="Next">›</button>':'')+'</div>'
        + (assets?'<div class="lb-bar">'+(confirmDel

      $('#shFrom').onchange=()=>{ o.from=val('shFrom'); presetTitle=''; sync(); };
      $('#shTo').onchange=()=>{ o.to=val('shTo'); presetTitle=''; sync(); };
      $('#shFmt').querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ o.format=b.dataset.fmt; $('#shFmt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); later(); });
      $('#shShow').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const k=b.dataset.show; o[k]=!o[k]; b.classList.toggle('on',o[k]); later(); });
      $('#shTitle').oninput=()=>{ titleTouched=true; o.title=val('shTitle'); if(!capTouched) $('#cap').value=caption(t,o); later(); };
      $('#cap').oninput=()=>{ capTouched=true; };
      $('#copyCap').onclick=async()=>{ const txt=val('cap'); try{ await navigator.clipboard.writeText(txt); toast('Caption copied'); }catch(e){ const ta=$('#cap'); ta.focus(); ta.select(); $('#shareHint').textContent='Press copy on your keyboard to copy the selected caption.'; } };
      const fname=()=>((o.title||t.name).replace(/→/g,'-').replace(/[^\w\- ]+/g,'').replace(/\s+/g,' ').trim()||'trip')+'.png';
      const blob=()=>new Promise(r=>canvas.toBlob(r,'image/png'));
      const sn=$('#shareNow'); if(sn) sn.onclick=async()=>{ if(!canvas) return; sn.disabled=true;
        try{ const file=new File([await blob()], fname(), {type:'image/png'});
          if(!navigator.canShare({files:[file]})) throw {name:'NotAllowedError'};
          try{ await navigator.clipboard.writeText(val('cap')); }catch(e){}
          await navigator.share({files:[file], text:val('cap')}); }
        catch(e){ if(!e||e.name!=='AbortError') $('#shareHint').textContent='Sharing straight to apps isn\'t allowed here. Save the image instead, or long‑press the preview.'; }
        finally{ sn.disabled=false; } };
      const btn=$('#saveImg');
      if(!downloads){ btn.hidden=true; if(!canShare) $('#shareHint').textContent='Long‑press the preview to save it, then post it from your photos.'; }
      else btn.onclick=async()=>{ if(!canvas) return; btn.disabled=true;
        try{ await downloads.save({filename:fname(), data:await blob()}); toast('Saved'); }
        catch(e){ if(e&&e.code!=='declined') $('#shareHint').textContent='Couldn\'t save the image. Long‑press the preview to save it instead.'; }
        finally{ btn.disabled=false; } };
      sync();
    });
  }

  init();
})();
</script>
