    const sheetXml=sh=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + (sh.widths?'<cols>'+sh.widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>':'')

  // every cost on the trip with its date: legs, meals/activities, expenses, stays
  function costRows(tid){
    const rows=[], city=id=>(stopOf(id)||{}).city||'';
    tripLegs(tid).forEach(l=>{ if(!+l.cost) return; rows.push({date:l.date||'', time:hhmm(l), type:'Transport', cat:LEG_CAT[l.mode]||'Transport', what:(MODES[l.mode]||{}).label+': '+city(l.fromId)+' → '+city(l.toId), city:city(l.fromId), amount:+l.cost, cur:l.currency||'EUR', paid:'', notes:l.notes||''}); });
    S.places.filter(p=>p.tripId===tid&&+p.cost).forEach(p=>rows.push({date:p.date||'', time:hhmm(p), type:MEAL_KEYS.has(p.category)?'Meal':'Activity', cat:p.category==='hotel'?'Lodging':MEAL_KEYS.has(p.category)?'Meals':p.category==='shopping'?'Shopping':'Activities', what:p.name+(MEAL_KEYS.has(p.category)?' ('+(CAT_LABEL[p.category]||'')+')':''), city:city(p.stopId), amount:+p.cost, cur:p.currency||'EUR', paid:p.paidBy||'', notes:p.notes||''}));
    S.expenses.filter(e=>e.tripId===tid).forEach(e=>rows.push({date:e.date||'', time:hhmm(e), type:'Expense', cat:e.category==='Transport'?(RIDE_CAT[expIcon('Transport',e.label)]||'Transport'):(e.category||'Other'), what:e.label, city:e.city||city(e.stopId), amount:+e.amount||0, cur:e.currency||'EUR', paid:e.paidBy||'', notes:e.notes||''}));
    S.stays.filter(x=>x.tripId===tid&&+x.cost).forEach(x=>rows.push({date:x.checkIn||'', time:'', type:'Stay', cat:'Lodging', what:x.name+' · '+stayNights(x)+' night'+(stayNights(x)===1?'':'s'), city:x.city||city(x.stopId), amount:+x.cost, cur:x.currency||'EUR', paid:x.paidBy||'', notes:[x.platform,x.bookingRef].filter(Boolean).join(' · ')}));
    return rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  }
  async function exportExpenses(t){
    if(!downloads){ toast('Saving files isn\'t available here.'); return; }
    const rows=costRows(t.id); if(!rows.length){ toast('No costs to export yet.'); return; }
    const head=['Date','Time','Type','Category','Description','City','Amount','Currency','Paid by','Notes'];
    const list=[head].concat(rows.map(r=>[r.date,r.time,r.type,r.cat,r.what,r.city,Math.round(r.amount*100)/100,r.cur,r.paid,r.notes]));
    const by={}; rows.forEach(r=>{ const k=r.cat+'|'+r.cur; by[k]=(by[k]||0)+r.amount; });
    const tot={}; rows.forEach(r=>{ tot[r.cur]=(tot[r.cur]||0)+r.amount; });
    const cats=[['Category','Currency','Total']].concat(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{ const [c,cur]=k.split('|'); return [c,cur,Math.round(v*100)/100]; }))
      .concat(Object.entries(tot).map(([c,v])=>['Total',c,Math.round(v*100)/100]));
    const who={}; rows.filter(r=>r.paid).forEach(r=>{ const k=r.paid+'|'+r.cur; who[k]=(who[k]||0)+r.amount; });
    const payers=[['Paid by','Currency','Total']].concat(Object.entries(who).sort().map(([k,v])=>{ const [n,cur]=k.split('|'); return [n,cur,Math.round(v*100)/100]; }));
    const sheets=[{name:'Expenses', rows:list, widths:[11,7,10,16,40,16,11,9,12,30]}, {name:'By category', rows:cats, widths:[18,10,12]}];
    if(payers.length>1) sheets.push({name:'Who paid', rows:payers, widths:[16,10,12]});
    const data=xlsx(sheets), name=(t.name||'Trip').replace(/[^\w\- ]+/g,'').replace(/\s+/g,' ').trim()+' – expenses.xlsx';
    try{ await downloads.save({filename:name, data}); toast('Saved'); }
    catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='extension_not_enabled'?'Excel files can\'t be saved here.':'Couldn\'t save the file.'); }
  }

  // photos → groups (same moment: within 40 min and ~1 km) → one entry each

          + '<div class="ed-range">Volume <input type="range" id="edVol" min="0" max="100" step="5" value="80"><span class="mono" id="edVolV">80%</span></div>'
          + '<div class="row"><button type="button" class="chip on" id="edFade">Fade out at the end</button><button type="button" class="btn small" id="edListen">▶ Listen</button></div>'
          + '<div class="hint">Plays while it records, so turn your sound on. Instagram and TikTok can also add their own music after you post.</div></div></div>'
        + '<div class="field"><label>Pace</label><div class="chips" id="edPace"><button type="button" class="chip" data-pace="0.75">Quick</button><button type="button" class="chip on" data-pace="1">Normal</button><button type="button" class="chip" data-pace="1.35">Relaxed</button></div></div>'
        + '<div class="field"><label>Scenes <span style="text-transform:none;letter-spacing:0;font-weight:500">(untick to cut, or make one longer)</span></label><div id="edScenes" class="faint">…</div></div>'
        + '<div class="field" id="edPhF"><label>Photo edits <span style="text-transform:none;letter-spacing:0;font-weight:500">(only on what you share; your photos stay as they are)</span></label><div id="edPhotos"></div></div>'
        + '</div></details>':'')
      + '<div class="field"><label for="cap">Caption</label><textarea id="cap"></textarea></div>'
      + '<div class="row">'+(canShare?'<button class="btn primary" type="button" id="shareNow" disabled>'+ICON.share+' Share…</button>':'')
      + '<button class="btn primary" type="button" id="saveVid" hidden>Save video</button>'
      + '<button class="btn'+(canShare?'':' primary')+'" type="button" id="saveImg" disabled>Save image</button>'
      + (videoType()!==null?'<button class="btn" type="button" id="mkVid">🎬 Video</button>':'')
      + '<button class="btn" type="button" id="copyCap">Copy caption</button><button class="btn" type="button" id="xCancel">Close</button></div>'
      + '<div class="hint" id="shareHint"></div>',
    ()=>{
      $('#xCancel').onclick=closeSheet;
      const sheet=$('#sheet');
      let vidBlob=null, vidTok=0, vidUrl=null;
      const dropVideo=()=>{ vidTok++; vidBlob=null; if(vidUrl){ URL.revokeObjectURL(vidUrl); vidUrl=null; } $('#saveVid').hidden=true; const m=$('#mkVid'); if(m){ m.disabled=false; m.textContent='🎬 Video'; } };
      const redraw=async()=>{ const tok=++drawTok; dropVideo(); const cv=await makeCard(t, o); if(tok!==drawTok||!sheet.isConnected) return; canvas=cv;
        $('#cardBox').innerHTML='<img class="share-preview" style="max-height:46vh;width:auto;max-width:100%" alt="Share image preview" src="'+cv.toDataURL('image/jpeg',.85)+'">';
        const s=$('#shareNow'); if(s) s.disabled=false; const b=$('#saveImg'); if(b) b.disabled=!downloads; };
      let timer=null; const later=()=>{ clearTimeout(timer); timer=setTimeout(redraw,200); const e=$('#shEd'); if(e&&e.open) setTimeout(drawScenes,400); };
      const sync=()=>{ // range changed: refresh title, photos, caption
        if(o.to<o.from){ const x=o.to; o.to=o.from; o.from=x; }
        $('#shFrom').value=o.from; $('#shTo').value=o.to;
        $('#shPre').querySelectorAll('[data-pre]').forEach(b=>{ const p=presets[+b.dataset.pre]; b.classList.toggle('on',p.city?o.city===p.city:(!o.city&&p.from===o.from&&p.to===o.to)); });
        const onChip=$('#shPre .chip.on'); if(onChip){ const bx=$('#shPre'); bx.scrollLeft=Math.max(0,onChip.offsetLeft-bx.offsetLeft-12); }
        if(!titleTouched){ o.title=presetTitle||defaultTitle(t,o.from,o.to); $('#shTitle').value=o.title; }
        const sl=shareSlice(t,o.from,o.to,o.city,o.hide), avail=sl.photos;
        drawActPick();
        o.photoIds=picksTouched?o.photoIds.filter(id=>avail.includes(id)):sl.pick.slice();
        $('#shPicsF').hidden=!avail.length;
        const drawPics=()=>{ $('#shPics').innerHTML=avail.map(id=>{ const n=o.photoIds.indexOf(id);
            return '<span style="position:relative;flex-shrink:0;width:84px;display:flex;flex-direction:column;gap:2px"><img alt="" src="/_blob/'+id+'" data-pick="'+id+'" style="'+(n>=0?'outline:3px solid var(--accent);outline-offset:-3px':'opacity:.5')+'">'
              +'<small style="font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(sl.owner[id]||'')+'</small>'
              +(n>=0?'<b style="position:absolute;top:4px;left:4px;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center">'+(n+1)+'</b>':'')+'</span>'; }).join('');
          $('#shPics').querySelectorAll('[data-pick]').forEach(im=>im.onclick=()=>{ picksTouched=true; const id=im.dataset.pick, n=o.photoIds.indexOf(id);
            if(n>=0) o.photoIds.splice(n,1); else if(o.photoIds.length<4) o.photoIds.push(id); else { toast('Up to 4 photos'); return; }
            drawPics(); later(); });
          $('#shPicN').textContent='('+o.photoIds.length+' of 4 picked · tap to add or remove)'; };
        drawPics();
        if(!capTouched) $('#cap').value=caption(t,o);
        later();
      };
      $('#shPre').querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ const p=presets[+b.dataset.pre]; o.from=p.from; o.to=p.to; o.city=p.city||''; presetTitle=p.title||''; picksTouched=false; sync(); });
      $('#shFrom').onchange=()=>{ o.from=val('shFrom'); o.city=''; presetTitle=''; picksTouched=false; sync(); };
      $('#shTo').onchange=()=>{ o.to=val('shTo'); o.city=''; presetTitle=''; picksTouched=false; sync(); };
      $('#shFmt').querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ o.format=b.dataset.fmt; $('#shFmt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); later(); });
      function drawActPick(){ const all=shareSlice(t,o.from,o.to,o.city).acts, box=$('#shActs');
        box.parentElement.hidden=!all.length;
        box.innerHTML=all.map(p=>'<label class="ed-row'+(o.hide[p.id]?' off':'')+'" style="cursor:pointer"><input type="checkbox" data-hid="'+p.id+'"'+(o.hide[p.id]?'':' checked')+'><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+catIcon(p.category)+' '+esc(p.name)+'</span>'+(p.private?'<span class="faint">🔒</span>':'')+'</label>').join('');
        box.querySelectorAll('[data-hid]').forEach(c=>c.onchange=()=>{ if(c.checked) delete o.hide[c.dataset.hid]; else o.hide[c.dataset.hid]=true; sync(); }); }
      $('#shPriv').querySelectorAll('[data-priv]').forEach(b=>b.onclick=()=>{ const k=b.dataset.priv; o.priv[k]=!o.priv[k]; b.classList.toggle('on',o.priv[k]);
        const on=Object.entries(o.priv).filter(([,v])=>v).map(([k])=>({spots:'only cities show on the map',names:'activities show as their type (e.g. "Lunch")',times:'no times',dates:'"4 days" instead of dates'}[k]));
        $('#shPrivHint').textContent=on.length?'Hiding: '+on.join(', ')+'.':'Prices are off unless you turn them on above. Contacts and notes never go on a share.';
        if(!capTouched) $('#cap').value=caption(t,o); later(); });
      $('#shShow').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const k=b.dataset.show; o[k]=!o[k]; b.classList.toggle('on',o[k]); later(); });
      $('#shTitle').oninput=()=>{ titleTouched=true; o.title=val('shTitle'); if(!capTouched) $('#cap').value=caption(t,o); later(); };
      $('#cap').oninput=()=>{ capTouched=true; };
      $('#copyCap').onclick=async()=>{ const txt=val('cap'); try{ await navigator.clipboard.writeText(txt); toast('Caption copied'); }catch(e){ const ta=$('#cap'); ta.focus(); ta.select(); $('#shareHint').textContent='Press copy on your keyboard to copy the selected caption.'; } };
      const base=()=>(o.title||t.name).replace(/→/g,'-').replace(/[^\w\- ]+/g,'').replace(/\s+/g,' ').trim()||'trip', fname=()=>base()+'.png';
      const vidName=()=>base()+(vidBlob&&/mp4/.test(vidBlob.type)?'.mp4':'.webm');
      const blob=()=>new Promise(r=>canvas.toBlob(r,'image/png'));
      const sn=$('#shareNow'); if(sn) sn.onclick=async()=>{ if(!canvas) return; sn.disabled=true;
        try{ const file=vidBlob?new File([vidBlob], vidName(), {type:vidBlob.type}):new File([await blob()], fname(), {type:'image/png'});
          if(!navigator.canShare({files:[file]})) throw {name:'NotAllowedError'};
          try{ await navigator.clipboard.writeText(val('cap')); }catch(e){}
          await navigator.share({files:[file], text:val('cap')}); }
        catch(e){ if(!e||e.name!=='AbortError') $('#shareHint').textContent='Sharing straight to apps isn\'t allowed here. Save the image instead, or long‑press the preview.'; }
        finally{ sn.disabled=false; } };
      const btn=$('#saveImg');
      if(!downloads){ btn.hidden=true; if(!canShare) $('#shareHint').textContent='Long‑press the preview to save it, then post it from your photos.'; }
      else btn.onclick=async()=>{ if(!canvas) return; btn.disabled=true;
        try{ await downloads.save({filename:fname(), data:await blob()}); toast('Saved'); }
        catch(e){ if(e&&e.code!=='declined') $('#shareHint').textContent='Couldn\'t save the image. Long‑press the preview to save it instead.'; }
        finally{ btn.disabled=false; } };
      const mk=$('#mkVid');
      if(mk) mk.onclick=async()=>{ dropVideo(); stopListen(); const tok=vidTok; mk.disabled=true; $('#shareHint').textContent='';
        const alive=()=>tok===vidTok&&sheet.isConnected;
        // the audio context has to start inside the tap
        let actx=null; if(music.kind!=='none'){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){ actx=null; } }
        try{
          const plan=await routeVideoPlan(t, JSON.parse(JSON.stringify(o))); if(!alive()) return;
          let audio=null;
          if(actx){ mk.textContent='Making music…'; const buf=music.kind==='file'?music.buf:await makeTune(music.kind, plan.T+2); if(!alive()) return;
            if(buf) audio={ctx:actx, buf, start:music.kind==='file'?music.start:0, vol:music.vol, fade:music.fade}; }
          const cv=document.createElement('canvas'); cv.className='share-preview'; cv.style.cssText='max-height:46vh;width:auto;max-width:100%';
          $('#cardBox').innerHTML=''; $('#cardBox').appendChild(cv);
          const vb=await recordRouteVideo(plan, cv, tau=>{ if(alive()) mk.textContent='Recording '+Math.min(100,Math.round(tau/plan.T*100))+'%'; }, alive, audio);
          if(!vb||!alive()) return;
          vidBlob=vb; vidUrl=URL.createObjectURL(vb);
          $('#cardBox').innerHTML='<video class="share-preview" style="max-height:46vh;width:auto;max-width:100%" src="'+vidUrl+'" controls playsinline muted loop autoplay></video>';
          $('#saveVid').hidden=!downloads; mk.textContent='🎬 Again';
          $('#shareHint').textContent=Math.round(plan.T)+' s video'+(audio?' with music (unmute the player to hear it)':'')+(/mp4/.test(vb.type)?'':' (WebM)')+'. Change any option to go back to the image.';
        }catch(e){ if(alive()) $('#shareHint').textContent='Couldn\'t record a video here: '+((e&&e.message)||e); }
        finally{ if(tok===vidTok) mk.disabled=false; if(actx) actx.close().catch(()=>{}); } };
      // ----- editor: music, pace, scenes, photo edits
      const ed=$('#shEd');
      let listen=null; function stopListen(){ if(listen){ try{ listen.src.stop(); }catch(e){} listen.ctx.close().catch(()=>{}); listen=null; } const b=$('#edListen'); if(b) b.textContent='▶ Listen'; }
      const mm=sec=>Math.floor(sec/60)+':'+pad2(Math.floor(sec%60));
      const drawMusic=()=>{ if(!ed) return; ed.querySelectorAll('[data-mu]').forEach(b=>b.classList.toggle('on',b.dataset.mu===music.kind));
        $('#edMuOpts').hidden=music.kind==='none'; $('#edMuOpts').style.display=music.kind==='none'?'none':'flex';
        $('#edStartRow').hidden=music.kind!=='file'; $('#edSongName').textContent=music.kind==='file'?'🎵 '+music.name+' · '+mm(music.buf.duration):'';
        $('#edFade').classList.toggle('on',music.fade); };
      const edLater=()=>{ clearTimeout(edTimer); edTimer=setTimeout(drawScenes,350); };
      let edTimer=null, sceneTok=0;
      async function drawScenes(){ if(!ed||!ed.open) return; const tok=++sceneTok; let plan;
        try{ plan=await routeVideoPlan(t, JSON.parse(JSON.stringify(o))); }catch(e){ return; } if(tok!==sceneTok||!sheet.isConnected) return;
        $('#edLen').textContent='≈ '+Math.round(plan.T)+' s';
        const E=o.edit;
        $('#edScenes').className=''; $('#edScenes').innerHTML=plan.scenes.map(sc=>{ const off=!!E.off[sc.id], m=String(E.mult[sc.id]||1);
          return '<div class="ed-row'+(off?' off':'')+'"><input type="checkbox" data-son="'+esc(sc.id)+'"'+(off?'':' checked')+(sc.id==='outro'?' disabled':'')+' aria-label="Keep this scene"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(sc.label)+'</span>'
            + '<select data-smul="'+esc(sc.id)+'" aria-label="Length"'+(off?' disabled':'')+'>'+[['0.6','Short'],['1','Normal'],['1.6','Long'],['2.4','Longer']].map(([v,l])=>'<option value="'+v+'"'+(v===m?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'; }).join('');
        $('#edScenes').querySelectorAll('[data-son]').forEach(c=>c.onchange=()=>{ if(c.checked) delete E.off[c.dataset.son]; else E.off[c.dataset.son]=true; changed(); });
        $('#edScenes').querySelectorAll('[data-smul]').forEach(c=>c.onchange=()=>{ if(c.value==='1') delete E.mult[c.dataset.smul]; else E.mult[c.dataset.smul]=+c.value; changed(); });
        drawPhotoEd(); }
      function drawPhotoEd(){ const ids=o.photoIds.slice(0,4); $('#edPhF').hidden=!ids.length;
        $('#edPhotos').innerHTML=ids.map(id=>{ const f=o.photoFx[id]||{};
          return '<div class="ed-row"><img class="ed-ph" alt="" src="/_blob/'+id+'" style="transform:rotate('+(f.rot||0)+'deg);filter:'+(PHOTO_CSS[f.fx||'none']||'none')+';object-position:'+(f.focus==='top'?'center top':f.focus==='bottom'?'center bottom':'center')+'">'
            + '<button type="button" class="btn small" data-rot="'+id+'" aria-label="Rotate">⟳</button>'
            + '<select data-fx="'+id+'" aria-label="Look">'+Object.entries(PHOTO_FX).map(([k,l])=>'<option value="'+k+'"'+((f.fx||'none')===k?' selected':'')+'>'+l+'</option>').join('')+'</select>'
            + '<select data-focus="'+id+'" aria-label="Framing">'+[['center','Middle'],['top','Top'],['bottom','Bottom']].map(([k,l])=>'<option value="'+k+'"'+((f.focus||'center')===k?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'; }).join('');
        const fx=id=>o.photoFx[id]=o.photoFx[id]||{};
        $('#edPhotos').querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{ const f=fx(b.dataset.rot); f.rot=((f.rot||0)+90)%360; drawPhotoEd(); later(); });
        $('#edPhotos').querySelectorAll('[data-fx]').forEach(c=>c.onchange=()=>{ fx(c.dataset.fx).fx=c.value; drawPhotoEd(); later(); });
        $('#edPhotos').querySelectorAll('[data-focus]').forEach(c=>c.onchange=()=>{ fx(c.dataset.focus).focus=c.value; drawPhotoEd(); later(); }); }
      function changed(){ dropVideo(); restoreImage(); edLater(); }
      function restoreImage(){ if(canvas&&!$('#cardBox img')) $('#cardBox').innerHTML='<img class="share-preview" style="max-height:46vh;width:auto;max-width:100%" alt="Share image preview" src="'+canvas.toDataURL('image/jpeg',.85)+'">'; }
      if(ed){
        ed.addEventListener('toggle',()=>{ if(ed.open) drawScenes(); });
        ed.querySelectorAll('[data-mu]').forEach(b=>b.onclick=()=>{ stopListen(); const k=b.dataset.mu;
          if(k==='file'){ $('#edSong').click(); return; } music.kind=k; drawMusic(); changed(); });
        $('#edSong').onchange=async()=>{ const f=($('#edSong').files||[])[0]; $('#edSong').value=''; if(!f) return;
          $('#edSongName').textContent='Opening '+f.name+'…'; $('#edMuOpts').hidden=false; $('#edMuOpts').style.display='flex';
          try{ const ab=await f.arrayBuffer(), oc=new OfflineAudioContext(2,44100,44100);
            const buf=await new Promise((res,rej)=>{ const pr=oc.decodeAudioData(ab,res,rej); if(pr&&pr.then) pr.then(res,rej); });
            music.kind='file'; music.buf=buf; music.name=f.name.replace(/\.[^.]+$/,''); music.start=0;
            const st=$('#edStart'); st.max=String(Math.max(0,Math.floor(buf.duration-5))); st.value='0'; $('#edStartV').textContent='0:00';
            drawMusic(); changed(); }
          catch(e){ $('#edSongName').textContent='Couldn\'t open that file. Try an MP3 or M4A saved on your phone.'; } };
        $('#edStart').oninput=()=>{ music.start=+$('#edStart').value; $('#edStartV').textContent=mm(music.start); };
        $('#edStart').onchange=()=>{ changed(); if(listen){ stopListen(); $('#edListen').click(); } };
        $('#edVol').oninput=()=>{ music.vol=+$('#edVol').value/100; $('#edVolV').textContent=$('#edVol').value+'%'; if(listen) listen.gain.gain.value=music.vol; };
        $('#edVol').onchange=changed;
        $('#edFade').onclick=()=>{ music.fade=!music.fade; drawMusic(); changed(); };
        $('#edListen').onclick=async()=>{ if(listen){ stopListen(); return; } const b=$('#edListen');
          const ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); listen={ctx, src:{stop(){}}, gain:ctx.createGain()};
          b.textContent='…'; const mine=listen;
          const buf=music.kind==='file'?music.buf:await makeTune(music.kind, 20); if(listen!==mine||!buf) return;
          const src=ctx.createBufferSource(); src.buffer=buf; mine.gain.gain.value=music.vol; src.connect(mine.gain); mine.gain.connect(ctx.destination);
          src.start(0, music.kind==='file'?music.start:0, 20); src.onended=()=>{ if(listen===mine) stopListen(); }; mine.src=src; b.textContent='■ Stop'; };
        ed.querySelectorAll('[data-pace]').forEach(b=>b.onclick=()=>{ o.edit.pace=+b.dataset.pace; ed.querySelectorAll('[data-pace]').forEach(x=>x.classList.toggle('on',x===b)); changed(); });
        new MutationObserver(()=>{ if(!sheet.isConnected) stopListen(); }).observe(document.getElementById('layer'),{childList:true});
      }
      const sv=$('#saveVid');
      sv.onclick=async()=>{ if(!vidBlob||!downloads) return; sv.disabled=true;
        try{ await downloads.save({filename:vidName(), data:vidBlob}); toast('Saved'); }
        catch(e){ if(e&&e.code!=='declined') $('#shareHint').textContent='Couldn\'t save the video.'; }
        finally{ sv.disabled=false; } };
      sync();
    });
  }

  init();
})();
</script>
